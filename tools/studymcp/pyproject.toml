[project]
name = "studymcp"
version = "0.1.0"
description = "Local MCP server over the Pre-Q study notes: retrieval, exam links and adaptive drill state."
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
studymcp = "studymcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studymcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
