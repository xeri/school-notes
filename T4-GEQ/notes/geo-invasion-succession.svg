<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><rect width="800" height="470" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Invasion and succession (and filtering outwards)</text><text x="210" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">CBD</text><text x="325" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Inner city</text><text x="475" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Inner suburbs</text><text x="620" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Outer suburbs</text><text x="735" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Fringe</text><text x="30" y="135" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Time 1</text><rect x="170" y="90" width="80" height="75" fill="#e3a3a0" stroke="#173b50" stroke-width="1.2"/><rect x="250" y="90" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="400" y="90" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="550" y="90" width="140" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="690" y="90" width="90" height="75" fill="#e1efd9" stroke="#173b50" stroke-width="1.2"/><circle cx="325" cy="127" r="22" fill="#a9cde6" stroke="#173b50" stroke-width="1.5"/><text x="325" y="133" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">A</text><circle cx="475" cy="127" r="22" fill="#b5d6a3" stroke="#173b50" stroke-width="1.5"/><text x="475" y="133" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">B</text><circle cx="620" cy="127" r="22" fill="#ecd986" stroke="#173b50" stroke-width="1.5"/><text x="620" y="133" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">C</text><text x="30" y="230" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Time 2</text><rect x="170" y="185" width="80" height="75" fill="#e3a3a0" stroke="#173b50" stroke-width="1.2"/><rect x="250" y="185" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="400" y="185" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="550" y="185" width="140" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="690" y="185" width="90" height="75" fill="#e1efd9" stroke="#173b50" stroke-width="1.2"/><circle cx="300" cy="222" r="22" fill="#efc08f" stroke="#173b50" stroke-width="1.5"/><text x="300" y="228" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">N</text><circle cx="350" cy="222" r="22" fill="#a9cde6" stroke="#173b50" stroke-width="1.5"/><text x="350" y="228" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">A</text><circle cx="475" cy="222" r="22" fill="#b5d6a3" stroke="#173b50" stroke-width="1.5"/><text x="475" y="228" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">B</text><circle cx="620" cy="222" r="22" fill="#ecd986" stroke="#173b50" stroke-width="1.5"/><text x="620" y="228" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">C</text><text x="30" y="325" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Time 3</text><rect x="170" y="280" width="80" height="75" fill="#e3a3a0" stroke="#173b50" stroke-width="1.2"/><rect x="250" y="280" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="400" y="280" width="150" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="550" y="280" width="140" height="75" fill="#eceff1" stroke="#173b50" stroke-width="1.2"/><rect x="690" y="280" width="90" height="75" fill="#e1efd9" stroke="#173b50" stroke-width="1.2"/><circle cx="325" cy="317" r="22" fill="#efc08f" stroke="#173b50" stroke-width="1.5"/><text x="325" y="323" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">N</text><circle cx="475" cy="317" r="22" fill="#a9cde6" stroke="#173b50" stroke-width="1.5"/><text x="475" y="323" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">A</text><circle cx="620" cy="317" r="22" fill="#b5d6a3" stroke="#173b50" stroke-width="1.5"/><text x="620" y="323" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">B</text><circle cx="735" cy="317" r="22" fill="#ecd986" stroke="#173b50" stroke-width="1.5"/><text x="735" y="323" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">C</text><path d="M110 140L110 223.7" fill="none" stroke="#8796a0" stroke-width="2"/><path d="M110 230L106.3 221.8L113.7 221.8Z" fill="#8796a0" stroke-linejoin="round"/><path d="M110 235L110 318.7" fill="none" stroke="#8796a0" stroke-width="2"/><path d="M110 325L106.3 316.8L113.7 316.8Z" fill="#8796a0" stroke-linejoin="round"/><text x="258" y="275" font-family="Arial" font-size="13" fill="#a8383b" font-weight="bold">N invades</text><path d="M325 349L468.7 349" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M475 349L466.8 352.7L466.8 345.3Z" fill="#a8383b" stroke-linejoin="round"/><path d="M475 349L618.7 349" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M625 349L616.8 352.7L616.8 345.3Z" fill="#a8383b" stroke-linejoin="round"/><path d="M625 349L731.7 349" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M738 349L729.8 352.7L729.8 345.3Z" fill="#a8383b" stroke-linejoin="round"/><text x="30" y="390" font-family="Arial" font-size="14" fill="#173b50">Invasion: a new group (N, often recent migrants or a new land use) moves into an area occupied by another.</text><text x="30" y="407.5" font-family="Arial" font-size="14" fill="#173b50">Succession: the original group (A) moves out and N takes over; A in turn invades the next zone out, and so on.</text><text x="30" y="425" font-family="Arial" font-size="14" fill="#173b50">Each group moves outwards as its income rises, so the city’s social zones keep shifting — the dynamic idea</text><text x="30" y="442.5" font-family="Arial" font-size="14" fill="#173b50">behind the Burgess model. Land uses do the same: offices invading inner-city housing is commercial invasion.</text></svg>
