<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="800" height="540" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The geomorphic cycle</text><rect x="280" y="68" width="240" height="74" rx="8" fill="#f4d6d4" stroke="#173b50" stroke-width="1.5"/><text x="400" y="93" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">1  Land building (tectonic)</text><text x="400" y="112" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">folding, faulting, volcanism</text><text x="400" y="129" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">uplift new relief</text><rect x="520" y="168" width="240" height="74" rx="8" fill="#f8f0c6" stroke="#173b50" stroke-width="1.5"/><text x="640" y="193" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">2  Weathering</text><text x="640" y="212" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">rock broken down in place</text><text x="640" y="229" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">(physical, chemical, biological)</text><rect x="520" y="338" width="240" height="74" rx="8" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="640" y="363" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">3  Erosion and transport</text><text x="640" y="382" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">by rivers, ice, wind, the sea</text><text x="640" y="399" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">and mass movement</text><rect x="280" y="433" width="240" height="74" rx="8" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><text x="400" y="458" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">4  Deposition</text><text x="400" y="477" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">sediment dropped in lowlands,</text><text x="400" y="494" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">deltas and on the sea floor</text><rect x="40" y="338" width="240" height="74" rx="8" fill="#efe1d1" stroke="#173b50" stroke-width="1.5"/><text x="160" y="363" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">5  Burial and lithification</text><text x="160" y="382" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">compaction and cementation</text><text x="160" y="399" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">→ sedimentary rock</text><rect x="40" y="168" width="240" height="74" rx="8" fill="#e6ddf1" stroke="#173b50" stroke-width="1.5"/><text x="160" y="193" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">6  Heat and pressure</text><text x="160" y="212" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">at depth → metamorphic rock,</text><text x="160" y="229" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">or melting → magma</text><path d="M520 115L592.3 160.2" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M600 165L587.1 163.2L592.7 154.2Z" fill="#c16b20" stroke-linejoin="round"/><path d="M640 245L640 325.9" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M640 335L634.7 323.1L645.3 323.1Z" fill="#c16b20" stroke-linejoin="round"/><path d="M600 415L528.1 450.9" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M520 455L528.2 445L533 454.4Z" fill="#c16b20" stroke-linejoin="round"/><path d="M280 455L208.1 419.1" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M200 415L213 415.6L208.2 425Z" fill="#c16b20" stroke-linejoin="round"/><path d="M160 335L160 254.1" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M160 245L165.3 256.9L154.7 256.9Z" fill="#c16b20" stroke-linejoin="round"/><path d="M200 165L272.3 119.8" fill="none" stroke="#c16b20" stroke-width="3.5"/><path d="M280 115L272.7 125.8L267.1 116.8Z" fill="#c16b20" stroke-linejoin="round"/><text x="400" y="270" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">Landscape is built,</text><text x="400" y="292" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">worn down, and its</text><text x="400" y="314" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">material recycled</text><text x="400" y="345" font-family="Arial" font-size="13" fill="#233b4d" text-anchor="middle">Uplift and denudation act</text><text x="400" y="362" font-family="Arial" font-size="13" fill="#233b4d" text-anchor="middle">at the same time</text></svg>
