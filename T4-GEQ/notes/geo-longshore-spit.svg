<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Longshore drift and the formation of a spit</text><rect x="30" y="60" width="740" height="420" fill="#8cc3e6"/><path d="M30 60L770 60L770 110L640 112L520 120L480 200L30 200Z" fill="#dfe8d4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M30 200L480 200L480 218L30 218Z" fill="#f0dfa6" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M470 200L700 204Q735 206 738 180Q736 166 724 160Q722 178 704 186L480 218Z" fill="#f0dfa6" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M500 190L690 190Q700 160 640 140L540 135Z" fill="#b7d6a3" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M520 150L526 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M536 150L542 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M552 150L558 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M568 150L574 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M584 150L590 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M600 150L606 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M616 150L622 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M632 150L638 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M648 150L654 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M664 150L670 182" fill="none" stroke="#24775c" stroke-width="1"/><path d="M700 60Q680 90 650 120Q620 150 600 170" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><path d="M70 215L100.4 203.7" fill="none" stroke="#a8383b" stroke-width="2"/><path d="M105 202L100 206.9L98 201.5Z" fill="#a8383b" stroke-linejoin="round"/><path d="M105 202L105 213.1" fill="none" stroke="#233b4d" stroke-width="2"/><path d="M105 218L102.1 211.6L107.9 211.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M105 218L135.5 204" fill="none" stroke="#a8383b" stroke-width="2"/><path d="M140 202L135.4 207.3L133 202.1Z" fill="#a8383b" stroke-linejoin="round"/><path d="M140 202L140 213.1" fill="none" stroke="#233b4d" stroke-width="2"/><path d="M140 218L137.1 211.6L142.9 211.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M140 218L170.5 204" fill="none" stroke="#a8383b" stroke-width="2"/><path d="M175 202L170.4 207.3L168 202.1Z" fill="#a8383b" stroke-linejoin="round"/><path d="M175 202L175 213.1" fill="none" stroke="#233b4d" stroke-width="2"/><path d="M175 218L172.1 211.6L177.9 211.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M175 218L205.5 204" fill="none" stroke="#a8383b" stroke-width="2"/><path d="M210 202L205.4 207.3L203 202.1Z" fill="#a8383b" stroke-linejoin="round"/><path d="M210 202L210 213.1" fill="none" stroke="#233b4d" stroke-width="2"/><path d="M210 218L207.1 211.6L212.9 211.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M210 218L240.5 204" fill="none" stroke="#a8383b" stroke-width="2"/><path d="M245 202L240.4 207.3L238 202.1Z" fill="#a8383b" stroke-linejoin="round"/><path d="M245 202L245 213.1" fill="none" stroke="#233b4d" stroke-width="2"/><path d="M245 218L242.1 211.6L247.9 211.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M90 250L291.6 250" fill="none" stroke="#a8383b" stroke-width="3.5"/><path d="M300 250L289 254.9L289 245.1Z" fill="#a8383b" stroke-linejoin="round"/><text x="90" y="272" font-family="Arial" font-size="14" fill="#a8383b" font-weight="bold">Net movement of sediment: longshore drift</text><path d="M110 380L170 330" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M190 380L250 330" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M270 380L330 330" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M350 380L410 330" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M80 440L183.5 355.3" fill="none" stroke="#173b50" stroke-width="3"/><path d="M190 350L184.6 360.7L178.4 353.2Z" fill="#173b50" stroke-linejoin="round"/><text x="70" y="465" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Prevailing wind and waves</text><path d="M256 155.8L140 208" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="140" cy="208" r="2.5" fill="#233b4d"/><text x="260" y="160" font-family="Arial" font-size="12" fill="#173b50">Swash: up the beach at the angle of the waves</text><path d="M256 173.8L175 215" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="175" cy="215" r="2.5" fill="#233b4d"/><text x="260" y="178" font-family="Arial" font-size="12" fill="#173b50">Backwash: straight down the beach (gravity)</text><path d="M640 255L640 205" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="640" cy="205" r="2.5" fill="#233b4d"/><text x="560" y="270" font-family="Arial" font-size="13" fill="#173b50">Spit: sand carried past the bend</text><text x="560" y="286" font-family="Arial" font-size="13" fill="#173b50">in the coast is deposited in</text><text x="560" y="302" font-family="Arial" font-size="13" fill="#173b50">calmer, deeper water</text><path d="M735 320L735 175" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="735" cy="175" r="2.5" fill="#233b4d"/><text x="560" y="335" font-family="Arial" font-size="13" fill="#173b50">Recurved (hooked) end: a second</text><text x="560" y="351" font-family="Arial" font-size="13" fill="#173b50">wind/wave direction bends the tip</text><path d="M600 99L600 150" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="600" cy="150" r="2.5" fill="#233b4d"/><text x="540" y="95" font-family="Arial" font-size="13" fill="#173b50">Salt marsh in sheltered water</text><path d="M686 125.8L650 120" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="650" cy="120" r="2.5" fill="#233b4d"/><text x="690" y="130" font-family="Arial" font-size="12" fill="#173b50">River</text><text x="560" y="395" font-family="Arial" font-size="13" fill="#173b50">A tombolo forms where a spit or bar</text><text x="560" y="411" font-family="Arial" font-size="13" fill="#173b50">joins an island to the mainland</text><text x="560" y="427" font-family="Arial" font-size="13" fill="#173b50">(Mount Maunganui).</text><text x="250" y="130" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Land</text><text x="400" y="330" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Sea</text></svg>
