<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Frank’s dependency theory: core and periphery</text><circle cx="230" cy="275" r="205" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><circle cx="230" cy="275" r="140" fill="#f8f0c6" stroke="#173b50" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="230" cy="275" r="80" fill="#a9cde6" stroke="#173b50" stroke-width="1.5"/><text x="230" y="267" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">CORE</text><text x="230" y="287" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">HICs</text><text x="230" y="177" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">semi-periphery (NICs)</text><text x="230" y="115" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">PERIPHERY</text><text x="230" y="133" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">LICs</text><path d="M40 315L136.1 296.7" fill="none" stroke="#c16b20" stroke-width="4"/><path d="M145 295L134.3 302.4L132.3 292Z" fill="#c16b20" stroke-linejoin="round"/><text x="40" y="370" font-family="Arial" font-size="12" fill="#c16b20" font-weight="bold">low-value raw</text><text x="40" y="385" font-family="Arial" font-size="12" fill="#c16b20" font-weight="bold">materials, cheap</text><text x="40" y="400" font-family="Arial" font-size="12" fill="#c16b20" font-weight="bold">labour, profits</text><path d="M315 295L411.1 313.3" fill="none" stroke="#246b8e" stroke-width="4"/><path d="M420 315L407.3 318L409.3 307.6Z" fill="#246b8e" stroke-linejoin="round"/><text x="325" y="370" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">high-value</text><text x="325" y="385" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">manufactured</text><text x="325" y="400" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">goods, loans</text><text x="470" y="90" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Core (developed countries)</text><text x="470" y="108" font-family="Arial" font-size="12" fill="#173b50">processes raw materials into high-value</text><text x="470" y="123" font-family="Arial" font-size="12" fill="#173b50">goods; holds capital, technology and</text><text x="470" y="138" font-family="Arial" font-size="12" fill="#173b50">decision-making; grows richer</text><text x="470" y="165" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Periphery (developing countries)</text><text x="470" y="183" font-family="Arial" font-size="12" fill="#173b50">exports low-value raw materials; depends</text><text x="470" y="198" font-family="Arial" font-size="12" fill="#173b50">on the core as its market; earns little;</text><text x="470" y="213" font-family="Arial" font-size="12" fill="#173b50">falls into debt</text><text x="470" y="240" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Why the gap persists</text><text x="470" y="258" font-family="Arial" font-size="12" fill="#173b50">colonial trade set up the pattern; unequal</text><text x="470" y="273" font-family="Arial" font-size="12" fill="#173b50">terms of trade keep it; profits flow to</text><text x="470" y="288" font-family="Arial" font-size="12" fill="#173b50">the core. Development of the core happened</text><text x="470" y="303" font-family="Arial" font-size="12" fill="#173b50">at the expense of the periphery.</text><text x="470" y="330" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Limitations</text><text x="470" y="348" font-family="Arial" font-size="12" fill="#173b50">some periphery countries have moved up</text><text x="470" y="363" font-family="Arial" font-size="12" fill="#173b50">(South Korea, Singapore, China); ignores</text><text x="470" y="378" font-family="Arial" font-size="12" fill="#173b50">internal causes such as conflict and</text><text x="470" y="393" font-family="Arial" font-size="12" fill="#173b50">governance; a model, not a law</text></svg>
