<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The Hjulström curve</text><path d="M110 70L110 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="110" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">0.001</text><path d="M208.3 70L208.3 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="208.3" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">0.01</text><path d="M306.7 70L306.7 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="306.7" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">0.1</text><path d="M405 70L405 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="405" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1</text><path d="M503.3 70L503.3 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="503.3" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">10</text><path d="M601.7 70L601.7 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="601.7" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">100</text><path d="M700 70L700 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="700" y="460" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1000</text><path d="M110 440L700 440" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="102" y="444" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">0.1</text><path d="M110 347.5L700 347.5" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="102" y="351.5" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">1</text><path d="M110 255L700 255" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="102" y="259" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">10</text><path d="M110 162.5L700 162.5" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="102" y="166.5" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">100</text><path d="M110 70L700 70" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="102" y="74" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">1000</text><rect x="110" y="70" width="590" height="370" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="405" y="482" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Particle size (mm, log scale)</text><text x="40" y="255" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold" transform="rotate(-90 40 255)">Mean velocity (cm/s, log scale)</text><path d="M110 146.2C119.9 150 147.9 161 169.2 169C190.5 177.1 215 186.6 237.9 194.6C260.8 202.5 285.3 211.2 306.7 216.6C328 222 349.5 226.9 365.9 227.2C382.3 227.4 387 225.5 405 218.2C423 210.8 452.4 195 473.7 183C495.1 171 511.6 158 532.9 146.2C554.3 134.4 573.8 124.9 601.7 112.2C629.5 99.5 683.6 77 700 70" fill="none" stroke="#a8383b" stroke-width="4" stroke-linejoin="round"/><path d="M169.2 440C185.6 428 236.8 390.8 267.5 368C298.3 345.2 330.7 320.7 353.6 303.4C376.5 286 380 283.4 405 264C430 244.5 470.6 209.8 503.3 186.5C536.1 163.2 568.9 142 601.7 124.1C634.4 106.2 683.6 86.5 700 79" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><text x="139.6" y="106.8" font-family="Arial" font-size="16" fill="#a8383b" font-weight="bold">EROSION (entrainment)</text><text x="216.1" y="269.3" font-family="Arial" font-size="16" fill="#24775c" font-weight="bold">TRANSPORT</text><text x="277.1" y="403.2" font-family="Arial" font-size="16" fill="#246b8e" font-weight="bold">DEPOSITION</text><text x="498.8" y="210.9" font-family="Arial" font-size="13" fill="#a8383b">Critical erosion velocity</text><text x="503.3" y="247.7" font-family="Arial" font-size="13" fill="#246b8e">Settling (fall) velocity</text><path d="M156.9 213.2L156.9 164.6" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="156.9" cy="164.6" r="2.5" fill="#233b4d"/><text x="121.2" y="227.2" font-family="Arial" font-size="12" fill="#173b50">Clay and silt: cohesive,</text><text x="121.2" y="242.2" font-family="Arial" font-size="12" fill="#173b50">so need high velocity to erode</text><path d="M365.9 91.3L365.9 225.2" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="365.9" cy="225.2" r="2.5" fill="#233b4d"/><text x="336.3" y="87.3" font-family="Arial" font-size="12" fill="#173b50">Sand is the easiest size to erode</text><text x="336.3" y="102.3" font-family="Arial" font-size="12" fill="#173b50">(lowest point of the curve)</text><path d="M110 492L110 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="139.6" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">clay</text><path d="M169.2 492L169.2 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="227.9" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">silt</text><path d="M286.6 492L286.6 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="360.6" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">sand</text><path d="M434.6 492L434.6 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="508.6" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">gravel / pebbles</text><path d="M582.6 492L582.6 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="612.2" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">cobbles</text><path d="M641.8 492L641.8 506" fill="none" stroke="#173b50" stroke-width="1"/><text x="670.9" y="518" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">boulders</text><path d="M700 492L700 506" fill="none" stroke="#173b50" stroke-width="1"/><path d="M110 499L700 499" fill="none" stroke="#173b50" stroke-width="1"/><text x="710" y="74" font-family="Arial" font-size="11" fill="#233b4d">Schematic;</text><text x="710" y="88" font-family="Arial" font-size="11" fill="#233b4d">values</text><text x="710" y="102" font-family="Arial" font-size="11" fill="#233b4d">approximate</text></svg>
