="middle" font-weight="bold">anticline</text><text x="40.0" y="230.0" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="start">plate</text><text x="715.0" y="230.0" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="start">plate</text><text x="30.0" y="307.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="start">Converging plates squeeze sediment → layers bend up (anticlines) and down (synclines) → fold mountains (Himalayas, Alps).</text><rect x="15.0" y="340.0" width="380.0" height="250.0" fill="#eef5fa"/><text x="25.0" y="362.0" font-family="Arial" font-size="14" fill="#173b50" text-anchor="start" font-weight="bold">Normal fault: tension</text><polygon points="35.0,420.0 192.0,420.0 207.0,457.5 35.0,457.5" fill="#efc08f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="205.6,454.0 375.0,454.0 375.0,491.5 220.6,491.5" fill="#efc08f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="35.0,457.5 207.0,457.5 222.0,495.0 35.0,495.0" fill="#d2b48f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="220.6,491.5 375.0,491.5 375.0,529.0 235.6,529.0" fill="#d2b48f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="35.0,495.0 222.0,495.0 237.0,532.5 35.0,532.5" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="235.6,529.0 375.0,529.0 375.0,566.5 250.6,566.5" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="35.0,532.5 237.0,532.5 252.0,570.0 35.0,570.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="250.6,566.5 375.0,566.5 375.0,570.0 252.0,570.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M174.0 375 L252.0 570" fill="none" stroke="#a8383b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="206.0" y="438.0" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="start" font-weight="bold">fault scarp</text><path d="M65 400 L30 400" fill="none" stroke="#a8383b" stroke-width="3" marker-end="url(#ared)"/><path d="M345 434 L380 434" fill="none" stroke="#a8383b" stroke-width="3" marker-end="url(#ared)"/><text x="25.0" y="610.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Rock is pulled apart → the block above the fault plane</text><text x="25.0" y="625.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">slips down → a fault scarp. Graben (rift valleys) and</text><text x="25.0" y="640.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">horsts form between pairs of normal faults (East Africa).</text><rect x="405.0" y="340.0" width="380.0" height="250.0" fill="#eef5fa"/><text x="415.0" y="362.0" font-family="Arial" font-size="14" fill="#173b50" text-anchor="start" font-weight="bold">Reverse (thrust) fault: compression</text><polygon points="425.0,420.0 582.0,420.0 597.0,457.5 425.0,457.5" fill="#efc08f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="568.4,386.0 765.0,386.0 765.0,423.5 583.4,423.5" fill="#efc08f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="425.0,457.5 597.0,457.5 612.0,495.0 425.0,495.0" fill="#d2b48f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="583.4,423.5 765.0,423.5 765.0,461.0 598.4,461.0" fill="#d2b48f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="425.0,495.0 612.0,495.0 627.0,532.5 425.0,532.5" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="598.4,461.0 765.0,461.0 765.0,498.5 613.4,498.5" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="425.0,532.5 627.0,532.5 642.0,570.0 425.0,570.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="613.4,498.5 765.0,498.5 765.0,570.0 642.0,570.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M564.0 375 L642.0 570" fill="none" stroke="#a8383b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="568.0" y="406.0" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="end" font-weight="bold">fault scarp</text><path d="M413 490 L443 490" fill="none" stroke="#a8383b" stroke-width="3" marker-end="url(#ared)"/><path d="M777 490 L747 490" fill="none" stroke="#a8383b" stroke-width="3" marker-end="url(#ared)"/><text x="415.0" y="610.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Rock is squeezed → the block above the fault plane is</text><text x="415.0" y="625.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">pushed up and over the other → the crust shortens.</text><text x="415.0" y="640.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Common where plates converge; red dashed line = fault plane.</text></svg>