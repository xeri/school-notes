<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410"><rect width="800" height="410" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Farming as a system (with a New Zealand dairy farm)</text><rect x="30" y="70" width="220" height="220" rx="8" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="140" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">INPUTS</text><text x="42" y="118" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Physical</text><text x="42" y="136" font-family="Arial" font-size="13" fill="#173b50">climate (rain, temperature,</text><text x="42" y="154" font-family="Arial" font-size="13" fill="#173b50">  sunshine, growing season)</text><text x="42" y="172" font-family="Arial" font-size="13" fill="#173b50">soil, relief, water, land</text><text x="42" y="190" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Human</text><text x="42" y="208" font-family="Arial" font-size="13" fill="#173b50">labour, capital, machinery</text><text x="42" y="226" font-family="Arial" font-size="13" fill="#173b50">fertiliser, feed, seed, stock</text><text x="42" y="244" font-family="Arial" font-size="13" fill="#173b50">electricity, fuel, knowledge</text><text x="42" y="262" font-family="Arial" font-size="13" fill="#173b50">markets, government policy</text><rect x="290" y="70" width="220" height="220" rx="8" fill="#f8f0c6" stroke="#173b50" stroke-width="1.5"/><text x="400" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">PROCESSES</text><text x="302" y="118" font-family="Arial" font-size="13" fill="#173b50">ploughing, sowing</text><text x="302" y="136" font-family="Arial" font-size="13" fill="#173b50">fertilising, irrigating</text><text x="302" y="154" font-family="Arial" font-size="13" fill="#173b50">rotational grazing</text><text x="302" y="172" font-family="Arial" font-size="13" fill="#173b50">milking twice a day</text><text x="302" y="190" font-family="Arial" font-size="13" fill="#173b50">(rotary or herringbone shed)</text><text x="302" y="208" font-family="Arial" font-size="13" fill="#173b50">calving, breeding</text><text x="302" y="226" font-family="Arial" font-size="13" fill="#173b50">harvesting silage, hay</text><text x="302" y="244" font-family="Arial" font-size="13" fill="#173b50">spreading effluent</text><text x="302" y="262" font-family="Arial" font-size="13" fill="#173b50">maintenance, record keeping</text><rect x="550" y="70" width="220" height="220" rx="8" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><text x="660" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">OUTPUTS</text><text x="562" y="118" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Products</text><text x="562" y="136" font-family="Arial" font-size="13" fill="#173b50">milk (milksolids), meat,</text><text x="562" y="154" font-family="Arial" font-size="13" fill="#173b50">crops, wool, calves</text><text x="562" y="172" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Waste and by-products</text><text x="562" y="190" font-family="Arial" font-size="13" fill="#173b50">effluent, methane, nitrous</text><text x="562" y="208" font-family="Arial" font-size="13" fill="#173b50">oxide, nitrate runoff</text><text x="562" y="226" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Money</text><text x="562" y="244" font-family="Arial" font-size="13" fill="#173b50">income and profit (or loss)</text><path d="M252 180L279.6 180" fill="none" stroke="#173b50" stroke-width="3"/><path d="M288 180L277 184.9L277 175.1Z" fill="#173b50" stroke-linejoin="round"/><path d="M512 180L539.6 180" fill="none" stroke="#173b50" stroke-width="3"/><path d="M548 180L537 184.9L537 175.1Z" fill="#173b50" stroke-linejoin="round"/><path d="M660 290L660 322L140 322L140 302" fill="none" stroke="#a8383b" stroke-width="3" stroke-linejoin="round"/><path d="M140 292L144.9 303L135.1 303Z" fill="#a8383b" stroke-linejoin="round"/><text x="400" y="314" font-family="Arial" font-size="14" fill="#a8383b" text-anchor="middle" font-weight="bold">FEEDBACK</text><text x="400" y="342" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="middle">profit reinvested in stock, irrigation or machinery; a drought or low milk price cuts next season’s inputs</text></svg>
