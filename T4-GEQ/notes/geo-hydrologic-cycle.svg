<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><rect width="800" height="470" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The hydrological (water) cycle — a closed system</text><rect x="30" y="60" width="740" height="390" fill="#f4f9fc"/><path d="M30 440L30 300L200 160L330 260L520 330L520 440Z" fill="#dfe8d4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><rect x="520" y="330" width="250" height="110" fill="#8cc3e6" stroke="#173b50" stroke-width="1"/><rect x="30" y="400" width="490" height="40" fill="#c8b49a"/><text x="275" y="425" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Permeable rock: groundwater store</text><circle cx="220" cy="111" r="20" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="250" cy="99" r="26" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="280" cy="111" r="20" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="590" cy="126" r="20" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="620" cy="114" r="26" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="650" cy="126" r="20" fill="white" stroke="#8796a0" stroke-width="1.2"/><path d="M220 135L212 175" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4"/><path d="M234 135L226 175" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4"/><path d="M248 135L240 175" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4"/><path d="M262 135L254 175" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4"/><path d="M276 135L268 175" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4"/><rect x="87" y="285" width="6" height="20" fill="#8a5a3b"/><circle cx="90" cy="278" r="13" fill="#24775c"/><rect x="117" y="285" width="6" height="20" fill="#8a5a3b"/><circle cx="120" cy="278" r="13" fill="#24775c"/><path d="M650 320L650 167.7" fill="none" stroke="#c16b20" stroke-width="2.5"/><path d="M650 160L654.5 170L645.5 170Z" fill="#c16b20" stroke-linejoin="round"/><path d="M570 120L307 104.4" fill="none" stroke="#233b4d" stroke-width="2.2" stroke-dasharray="7 5"/><path d="M300 104L309.4 100.5L308.9 108.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M105 262L171.6 141.1" fill="none" stroke="#24775c" stroke-width="2.2"/><path d="M175 135L174.2 145L167 141Z" fill="#24775c" stroke-linejoin="round"/><path d="M300 255L492.7 319.6" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M500 322L489.1 323.1L491.9 314.6Z" fill="#246b8e" stroke-linejoin="round"/><path d="M160 330L160 383.7" fill="none" stroke="#246b8e" stroke-width="2.2"/><path d="M160 390L156.3 381.8L163.7 381.8Z" fill="#246b8e" stroke-linejoin="round"/><path d="M250 410L503.7 410" fill="none" stroke="#246b8e" stroke-width="2.2" stroke-dasharray="7 5"/><path d="M510 410L501.8 413.7L501.8 406.3Z" fill="#246b8e" stroke-linejoin="round"/><path d="M676 240.4L652 245" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="652" cy="245" r="2.5" fill="#233b4d"/><text x="680" y="245" font-family="Arial" font-size="13" fill="#173b50">Evaporation</text><text x="620" y="85" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Condensation: cloud</text><text x="430" y="98" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Wind carries vapour inland</text><text x="300" y="190" font-family="Arial" font-size="13" fill="#173b50">Precipitation</text><text x="40" y="210" font-family="Arial" font-size="13" fill="#173b50">Transpiration</text><text x="380" y="270" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">Surface runoff</text><text x="170" y="365" font-family="Arial" font-size="13" fill="#173b50">Infiltration and</text><text x="170" y="381" font-family="Arial" font-size="13" fill="#173b50">percolation</text><text x="560" y="400" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Ocean store</text><text x="320" y="395" font-family="Arial" font-size="13" fill="#173b50">Groundwater flow to the sea</text><text x="40" y="465" font-family="Arial" font-size="12" fill="#233b4d">Evaporation + transpiration = evapotranspiration. The land part of the cycle, between watersheds, is a drainage basin (an open system).</text></svg>
