<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The rural–urban fringe and the urban shadow</text><rect x="30" y="60" width="180" height="240" fill="#f8e3cc" stroke="#173b50" stroke-width="1.2"/><text x="120" y="82" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Built-up area</text><text x="120" y="100" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">suburbs</text><rect x="210" y="60" width="210" height="240" fill="#f8f0c6" stroke="#173b50" stroke-width="1.2"/><text x="315" y="82" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Rural–urban fringe</text><text x="315" y="100" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">edge of the city</text><rect x="420" y="60" width="190" height="240" fill="#e1efd9" stroke="#173b50" stroke-width="1.2"/><text x="515" y="82" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Urban shadow</text><text x="515" y="100" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">shaped by the city</text><rect x="610" y="60" width="160" height="240" fill="#b5d6a3" stroke="#173b50" stroke-width="1.2"/><text x="690" y="82" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Rural area</text><text x="690" y="100" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">farming</text><rect x="40" y="271.9" width="9" height="28.1" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M34 271.9L44.5 256.5L55 271.9Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="43.6" y="286" width="1.8" height="14" fill="white" stroke="#173b50" stroke-width="1"/><rect x="52" y="269.4" width="9" height="30.6"