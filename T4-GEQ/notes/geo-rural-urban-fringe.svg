" y="289.9" width="1.8" height="10.1" fill="white" stroke="#173b50" stroke-width="1"/><rect x="225" y="210" width="70" height="40" fill="#e6ddf1" stroke="#173b50" stroke-width="1.2"/><text x="260" y="235" font-family="Arial" font-size="11" fill="#173b50" text-anchor="middle">Retail</text><rect x="305" y="220" width="50" height="30" fill="#dcebf5" stroke="#173b50" stroke-width="1.2"/><text x="330" y="239" font-family="Arial" font-size="10" fill="#173b50" text-anchor="middle">Business</text><rect x="230" y="165" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M224 165L235 158.4L246 165Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="234" y="171" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="246" y="165" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M240 165L251 158.4L262 165Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="250" y="171" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="262" y="165" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M256 165L267 158.4L278 165Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="266" y="171" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="278" y="165" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M272 165L283 158.4L294 165Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="282" y="171" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="294" y="165" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M288 165L299 158.4L310 165Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="298" y="171" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><circle cx="385" cy="175" r="18" fill="#b5d6a3" stroke="#173b50" stroke-width="1.2"/><text x="385" y="179" font-family="Arial" font-size="10" fill="#173b50" text-anchor="middle">Golf</text><path d="M210 285 L420 255" fill="none" stroke="#233b4d" stroke-width="5" stroke-linejoin="round"/><text x="330" y="290" font-family="Arial" font-size="11" fill="#173b50" text-anchor="middle">motorway</text><rect x="450" y="150" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M444 150L455 143.4L466 150Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="454" y="156" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="466" y="150" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M460 150L471 143.4L482 150Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="470" y="156" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><rect x="482" y="150" width="10" height="12" fill="#efc08f" stroke="#173b50" stroke-width="1.4"/><path d="M476 150L487 143.4L498 150Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="486" y="156" width="2" height="6" fill="white" stroke="#173b50" stroke-width="1"/><text x="475" y="185" font-family="Arial" font-size="11" fill="#173b50" text-anchor="middle">commuter</text><text x="475" y="198" font-family="Arial" font-size="11" fill="#173b50" text-anchor="middle">village</text><rect x="530" y="215" width="60" height="35" fill="none" stroke="#8a5a3b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="560" y="237" font-family="Arial" font-size="10.5" fill="#173b50" text-anchor="middle">land bank</text><rect x="450" y="240" width="16" height="12" fill="#dcebf5" stroke="#173b50" stroke-width="1"/><rect x="472" y="240" width="16" height="12" fill="#dcebf5" stroke="#173b50" stroke-width="1"/><rect x="494" y="240" width="16" height="12" fill="#dcebf5" stroke="#173b50" stroke-width="1"/><text x="480" y="268" font-family="Arial" font-size="11" fill="#173b50" text-anchor="middle">glasshouses</text><path d="M420 50L420 310" fill="none" stroke="#a8383b" stroke-width="3.5" stroke-dasharray="10 6"/><text x="420" y="324" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="middle" font-weight="bold">Rural Urban Boundary / green belt / metropolitan urban limit</text><path d="M130 135L322.3 135" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M330 135L320 139.5L320 130.5Z" fill="#a8383b" stroke-linejoin="round"/><text x="232" y="128" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle">urban sprawl</text><text x="36" y="355" font-family="Arial" font-size="12.5" fill="#173b50">Houses, schools,</text><text x="36" y="372" font-family="Arial" font-size="12.5" fill="#173b50">local shops;</text><text x="36" y="389" font-family="Arial" font-size="12.5" fill="#173b50">residents commute</text><text x="36" y="406" font-family="Arial" font-size="12.5" fill="#173b50">to the CBD</text><text x="216" y="355" font-family="Arial" font-size="12.5" fill="#173b50">Greenfield housing estates</text><text x="216" y="372" font-family="Arial" font-size="12.5" fill="#173b50">Out-of-town retail parks</text><text x="216" y="389" font-family="Arial" font-size="12.5" fill="#173b50">Business and science parks</text><text x="216" y="406" font-family="Arial" font-size="12.5" fill="#173b50">Motorway junctions, airport</text><text x="216" y="423" font-family="Arial" font-size="12.5" fill="#173b50">Golf courses, sports grounds</text><text x="216" y="440" font-family="Arial" font-size="12.5" fill="#173b50">Sewage works, landfill</text><text x="426" y="355" font-family="Arial" font-size="12.5" fill="#173b50">Commuter (dormitory) villages</text><text x="426" y="372" font-family="Arial" font-size="12.5" fill="#173b50">Land banked by speculators,</text><text x="426" y="389" font-family="Arial" font-size="12.5" fill="#173b50">  idle until it is rezoned</text><text x="426" y="406" font-family="Arial" font-size="12.5" fill="#173b50">Car yards, stockyards,</text><text x="426" y="423" font-family="Arial" font-size="12.5" fill="#173b50">  run-down glasshouses</text><text x="426" y="440" font-family="Arial" font-size="12.5" fill="#173b50">Lifestyle blocks; rising prices</text><text x="616" y="355" font-family="Arial" font-size="12.5" fill="#173b50">Dairy, sheep,</text><text x="616" y="372" font-family="Arial" font-size="12.5" fill="#173b50">market gardening;</text><text x="616" y="389" font-family="Arial" font-size="12.5" fill="#173b50">land cheap and</text><text x="616" y="406" font-family="Arial" font-size="12.5" fill="#173b50">used for farming</text><text x="30" y="478" font-family="Arial" font-size="13.5" fill="#173b50">Conflict at the fringe: developers and house buyers want cheap greenfield land; farmers, market gardeners (Pukekohe),</text><text x="30" y="497" font-family="Arial" font-size="13.5" fill="#173b50">conservationists and existing residents want it kept rural. Auckland’s urban shadow: e.g. Ardmore, Drury, Kumeu–Huapai.</text><text x="30" y="516" font-family="Arial" font-size="13.5" fill="#173b50">Schematic transect from the city edge outwards.</text></svg>
