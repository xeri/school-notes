<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><rect width="800" height="480" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">A transect from the CBD to the edge of an HIC city</text><rect x="150" y="55" width="120" height="195" fill="#f4d6d4"/><text x="210" y="74" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">CBD</text><rect x="270" y="55" width="130" height="195" fill="#e6ddf1"/><text x="335" y="74" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">Zone in</text><text x="335" y="90" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">transition</text><rect x="400" y="55" width="130" height="195" fill="#f8e3cc"/><text x="465" y="74" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">Inner</text><text x="465" y="90" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">suburbs</text><rect x="530" y="55" width="120" height="195" fill="#f8f0c6"/><text x="590" y="74" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">Outer</text><text x="590" y="90" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">suburbs</text><rect x="650" y="55" width="125" height="195" fill="#e1efd9"/><text x="712.5" y="74" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">Rural–urban</text><text x="712.5" y="90" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle" font-weight="bold">fringe</text><path d="M150 250L775 250" fill="none" stroke="#173b50" stroke-width="2"/><rect x="158" y="130" width="18" height="120" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><rect x="180" y="155" width="18" height="95" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><rect x="202" y="110" width="18" height="140" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><rect x="224" y="165" width="18" height="85" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><rect x="246" y="142" width="18" height="108" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><rect x="278" y="205" width="42" height="45" fill="#cfd6db" stroke="#173b50" stroke-width="1"/><path d="M278 205L288 194L298 205L308 194L320 205Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="328" y="205" width="42" height="45" fill="#cfd6db" stroke="#173b50" stroke-width="1"/><path d="M328 205L338 194L348 205L358 194L370 205Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="384" y="230" width="14" height="20" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="406" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="426" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="446" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="466" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="486" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="506" y="222" width="18" height="28" fill="#efc08f" stroke="#173b50" stroke-width="1"/><rect x="542" y="230" width="18" height="20" fill="#ecd986" stroke="#173b50" stroke-width="1.4"/><path d="M536 230L551 219L566 230Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="549.2" y="240" width="3.6" height="10" fill="white" stroke="#173b50" stroke-width="1"/><rect x="572" y="230" width="18" height="20" fill="#ecd986" stroke="#173b50" stroke-width="1.4"/><path d="M566 230L581 219L596 230Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="579.2" y="240" width="3.6" height="10" fill="white" stroke="#173b50" stroke-width="1"/><rect x="602" y="230" width="18" height="20" fill="#ecd986" stroke="#173b50" stroke-width="1.4"/><path d="M596 230L611 219L626 230Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="609.2" y="240" width="3.6" height="10" fill="white" stroke="#173b50" stroke-width="1"/><rect x="632" y="230" width="18" height="20" fill="#ecd986" stroke="#173b50" stroke-width="1.4"/><path d="M626 230L641 219L656 230Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="639.2" y="240" width="3.6" height="10" fill="white" stroke="#173b50" stroke-width="1"/><rect x="664" y="232" width="20" height="18" fill="#b5d6a3" stroke="#173b50" stroke-width="1.4"/><path d="M658 232L674 222.1L690 232Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="672" y="241" width="4" height="9" fill="white" stroke="#173b50" stroke-width="1"/><rect x="704" y="232" width="20" height="18" fill="#b5d6a3" stroke="#173b50" stroke-width="1.4"/><path d="M698 232L714 222.1L730 232Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="712" y="241" width="4" height="9" fill="white" stroke="#173b50" stroke-width="1"/><rect x="745" y="226" width="26" height="24" fill="#e6ddf1" stroke="#173b50" stroke-width="1"/><rect x="25" y="267" width="750" height="28" fill="#eceff1"/><text x="30" y="285" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Land value</text><text x="210" y="285" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">highest (PLVI)</text><text x="335" y="285" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">falling</text><text x="465" y="285" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">low–medium</text><text x="590" y="285" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">medium–high</text><text x="712.5" y="285" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">low</text><text x="30" y="315" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Building age</text><text x="210" y="315" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">mixed old/new</text><text x="335" y="315" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">oldest, 19th c.</text><text x="465" y="315" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">1900–1940</text><text x="590" y="315" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">post-1945</text><text x="712.5" y="315" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">newest</text><rect x="25" y="327" width="750" height="28" fill="#eceff1"/><text x="30" y="345" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Density</text><text x="210" y="345" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">very high, tall</text><text x="335" y="345" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">high; derelict</text><text x="465" y="345" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">high: terraces</text><text x="590" y="345" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">lower: detached</text><text x="712.5" y="345" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">very low</text><text x="30" y="375" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Main use</text><text x="210" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">shops, offices</text><text x="335" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">old industry</text><text x="465" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">workers’ houses</text><text x="590" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">family houses</text><text x="712.5" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">retail parks</text><rect x="25" y="387" width="750" height="28" fill="#eceff1"/><text x="30" y="405" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Residents</text><text x="210" y="405" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">very few</text><text x="335" y="405" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">low income</text><text x="465" y="405" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">mixed; gentrifying</text><text x="590" y="405" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">middle–high</text><text x="712.5" y="405" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">commuters</text><text x="30" y="450" font-family="Arial" font-size="13" fill="#173b50">Bid rent explains the falling land value; the age of buildings records the order in which the city grew.</text><text x="30" y="470" font-family="Arial" font-size="12.5" fill="#8796a0">Schematic.</text></svg>
