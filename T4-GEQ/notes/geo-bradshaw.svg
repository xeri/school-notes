<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><rect width="800" height="470" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The Bradshaw model: changes from source to mouth</text><text x="300" y="70" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Source (upstream)</text><text x="740" y="70" font-family="Arial" font-size="14" fill="#173b50" text-anchor="end" font-weight="bold">Mouth (downstream)</text><path d="M450 80L593.7 80" fill="none" stroke="#173b50" stroke-width="2"/><path d="M600 80L591.8 83.7L591.8 76.3Z" fill="#173b50" stroke-linejoin="round"/><path d="M300 116L740 101L740 131Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="121" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Discharge</text><text x="292" y="121" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 152L740 137L740 167Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="157" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Channel width</text><text x="292" y="157" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 188L740 173L740 203Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="193" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Channel depth</text><text x="292" y="193" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 224L740 209L740 239Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="229" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Cross-sectional area</text><text x="292" y="229" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 260L740 245L740 275Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="265" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Mean velocity</text><text x="292" y="265" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 296L740 281L740 311Z" fill="#dcebf5" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="301" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Load quantity</text><text x="292" y="301" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="end">increases</text><path d="M300 335L300 365L740 350Z" fill="#f8e3cc" stroke="#c16b20" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="355" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Load particle size</text><text x="292" y="355" font-family="Arial" font-size="13" fill="#c16b20" text-anchor="end">decreases</text><path d="M300 371L300 401L740 386Z" fill="#f8e3cc" stroke="#c16b20" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="391" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Channel bed roughness</text><text x="292" y="391" font-family="Arial" font-size="13" fill="#c16b20" text-anchor="end">decreases</text><path d="M300 407L300 437L740 422Z" fill="#f8e3cc" stroke="#c16b20" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="427" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Slope angle (gradient)</text><text x="292" y="427" font-family="Arial" font-size="13" fill="#c16b20" text-anchor="end">decreases</text><text x="40" y="458" font-family="Arial" font-size="13" fill="#233b4d">Velocity rises downstream despite the gentler gradient: a deeper, smoother channel loses less energy to friction.</text></svg>
