<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485"><rect width="800" height="485" fill="white"/><defs><marker id="aink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173b50"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8383b"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b8e"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24775c"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c16b20"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Constructive and destructive waves</text><rect x="15.0" y="55.0" width="380.0" height="265.0" fill="#eef5fa"/><text x="205.0" y="78.0" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Constructive waves</text><rect x="405.0" y="55.0" width="380.0" height="265.0" fill="#eef5fa"/><text x="595.0" y="78.0" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Destructive waves</text><polygon points="15.0,310.0 395.0,310.0 395.0,200.0 150.0,270.0 15.0,284.0" fill="#efc08f" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><polygon points="15.0,235.0 297.0,235.0 150.0,270.0 15.0,284.0" fill="#8cc3e6" stroke-linejoin="round"/><path d="M15 235 Q60 219 105 235 Q150 219 195 235 Q235 221 270 233" fill="none" stroke="#246b8e" stroke-width="2.5" stroke-linejoin="round"/><path d="M240 222 L360 194" fill="none" stroke="#246b8e" stroke-width="5" marker-end="url(#ablue)"/><text x="240.0" y="196.0" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="start" font-weight="bold">strong swash</text><path d="M345 220 L305 230" fill="none" stroke="#a8383b" stroke-width="1.5" marker-end="url(#ared)"/><text x="265.0" y="262.0" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="start">weak backwash</text><text x="55.0" y="300.0" font-family="Arial" font-size="12" fill="#8a5a3b" text-anchor="start">gentle beach: sand built up</text><polygon points="405.0,310.0 785.0,310.0 785.0,150.0 640.0,270.0 405.0,284.0" fill="#efc08f" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><polygon points="405.0,235.0 682.0,235.0 640.0,270.0 405.0,284.0" fill="#8cc3e6" stroke-linejoin="round"/><path d="M405 235 Q423 192 441 235 Q459 192 477 235 Q495 192 513 235 Q531 192 549 235 Q567 192 585 235 Q605 190 627 225" fill="none" stroke="#246b8e" stroke-width="2.5" stroke-linejoin="round"/><path d="M650 230 L687 202" fill="none" stroke="#246b8e" stroke-width="1.5" marker-end="url(#ablue)"/><text x="595.0" y="200.0" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="start">weak swash</text><path d="M777 140 L710 194" fill="none" stroke="#a8383b" stroke-width="5" marker-end="url(#ared)"/><text x="767.0" y="128.0" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="end" font-weight="bold">strong backwash</text><text x="435.0" y="300.0" font-family="Arial" font-size="12" fill="#8a5a3b" text-anchor="start">steep beach: sand dragged offshore</text><text x="25.0" y="345.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Low, flat; long wavelength</text><text x="25.0" y="361.2" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">6–8 waves a minute</text><text x="25.0" y="377.5" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Swash stronger than backwash</text><text x="25.0" y="393.8" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Deposit: build beaches</text><text x="25.0" y="410.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Calm weather, distant storms</text><text x="415.0" y="345.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">High, steep; short wavelength</text><text x="415.0" y="361.2" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">10–14 waves a minute</text><text x="415.0" y="377.5" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Backwash stronger than swash</text><text x="415.0" y="393.8" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Erode: remove beach, attack cliffs</text><text x="415.0" y="410.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">Storms, strong local winds</text><text x="20.0" y="455.0" font-family="Arial" font-size="12.5" fill="#233b4d" text-anchor="start">Fetch = the distance of open water the wind blows over. Longer fetch + stronger, longer-lasting wind → bigger waves.</text><text x="20.0" y="473.0" font-family="Arial" font-size="12.5" fill="#233b4d" text-anchor="start">Muriwai faces the long fetch of the Tasman Sea, so storms bring high-energy destructive waves.</text></svg>