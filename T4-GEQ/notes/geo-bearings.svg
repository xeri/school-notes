old">A (start)</text><circle cx="699.2" cy="215" r="6" fill="#a8383b"/><text x="709.2" y="220" font-family="Arial" font-size="15" fill="#a8383b" font-weight="bold">B</text><path d="M500.0 260.0 A70 70 0 0 1 560.6 295.0" fill="none" stroke="#c16b20" stroke-width="2.5" stroke-linejoin="round"/><text x="536" y="252" font-family="Arial" font-size="16" fill="#c16b20" font-weight="bold">060°</text><text x="560" y="340" font-family="Arial" font-size="14" fill="#173b50">Bearing of B from A = 060°</text><text x="560" y="357.5" font-family="Arial" font-size="14" fill="#173b50">Centre the protractor on A,</text><text x="560" y="375" font-family="Arial" font-size="14" fill="#173b50">0° to grid north, read</text><text x="560" y="392.5" font-family="Arial" font-size="14" fill="#173b50">CLOCKWISE; three digits.</text><text x="560" y="410" font-family="Arial" font-size="14" fill="#173b50">B to A = 060 + 180 = 240°</text></svg>
