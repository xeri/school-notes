<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The natural and enhanced greenhouse effect</text><rect x="20" y="60" width="370" height="360" fill="#16263a"/><text x="205" y="84" font-family="Arial" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Natural greenhouse effect</text><rect x="20" y="200" width="370" height="22" fill="#e7a54a"/><text x="380" y="216" font-family="Arial" font-size="12" fill="white" text-anchor="end" font-weight="bold">greenhouse gases</text><rect x="20" y="370" width="370" height="50" fill="#3f7f4f"/><text x="205" y="402" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Earth’s surface</text><circle cx="80" cy="120" r="22" fill="#f6c945"/><path d="M90 140L128 354" fill="none" stroke="#f6c945" stroke-width="7"/><path d="M130 365L121 351.8L133.9 349.5Z" fill="#f6c945" stroke-linejoin="round"/><text x="138" y="290" font-family="Arial" font-size="12" fill="#f6c945" font-weight="bold">short-wave</text><text x="138" y="305" font-family="Arial" font-size="12" fill="#f6c945" font-weight="bold">solar radiation</text><path d="M116 300L167.9 131.7" fill="none" stroke="#f8e7a0" stroke-width="2.5"/><path d="M170 125L171.2 134.9L163.4 132.5Z" fill="#f8e7a0" stroke-linejoin="round"/><text x="170" y="116" font-family="Arial" font-size="11" fill="white" text-anchor="middle">some reflected</text><path d="M270 365L281.2 233.1" fill="none" stroke="#ff7b5c" stroke-width="5"/><path d="M282 224L286.3 236.3L275.7 235.4Z" fill="#ff7b5c" stroke-linejoin="round"/><path d="M284 198L291.1 135.7" fill="none" stroke="#ff7b5c" stroke-width="6"/><path d="M292 128L295.3 138.5L286.4 137.5Z" fill="#ff7b5c" stroke-linejoin="round"/><path d="M305 224L317.1 352.9" fill="none" stroke="#ff7b5c" stroke-width="3"/><path d="M318 362L311.6 350.7L322.2 349.7Z" fill="#ff7b5c" stroke-linejoin="round"/><text x="138" y="335" font-family="Arial" font-size="12" fill="#ffb3a3" font-weight="bold">long-wave (heat)</text><text x="138" y="350" font-family="Arial" font-size="12" fill="#ffb3a3" font-weight="bold">radiation from Earth</text><text x="298" y="122" font-family="Arial" font-size="12" fill="white">heat escapes</text><text x="326" y="300" font-family="Arial" font-size="11" fill="white">some</text><text x="326" y="314" font-family="Arial" font-size="11" fill="white">trapped,</text><text x="326" y="328" font-family="Arial" font-size="11" fill="white">re-radiated</text><text x="326" y="342" font-family="Arial" font-size="11" fill="white">to Earth</text><rect x="410" y="60" width="370" height="360" fill="#16263a"/><text x="595" y="84" font-family="Arial" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Enhanced greenhouse effect</text><rect x="410" y="200" width="370" height="48" fill="#d2452f"/><text x="770" y="229" font-family="Arial" font-size="12" fill="white" text-anchor="end" font-weight="bold">MORE greenhouse gases</text><rect x="410" y="370" width="370" height="50" fill="#3f7f4f"/><text x="595" y="402" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Earth’s surface</text><circle cx="470" cy="120" r="22" fill="#f6c945"/><path d="M480 140L518 354" fill="none" stroke="#f6c945" stroke-width="7"/><path d="M520 365L511 351.8L523.9 349.5Z" fill="#f6c945" stroke-linejoin="round"/><text x="528" y="290" font-family="Arial" font-size="12" fill="#f6c945" font-weight="bold">short-wave</text><text x="528" y="305" font-family="Arial" font-size="12" fill="#f6c945" font-weight="bold">solar radiation</text><path d="M506 300L557.9 131.7" fill="none" stroke="#f8e7a0" stroke-width="2.5"/><path d="M560 125L561.2 134.9L553.4 132.5Z" fill="#f8e7a0" stroke-linejoin="round"/><text x="560" y="116" font-family="Arial" font-size="11" fill="white" text-anchor="middle">some reflected</text><path d="M660 365L671.1 259.1" fill="none" stroke="#ff7b5c" stroke-width="5"/><path d="M672 250L676 262.4L665.5 261.3Z" fill="#ff7b5c" stroke-linejoin="round"/><path d="M674 198L681.1 135.7" fill="none" stroke="#ff7b5c" stroke-width="3"/><path d="M682 128L685.3 138.5L676.4 137.5Z" fill="#ff7b5c" stroke-linejoin="round"/><path d="M695 250L707 353" fill="none" stroke="#ff7b5c" stroke-width="7"/><path d="M708 362L701.4 350.8L711.9 349.6Z" fill="#ff7b5c" stroke-linejoin="round"/><text x="528" y="335" font-family="Arial" font-size="12" fill="#ffb3a3" font-weight="bold">long-wave (heat)</text><text x="528" y="350" font-family="Arial" font-size="12" fill="#ffb3a3" font-weight="bold">radiation from Earth</text><text x="688" y="122" font-family="Arial" font-size="12" fill="white">less escapes</text><text x="716" y="300" font-family="Arial" font-size="11" fill="white" font-weight="bold">MORE</text><text x="716" y="314" font-family="Arial" font-size="11" fill="white">trapped,</text><text x="716" y="328" font-family="Arial" font-size="11" fill="white">re-radiated</text><text x="716" y="342" font-family="Arial" font-size="11" fill="white">to Earth</text><text x="30" y="445" font-family="Arial" font-size="12" fill="#173b50">Natural: gases such as water vapour and CO₂ absorb some outgoing heat and re-radiate it, keeping the average</text><text x="30" y="461" font-family="Arial" font-size="12" fill="#173b50">surface temperature about 15 °C instead of about −18 °C.  Enhanced: human emissions (CO₂, CH₄, N₂O, CFCs)</text><text x="30" y="477" font-family="Arial" font-size="12" fill="#173b50">thicken the layer, so more heat is trapped and global temperatures rise — global warming.</text></svg>
