h d="M40 390L40 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="40" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">90°S</text><path d="M160 390L160 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="160" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">60°S</text><path d="M280 390L280 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="280" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">30°S</text><path d="M400 390L400 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="400" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">0°</text><path d="M520 390L520 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="520" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">30°N</text><path d="M640 390L640 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="640" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">60°N</text><path d="M760 390L760 398" fill="none" stroke="#173b50" stroke-width="2"/><text x="760" y="414" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">90°N</text><text x="42" y="434" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">Polar</text><text x="42" y="448" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">high</text><text x="160" y="434" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">Sub-polar</text><text x="160" y="448" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">low</text><text x="280" y="434" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="middle" font-weight="bold">Subtropical</text><text x="280" y="448" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="middle" font-weight="bold">high</text><text x="400" y="434" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">Equatorial</text><text x="400" y="448" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">low (ITCZ)</text><text x="520" y="434" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="middle" font-weight="bold">Subtropical</text><text x="520" y="448" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="middle" font-weight="bold">high</text><text x="640" y="434" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">Sub-polar</text><text x="640" y="448" font-family="Arial" font-size="12" fill="#a8383b" text-anchor="middle" font-weight="bold">low</text><text x="758" y="434" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="end" font-weight="bold">Polar</text><text x="758" y="448" font-family="Arial" font-size="12" fill="#246b8e" text-anchor="end" font-weight="bold">high</text><text x="100" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Polar easterlies</text><text x="220" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Westerlies</text><text x="340" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">SE trade winds</text><text x="460" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">NE trade winds</text><text x="580" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Westerlies</text><text x="700" y="474" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Polar easterlies</text><text x="30" y="474" font-family="Arial" font-size="12" fill="#173b50"></text><text x="160" y="498" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">frontal rain,</text><text x="160" y="512" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">changeable</text><text x="280" y="498" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">hot deserts</text><text x="280" y="512" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">(dry, clear)</text><text x="400" y="498" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">rainforest:</text><text x="400" y="512" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">convection rain</text><text x="520" y="498" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">hot deserts</text><text x="520" y="512" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">(dry, clear)</text><text x="640" y="498" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">frontal rain,</text><text x="640" y="512" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">changeable</text><text x="40" y="474" font-family="Arial" font-size="12" fill="#173b50"></text><rect x="212" y="392" width="48" height="7" fill="#b8901f"/><text x="236" y="414" font-family="Arial" font-size="12" fill="#b8901f" text-anchor="middle" font-weight="bold">NZ</text><text x="40" y="545" font-family="Arial" font-size="13" fill="#173b50">Surface winds blow from high to low pressure and are deflected by the Coriolis effect (left in the</text><text x="40" y="562" font-family="Arial" font-size="13" fill="#173b50">Southern Hemisphere, right in the Northern) — so the trades blow from the SE and NE, the westerlies from the west.</text><text x="40" y="586" font-family="Arial" font-size="13" fill="#173b50">The whole pattern shifts with the overhead Sun: south in the Southern Hemisphere summer, north in winter.</text><text x="40" y="610" font-family="Arial" font-size="13" fill="#173b50">NZ summer: under the subtropical highs (settled). NZ winter: nearer the sub-polar low (fronts, rain).</text></svg>
