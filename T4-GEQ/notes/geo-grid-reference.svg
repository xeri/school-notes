<svg xmlns="http://www.w3.org/2000/svg" width="800" height="515" viewBox="0 0 800 515"><rect width="800" height="515" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Grid references: eastings first, then northings</text><rect x="190" y="310" width="120" height="120" fill="#f8f0c6"/><path d="M70 70L70 430" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="70" y="452" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="middle" font-weight="bold">45</text><path d="M70 70L430 70" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="60" y="75" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="end" font-weight="bold">68</text><path d="M190 70L190 430" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="190" y="452" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="middle" font-weight="bold">46</text><path d="M70 190L430 190" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="60" y="195" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="end" font-weight="bold">67</text><path d="M310 70L310 430" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="310" y="452" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="middle" font-weight="bold">47</text><path d="M70 310L430 310" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="60" y="315" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="end" font-weight="bold">66</text><path d="M430 70L430 430" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="430" y="452" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="middle" font-weight="bold">48</text><path d="M70 430L430 430" fill="none" stroke="#246b8e" stroke-width="1.6"/><text x="60" y="435" font-family="Arial" font-size="15" fill="#246b8e" text-anchor="end" font-weight="bold">65</text><path d="M202 430L202 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 418L198 418" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M214 430L214 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 406L198 406" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M226 430L226 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 394L198 394" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M238 430L238 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 382L198 382" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M250 430L250 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 370L198 370" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M262 430L262 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 358L198 358" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M274 430L274 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 346L198 346" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M286 430L286 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 334L198 334" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M298 430L298 422" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 322L198 322" fill="none" stroke="#8796a0" stroke-width="1"/><path d="M190 382L226 382" fill="none" stroke="#a8383b" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M226 430L226 382" fill="none" stroke="#a8383b" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="226" cy="382" r="6" fill="#a8383b"/><text x="236" y="376" font-family="Arial" font-size="14" fill="#a8383b" font-weight="bold">dot</text><text x="250" y="332" font-family="Arial" font-size="14" fill="#c16b20" text-anchor="middle" font-weight="bold">4665</text><path d="M190 421L192.4 426.8L198.6 427.2L193.8 431.2L195.3 437.3L190 434L184.7 437.3L186.2 431.2L181.4 427.2L187.6 426.8Z" fill="#6b4c9a" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="180" y="420" font-family="Arial" font-size="13" fill="#6b4c9a" text-anchor="end" font-weight="bold">star</text><text x="250" y="474" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle">Eastings: read left to right →</text><text x="30" y="250" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" transform="rotate(-90 30 250)">Northings: read upwards →</text><text x="470" y="80" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Four-figure reference (a square)</text><text x="470" y="102" font-family="Arial" font-size="14" fill="#173b50">Easting on the LEFT of the square: 46</text><text x="470" y="119.5" font-family="Arial" font-size="14" fill="#173b50">Northing at the BOTTOM of the square: 65</text><text x="470" y="137" font-family="Arial" font-size="14" fill="#173b50">The shaded square is 4665.</text><text x="470" y="180" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Six-figure reference (a point)</text><text x="470" y="202" font-family="Arial" font-size="14" fill="#173b50">Split each side into tenths (0–9).</text><text x="470" y="219.5" font-family="Arial" font-size="14" fill="#173b50">Dot: 46 + 3 tenths east = 463</text><text x="470" y="237" font-family="Arial" font-size="14" fill="#173b50">       65 + 4 tenths north = 654</text><text x="470" y="254.5" font-family="Arial" font-size="14" fill="#173b50">Dot = 463654</text><text x="470" y="272" font-family="Arial" font-size="14" fill="#173b50">Star (on the corner) = 460650</text><text x="470" y="320" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Memory aid</text><text x="470" y="342" font-family="Arial" font-size="14" fill="#173b50">“Along the corridor, then up the stairs.”</text><text x="470" y="359.5" font-family="Arial" font-size="14" fill="#173b50">Write the six digits together:</text><text x="470" y="377" font-family="Arial" font-size="14" fill="#173b50">463654, not 463 654 or 46,3,65,4.</text><text x="30" y="505" font-family="Arial" font-size="12.5" fill="#8796a0">The worked example in the specification: dot 4665 / 463654, star 460650.</text></svg>
