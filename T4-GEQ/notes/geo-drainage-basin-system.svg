<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The drainage basin as an open system</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">Orange box = input or output  ·  blue box = store  ·  arrow = flow (transfer)</text><rect x="155" y="73" width="190" height="44" rx="6" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><text x="250" y="92" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">PRECIPITATION</text><text x="250" y="109" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">input</text><rect x="155" y="163" width="190" height="44" rx="6" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="250" y="182" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Interception</text><text x="250" y="199" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">leaves and stems</text><rect x="155" y="253" width="190" height="44" rx="6" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="250" y="272" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Surface storage</text><text x="250" y="289" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">puddles, lakes</text><rect x="155" y="343" width="190" height="44" rx="6" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="250" y="362" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Soil moisture</text><text x="250" y="379" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">water in the soil</text><rect x="155" y="433" width="190" height="44" rx="6" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="250" y="452" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Groundwater</text><text x="250" y="469" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">water in permeable rock</text><rect x="505" y="163" width="190" height="44" rx="6" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><text x="600" y="182" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">EVAPOTRANSPIRATION</text><text x="600" y="199" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">output to the atmosphere</text><rect x="505" y="343" width="190" height="44" rx="6" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="600" y="362" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Channel storage</text><text x="600" y="379" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">water in the river</text><rect x="505" y="448" width="190" height="44" rx="6" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><text x="600" y="467" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">DISCHARGE</text><text x="600" y="484" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">output via the river mouth</text><path d="M250 117L250 156" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M250 163L245.9 153.9L254.1 153.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="258" y="145" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">caught by vegetation</text><path d="M250 207L250 246" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M250 253L245.9 243.9L254.1 243.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="258" y="235" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">throughfall, stemflow</text><path d="M250 297L250 336" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M250 343L245.9 333.9L254.1 333.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="258" y="325" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">infiltration</text><path d="M250 387L250 426" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M250 433L245.9 423.9L254.1 423.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="258" y="415" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">percolation</text><path d="M345 275L498.7 349" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M505 352L495 351.7L498.5 344.4Z" fill="#246b8e" stroke-linejoin="round"/><text x="400" y="300" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">overland (surface) flow</text><path d="M345 365L498 365" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M505 365L495.9 369.1L495.9 360.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="380" y="358" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">throughflow</text><path d="M345 455L498.7 383" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M505 380L498.5 387.6L495 380.2Z" fill="#246b8e" stroke-linejoin="round"/><text x="395" y="445" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">groundwater flow (baseflow)</text><path d="M600 387L600 441" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M600 448L595.9 438.9L604.1 438.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="608" y="425" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">channel flow</text><path d="M155 95L110 95L110 275L148 275" fill="none" stroke="#246b8e" stroke-width="2.5" stroke-linejoin="round"/><path d="M155 275L145.9 279.1L145.9 270.9Z" fill="#246b8e" stroke-linejoin="round"/><text x="102" y="185" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="middle" font-weight="bold" transform="rotate(-90 102 185)">direct precipitation</text><path d="M345 185L498 185" fill="none" stroke="#c16b20" stroke-width="2.5"/><path d="M505 185L495.9 189.1L495.9 180.9Z" fill="#c16b20" stroke-linejoin="round"/><path d="M330 262L513.3 208.9" fill="none" stroke="#c16b20" stroke-width="2.5"/><path d="M520 207L512.4 213.5L510.1 205.6Z" fill="#c16b20" stroke-linejoin="round"/><text x="400" y="176" font-family="Arial" font-size="13" fill="#c16b20" font-weight="bold">evaporation</text><text x="430" y="260" font-family="Arial" font-size="13" fill="#c16b20" font-weight="bold">evaporation,</text><text x="430" y="276" font-family="Arial" font-size="13" fill="#c16b20" font-weight="bold">transpiration</text></svg>
