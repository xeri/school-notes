<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><rect width="800" height="420" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">New Zealand’s energy mix</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">Class statistics sheets; percentages rounded</text><text x="30" y="90" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Electricity generation, 2023 (≈88% renewable)</text><text x="125" y="127" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Hydro</text><rect x="132" y="114" width="220" height="18" rx="3" fill="#246b8e"/><text x="358" y="128" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">60%</text><text x="125" y="159" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Geothermal</text><rect x="132" y="146" width="66" height="18" rx="3" fill="#246b8e"/><text x="204" y="160" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">18%</text><text x="125" y="191" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Natural gas</text><rect x="132" y="178" width="33" height="18" rx="3" fill="#246b8e"/><text x="171" y="192" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">9%</text><text x="125" y="223" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Wind</text><rect x="132" y="210" width="25.7" height="18" rx="3" fill="#246b8e"/><text x="163.7" y="224" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">7%</text><text x="125" y="255" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Coal</text><rect x="132" y="242" width="7.3" height="18" rx="3" fill="#246b8e"/><text x="145.3" y="256" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">2%</text><text x="125" y="287" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Solar</text><rect x="132" y="274" width="3.7" height="18" rx="3" fill="#246b8e"/><text x="141.7" y="288" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">1%</text><text x="125" y="319" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Wood</text><rect x="132" y="306" width="3.7" height="18" rx="3" fill="#246b8e"/><text x="141.7" y="320" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">1%</text><text x="125" y="351" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Biogas</text><rect x="132" y="338" width="3.7" height="18" rx="3" fill="#246b8e"/><text x="141.7" y="352" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">1%</text><text x="420" y="90" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Total primary energy supply</text><text x="515" y="127" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Oil</text><rect x="522" y="114" width="117.3" height="18" rx="3" fill="#c16b20"/><text x="645.3" y="128" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">32%</text><text x="515" y="159" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Geothermal</text><rect x="522" y="146" width="80.7" height="18" rx="3" fill="#c16b20"/><text x="608.7" y="160" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">22%</text><text x="515" y="191" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Natural gas</text><rect x="522" y="178" width="73.3" height="18" rx="3" fill="#c16b20"/><text x="601.3" y="192" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">20%</text><text x="515" y="223" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Hydro</text><rect x="522" y="210" width="36.7" height="18" rx="3" fill="#c16b20"/><text x="564.7" y="224" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">10%</text><text x="515" y="255" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Coal</text><rect x="522" y="242" width="25.7" height="18" rx="3" fill="#c16b20"/><text x="553.7" y="256" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">7%</text><text x="515" y="287" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Other</text><rect x="522" y="274" width="33" height="18" rx="3" fill="#c16b20"/><text x="561" y="288" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">9%</text><text x="30" y="402" font-family="Arial" font-size="12" fill="#233b4d">Electricity is only about a quarter of energy use: transport and industrial heat still run mostly on oil, gas and coal.</text></svg>
