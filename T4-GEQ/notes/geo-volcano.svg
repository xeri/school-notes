<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="800" height="540" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Composite volcano (stratovolcano) — cross-section</text><rect x="30" y="380" width="470" height="140" fill="#c9a27a"/><path d="M60 380L240 125L280 125L460 380Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M90 380L243 170L277 170L430 380Z" fill="#c98b6b" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M120 380L246 215L274 215L400 380Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M150 380L249 260L271 260L370 380Z" fill="#c98b6b" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><ellipse cx="260" cy="455" rx="95" ry="34" fill="#d2452f" stroke="#173b50" stroke-width="1"/><path d="M252 430L252 128L268 128L268 430Z" fill="#d2452f" stroke="#173b50" stroke-width="2" stroke-linejoin="round"/><path d="M262 335L350 228L357 235L268 345Z" fill="#d2452f" stroke="#173b50" stroke-width="2" stroke-linejoin="round"/><path d="M335 236L352 214L372 238Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M240 125Q260 140 280 125" fill="none" stroke="#173b50" stroke-width="2" stroke-linejoin="round"/><circle cx="245" cy="92" r="22" fill="#9aa3aa" stroke="#173b50" stroke-width="1"/><circle cx="270" cy="80" r="26" fill="#9aa3aa" stroke="#173b50" stroke-width="1"/><circle cx="295" cy="92" r="20" fill="#9aa3aa" stroke="#173b50" stroke-width="1"/><circle cx="258" cy="62" r="18" fill="#9aa3aa" stroke="#173b50" stroke-width="1"/><circle cx="285" cy="56" r="17" fill="#9aa3aa" stroke="#173b50" stroke-width="1"/><path d="M242 130Q200 190 160 250L170 254Q206 196 248 134Z" fill="#e0703a" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="420" y="505" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Magma chamber</text><path d="M516 67.1L312 80" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="312" cy="80" r="2.5" fill="#233b4d"/><text x="520" y="72" font-family="Arial" font-size="14" fill="#173b50">Ash cloud and volcanic bombs</text><path d="M516 115.1L278 128" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="278" cy="128" r="2.5" fill="#233b4d"/><text x="520" y="120" font-family="Arial" font-size="14" fill="#173b50">Crater</text><path d="M516 160.1L266 200" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="266" cy="200" r="2.5" fill="#233b4d"/><text x="520" y="165" font-family="Arial" font-size="14" fill="#173b50">Main vent</text><path d="M516 205.1L362 228" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="362" cy="228" r="2.5" fill="#233b4d"/><text x="520" y="210" font-family="Arial" font-size="14" fill="#173b50">Secondary (side) vent</text><path d="M516 250.1L300 300" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="300" cy="300" r="2.5" fill="#233b4d"/><text x="520" y="255" font-family="Arial" font-size="14" fill="#173b50">Alternate layers of ash and lava</text><path d="M516 295.1L420 360" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="420" cy="360" r="2.5" fill="#233b4d"/><text x="520" y="300" font-family="Arial" font-size="14" fill="#173b50">Steep sides: sticky andesitic lava</text><path d="M107 195.1L196 196" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="196" cy="196" r="2.5" fill="#233b4d"/><text x="40" y="200" font-family="Arial" font-size="14" fill="#173b50">Lava flow</text><text x="520" y="340" font-family="Arial" font-size="13" fill="#233b4d">Eruptions alternate: explosive</text><text x="520" y="356" font-family="Arial" font-size="13" fill="#233b4d">ash, then lava flows</text><text x="520" y="372" font-family="Arial" font-size="13" fill="#233b4d">e.g. Ruapehu, Taranaki, Fuji</text><path d="M520 425Q660 385 790 425Z" fill="#c98b6b" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="520" y="445" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Shield volcano (for contrast):</text><text x="520" y="462" font-family="Arial" font-size="13" fill="#173b50">runny basaltic lava spreads far,</text><text x="520" y="479" font-family="Arial" font-size="13" fill="#173b50">so gentle slopes and a wide base</text><text x="520" y="496" font-family="Arial" font-size="13" fill="#173b50">(Mauna Loa; Rangitoto’s profile)</text></svg>
