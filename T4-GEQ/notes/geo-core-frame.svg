<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><rect width="800" height="420" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Core–frame model of the CBD</text><ellipse cx="230" cy="225" rx="190" ry="160" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><ellipse cx="230" cy="225" rx="100" ry="80" fill="#e3a3a0" stroke="#173b50" stroke-width="1.5"/><text x="230" y="220" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">CORE</text><text x="230" y="242" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle">PLVI</text><text x="230" y="110" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">FRAME</text><text x="450" y="80" font-family="Arial" font-size="15" fill="#173b50">Core</text><text x="450" y="99" font-family="Arial" font-size="15" fill="#173b50">• department stores, chain stores,</text><text x="450" y="118" font-family="Arial" font-size="15" fill="#173b50">  banks, head offices</text><text x="450" y="137" font-family="Arial" font-size="15" fill="#173b50">• tallest buildings, built upwards</text><text x="450" y="156" font-family="Arial" font-size="15" fill="#173b50">• highest land values and</text><text x="450" y="175" font-family="Arial" font-size="15" fill="#173b50">  pedestrian counts</text><text x="450" y="194" font-family="Arial" font-size="15" fill="#173b50">• vertical zoning: shops below,</text><text x="450" y="213" font-family="Arial" font-size="15" fill="#173b50">  offices above</text><text x="450" y="255" font-family="Arial" font-size="15" fill="#173b50">Frame</text><text x="450" y="274" font-family="Arial" font-size="15" fill="#173b50">• car parks, bus and rail stations</text><text x="450" y="293" font-family="Arial" font-size="15" fill="#173b50">• warehouses, wholesalers, workshops</text><text x="450" y="312" font-family="Arial" font-size="15" fill="#173b50">• car showrooms, hospitals,</text><text x="450" y="331" font-family="Arial" font-size="15" fill="#173b50">  colleges, government offices</text><text x="450" y="350" font-family="Arial" font-size="15" fill="#173b50">• lower buildings, more space,</text><text x="450" y="369" font-family="Arial" font-size="15" fill="#173b50">  lower land values</text><text x="30" y="408" font-family="Arial" font-size="13" fill="#8796a0">Schematic model.</text></svg>
