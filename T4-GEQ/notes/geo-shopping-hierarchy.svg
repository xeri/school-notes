<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The modern shopping (retail) hierarchy</text><path d="M235 60L235 60L276 138L194 138Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1.3" stroke-linejoin="round"/><text x="235" y="111" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">CBD</text><path d="M194 138L276 138L317 216L153 216Z" fill="#efc08f" stroke="#173b50" stroke-width="1.3" stroke-linejoin="round"/><text x="235" y="183" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Regional centre</text><path d="M153 216L317 216L358 294L112 294Z" fill="#f8f0c6" stroke="#173b50" stroke-width="1.3" stroke-linejoin="round"/><text x="235" y="261" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Retail park</text><path d="M112 294L358 294L399 372L71 372Z" fill="#e1efd9" stroke="#173b50" stroke-width="1.3" stroke-linejoin="round"/><text x="235" y="339" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Suburban parade</text><path d="M71 372L399 372L440 450L30 450Z" fill="#dcebf5" stroke="#173b50" stroke-width="1.3" stroke-linejoin="round"/><text x="235" y="417" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle" font-weight="bold">Corner shop</text><path d="M263.5 99L450 99" fill="none" stroke="#8796a0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="456" y="95" font-family="Arial" font-size="13.5" fill="#173b50">CBD: department stores, specialist, luxury and</text><text x="456" y="111.9" font-family="Arial" font-size="13.5" fill="#173b50">comparison shops, offices; national range</text><path d="M304.5 177L450 177" fill="none" stroke="#8796a0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="456" y="173" font-family="Arial" font-size="13.5" fill="#173b50">Regional shopping centre (indoor mall), e.g.</text><text x="456" y="189.9" font-family="Arial" font-size="13.5" fill="#173b50">Sylvia Park: 200+ shops, cinema, free parking</text><path d="M345.5 255L450 255" fill="none" stroke="#8796a0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="456" y="251" font-family="Arial" font-size="13.5" fill="#173b50">Out-of-town retail park: big-box stores (DIY,</text><text x="456" y="267.9" font-family="Arial" font-size="13.5" fill="#173b50">furniture, electrical) at a motorway junction</text><path d="M386.5 333L450 333" fill="none" stroke="#8796a0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="456" y="329" font-family="Arial" font-size="13.5" fill="#173b50">Suburban parade / district centre: supermarket,</text><text x="456" y="345.9" font-family="Arial" font-size="13.5" fill="#173b50">chemist, bank, takeaways; local catchment</text><path d="M427.5 411L450 411" fill="none" stroke="#8796a0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="456" y="407" font-family="Arial" font-size="13.5" fill="#173b50">Corner shop (dairy): milk, bread, papers;</text><text x="456" y="423.9" font-family="Arial" font-size="13.5" fill="#173b50">convenience goods bought daily, on foot</text><rect x="30" y="466" width="740" height="62" rx="6" fill="#e6ddf1" stroke="#173b50" stroke-width="1.3"/><text x="45" y="489" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Online retail sits outside the pyramid: it competes at every level, has an unlimited range</text><text x="45" y="512" font-family="Arial" font-size="14" fill="#173b50">and almost no threshold — one cause of empty shops in CBDs and suburban parades.</text><text x="30" y="552" font-family="Arial" font-size="14" fill="#173b50">Up the hierarchy: fewer centres, higher-order (comparison) goods, larger threshold, range and sphere</text><text x="30" y="572" font-family="Arial" font-size="14" fill="#173b50">of influence. Down the hierarchy: more centres, low-order (convenience) goods bought often and nearby.</text><text x="30" y="592" font-family="Arial" font-size="12.5" fill="#8796a0">Schematic model; Sylvia Park is in Auckland.</text></svg>
