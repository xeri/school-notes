<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Latin American city model (Griffin and Ford, 1980; Ford 1996)</text><circle cx="255" cy="300" r="230" fill="#d2b48f" stroke="#173b50" stroke-width="1.5"/><circle cx="255" cy="300" r="165" fill="#f8f0c6" stroke="#173b50" stroke-width="1.5"/><circle cx="255" cy="300" r="100" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><circle cx="255" cy="300" r="198" fill="none" stroke="#173b50" stroke-width="2.5" stroke-dasharray="10 6"/><path d="M168.8 86.7A230 230 0 0 1 341.2 86.7L269.2 264.8A38 38 0 0 0 240.8 264.8Z" fill="#e6ddf1" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M322.4 133.1A180 180 0 0 1 365.8 158.2L316.6 221.2A100 100 0 0 0 292.5 207.3Z" fill="#dcebf5" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M480 252.2A230 230 0 0 1 480 347.8L292.2 307.9A38 38 0 0 0 292.2 292.1Z" fill="#cfd6db" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M147 503.1A230 230 0 0 1 78.8 447.8L225.9 324.4A38 38 0 0 0 237.2 333.6Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M431.2 447.8A230 230 0 0 1 396.6 481.2L316.6 378.8A100 100 0 0 0 331.6 364.3Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M204.8 329A58 58 0 0 1 235.2 245.5L242 264.3A38 38 0 0 0 222.1 319Z" fill="#efc08f" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><circle cx="255" cy="300" r="38" fill="#a8383b" stroke="#173b50" stroke-width="1.5"/><path d="M255 262L255 65" fill="none" stroke="#173b50" stroke-width="4"/><circle cx="255" cy="80" r="10" fill="#6b4c9a" stroke="#173b50" stroke-width="1.5"/><text x="271" y="85" font-family="Arial" font-size="14" fill="#173b50" font-weight="bold">Mall</text><text x="255" y="306" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">CBD</text><text x="243" y="150" font-family="Arial" font-size="14" fill="#173b50" text-anchor="end" font-weight="bold">Spine</text><text x="123" y="310" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">A</text><text x="41" y="310" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">B</text><text x="180" y="270" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">C</text><text x="175" y="405" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">D</text><text x="421" y="306" font-family="Arial" font-size="18" fill="#173b50" text-anchor="middle" font-weight="bold">E</text><rect x="515" y="60" width="20" height="20" fill="#a8383b" stroke="#173b50" stroke-width="1"/><text x="545" y="75" font-family="Arial" font-size="14" fill="#173b50">CBD with market</text><rect x="515" y="90" width="20" height="20" fill="#e6ddf1" stroke="#173b50" stroke-width="1"/><text x="545" y="105" font-family="Arial" font-size="14" fill="#173b50">Commercial spine and élite</text><text x="545" y="121.8" font-family="Arial" font-size="14" fill="#173b50">residential sector</text><rect x="515" y="136.8" width="20" height="20" fill="#dcebf5" stroke="#173b50" stroke-width="1"/><text x="545" y="151.8" font-family="Arial" font-size="14" fill="#173b50">Middle-class tract</text><rect x="515" y="166.8" width="20" height="20" fill="#e1efd9" stroke="#173b50" stroke-width="1"/><text x="545" y="181.8" font-family="Arial" font-size="14" fill="#173b50">C  Zone of maturity: established</text><text x="545" y="198.6" font-family="Arial" font-size="14" fill="#173b50">housing with full services</text><rect x="515" y="213.6" width="20" height="20" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="545" y="228.6" font-family="Arial" font-size="14" fill="#173b50">A  Zone of in situ accretion:</text><text x="545" y="245.4" font-family="Arial" font-size="14" fill="#173b50">housing being improved bit by bit</text><rect x="515" y="260.4" width="20" height="20" fill="#d2b48f" stroke="#173b50" stroke-width="1"/><text x="545" y="275.4" font-family="Arial" font-size="14" fill="#173b50">B  Zone of peripheral squatter</text><text x="545" y="292.2" font-family="Arial" font-size="14" fill="#173b50">settlements: newest migrants</text><rect x="515" y="307.2" width="20" height="20" fill="#e3a3a0" stroke="#173b50" stroke-width="1"/><text x="545" y="322.2" font-family="Arial" font-size="14" fill="#173b50">D  Disamenity sector: worst land,</text><text x="545" y="339" font-family="Arial" font-size="14" fill="#173b50">very poor housing (steep, flood-prone)</text><rect x="515" y="354" width="20" height="20" fill="#cfd6db" stroke="#173b50" stroke-width="1"/><text x="545" y="369" font-family="Arial" font-size="14" fill="#173b50">E  Industrial sector</text><rect x="515" y="384" width="20" height="20" fill="#efc08f" stroke="#173b50" stroke-width="1"/><text x="545" y="399" font-family="Arial" font-size="14" fill="#173b50">Gentrification zone</text><path d="M515 420L545 420" fill="none" stroke="#173b50" stroke-width="2.5" stroke-dasharray="10 6"/><text x="555" y="425" font-family="Arial" font-size="14" fill="#173b50">Periférico (ring road)</text><text x="515" y="454" font-family="Arial" font-size="14" fill="#173b50">Wealth falls outwards: the rich live</text><text x="515" y="471.5" font-family="Arial" font-size="14" fill="#173b50">near the centre, the poor on the edge</text><text x="515" y="489" font-family="Arial" font-size="14" fill="#173b50">— the reverse of the Burgess model.</text><text x="30" y="550" font-family="Arial" font-size="13" fill="#8796a0">Schematic model.</text></svg>
