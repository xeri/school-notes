<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="white"/><defs><marker id="aink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173b50"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8383b"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b8e"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24775c"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c16b20"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">River flood management: hard and soft engineering</text><rect x="15.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="23.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">1  Dam and reservoir (hard)</text><polygon points="15.0,115.0 255.0,195.0 255.0,225.0 15.0,225.0" fill="#e1efd9" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><polygon points="15.0,130.0 140.0,130.0 140.0,173.0 15.0,131.0" fill="#8cc3e6" stroke-linejoin="round"/><polygon points="133.0,123.0 149.0,123.0 165.0,187.0 133.0,177.0" fill="#8796a0" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M165 183 L255 203" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><text x="27.0" y="103.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">reservoir stores floodwater</text><text x="165.0" y="155.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">slow release</text><text x="15.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Stores the flood peak and releases it</text><text x="15.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">slowly; also HEP and water supply.</text><text x="15.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Costly; traps sediment (Waikato hydro lakes).</text><rect x="280.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="288.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">2  Stopbanks / artificial levées (hard)</text><polygon points="280.0,175.0 340.0,175.0 355.0,135.0 372.0,135.0 380.0,205.0 420.0,205.0 428.0,135.0 445.0,135.0 460.0,175.0 520.0,175.0 520.0,225.0 280.0,225.0" fill="#e1efd9" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><polygon points="372.0,143.0 428.0,143.0 420.0,205.0 380.0,205.0" fill="#8cc3e6" stroke-linejoin="round"/><path d="M377 175 L423 175" fill="none" stroke="#246b8e" stroke-width="1.2" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="310.0" y="131.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="start">stopbank</text><text x="380.0" y="103.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">flood level held</text><text x="430.0" y="193.0" font-family="Arial" font-size="10.5" fill="#246b8e" text-anchor="start">normal level</text><polygon points="295.0,175.0 317.0,175.0 317.0,159.0 306.0,149.0 295.0,159.0" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><polygon points="480.0,175.0 502.0,175.0 502.0,159.0 491.0,149.0 480.0,159.0" fill="#f8e3cc" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="280.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Raised banks let the channel hold more</text><text x="280.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">water. Pass the flood downstream; fail</text><text x="280.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">badly if overtopped (Hawke's Bay, 2023).</text><rect x="545.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="553.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">3  Channel straightening (hard)</text><path d="M555 155 Q585 95 615 155 Q645 215 675 155 Q705 95 735 155 L775 155" fill="none" stroke="#246b8e" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/><path d="M555 155 L775 155" fill="none" stroke="#246b8e" stroke-width="6" stroke-linejoin="round"/><path d="M695 180 L770 180" fill="none" stroke="#a8383b" stroke-width="2.5" marker-end="url(#ared)"/><text x="645.0" y="200.0" font-family="Arial" font-size="11.5" fill="#a8383b" text-anchor="start">faster flow downstream</text><text x="560.0" y="100.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">old meanders (dashed)</text><text x="545.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Cutting out meanders, deepening or</text><text x="545.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">dredging moves water away faster. Local</text><text x="545.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">relief, but floods move downstream.</text><rect x="15.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="23.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">4  Floodplain zoning (soft)</text><rect x="15.0" y="350.0" width="240.0" height="28.0" fill="#e1efd9"/><text x="23.0" y="368.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="start">low risk (far): housing, schools</text><rect x="15.0" y="378.0" width="240.0" height="28.0" fill="#f8f0c6"/><text x="23.0" y="396.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="start">medium: playing fields, car parks</text><rect x="15.0" y="406.0" width="240.0" height="28.0" fill="#e3a3a0"/><text x="23.0" y="424.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="start">high risk (by river): parks, farmland</text><rect x="15.0" y="434.0" width="240.0" height="14.0" fill="#8cc3e6"/><text x="195.0" y="445.0" font-family="Arial" font-size="11" fill="#173b50" text-anchor="start">river</text><rect x="15.0" y="448.0" width="240.0" height="17.5" fill="#e3a3a0"/><rect x="15.0" y="465.5" width="240.0" height="17.5" fill="#f8f0c6"/><rect x="15.0" y="483.0" width="240.0" height="17.5" fill="#e1efd9"/><text x="15.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Flood-risk maps keep building off the</text><text x="15.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">riskiest land. Cheap and permanent;</text><text x="15.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">cannot move existing homes.</text><rect x="280.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="288.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">5  Afforestation (soft)</text><polygon points="280.0,410.0 520.0,480.0 520.0,490.0 280.0,490.0" fill="#d2b48f" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M305 417.2916666666667 L305 395.2916666666667" fill="none" stroke="#8a5a3b" stroke-width="3" stroke-linejoin="round"/><circle cx="305" cy="387.2916666666667" r="13" fill="#24775c" stroke="#173b50" stroke-width="0.8"/><path d="M350 430.4166666666667 L350 408.4166666666667" fill="none" stroke="#8a5a3b" stroke-width="3" stroke-linejoin="round"/><circle cx="350" cy="400.4166666666667" r="13" fill="#24775c" stroke="#173b50" stroke-width="0.8"/><path d="M395 443.5416666666667 L395 421.5416666666667" fill="none" stroke="#8a5a3b" stroke-width="3" stroke-linejoin="round"/><circle cx="395" cy="413.5416666666667" r="13" fill="#24775c" stroke="#173b50" stroke-width="0.8"/><path d="M440 456.6666666666667 L440 434.6666666666667" fill="none" stroke="#8a5a3b" stroke-width="3" stroke-linejoin="round"/><circle cx="440" cy="426.6666666666667" r="13" fill="#24775c" stroke="#173b50" stroke-width="0.8"/><path d="M485 469.7916666666667 L485 447.7916666666667" fill="none" stroke="#8a5a3b" stroke-width="3" stroke-linejoin="round"/><circle cx="485" cy="439.7916666666667" r="13" fill="#24775c" stroke="#173b50" stroke-width="0.8"/><path d="M320 350 L314 372" fill="none" stroke="#246b8e" stroke-width="1.5" marker-end="url(#ablue)"/><path d="M390 350 L384 372" fill="none" stroke="#246b8e" stroke-width="1.5" marker-end="url(#ablue)"/><path d="M460 350 L454 372" fill="none" stroke="#246b8e" stroke-width="1.5" marker-end="url(#ablue)"/><path d="M350 438 L350 470" fill="none" stroke="#246b8e" stroke-width="2" marker-end="url(#ablue)"/><text x="356.0" y="472.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">infiltration</text><text x="400.0" y="360.0" font-family="Arial" font-size="11.5" fill="#24775c" text-anchor="start">interception</text><text x="280.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Leaves intercept rain; roots raise</text><text x="280.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">infiltration → less, slower runoff.</text><text x="280.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Cheap, habitat; slow to work.</text><rect x="545.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="553.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">6  Effect on the hydrograph</text><path d="M575 355 L575 470 L775 470" fill="none" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M575 450 L605 450 Q625 360 640 360 Q660 365 680 445 L770 450" fill="none" stroke="#a8383b" stroke-width="2.5" stroke-linejoin="round"/><path d="M575 450 L615 450 Q655 405 680 405 Q715 415 745 448 L770 450" fill="none" stroke="#246b8e" stroke-width="2.5" stroke-linejoin="round"/><text x="645.0" y="358.0" font-family="Arial" font-size="11.5" fill="#a8383b" text-anchor="start">before</text><text x="685.0" y="402.0" font-family="Arial" font-size="11.5" fill="#246b8e" text-anchor="start">after</text><text x="655.0" y="484.0" font-family="Arial" font-size="11" fill="#173b50" text-anchor="start">time</text><text x="569.0" y="365.0" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">Q</text><text x="545.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Good management lowers the peak</text><text x="545.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">discharge and lengthens the lag time,</text><text x="545.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">so bankfull is less often exceeded.</text><text x="20.0" y="585.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="start">Hard = structures that control the river. Soft = working with natural processes and managing land use. River methods are not credited in coastal answers.</text></svg>