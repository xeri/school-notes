<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Erosion of a headland: crack → cave → arch → stack → stump</text><rect x="15" y="70" width="148" height="200" fill="#eef5fa"/><rect x="23" y="110" width="132" height="140" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M89 180L91 250" fill="none" stroke="#173b50" stroke-width="2"/><rect x="15" y="236" width="148" height="34" fill="#8cc3e6"/><path d="M15 236L163 236" fill="none" stroke="#246b8e" stroke-width="1.5"/><text x="15" y="292" font-family="Arial" font-size="13" fill="#173b50">1  Waves attack a joint</text><text x="15" y="308.2" font-family="Arial" font-size="13" fill="#173b50">or fault in the</text><text x="15" y="324.5" font-family="Arial" font-size="13" fill="#173b50">headland</text><rect x="171" y="70" width="148" height="200" fill="#eef5fa"/><rect x="179" y="110" width="132" height="140" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M231 250L231 210Q246 190 261 210L261 250Z" fill="#5d6b75" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M246 150L246 195" fill="none" stroke="#173b50" stroke-width="1.5"/><rect x="171" y="236" width="148" height="34" fill="#8cc3e6"/><path d="M171 236L319 236" fill="none" stroke="#246b8e" stroke-width="1.5"/><text x="171" y="292" font-family="Arial" font-size="13" fill="#173b50">2  Hydraulic action and</text><text x="171" y="308.2" font-family="Arial" font-size="13" fill="#173b50">abrasion widen it into</text><text x="171" y="324.5" font-family="Arial" font-size="13" fill="#173b50">a cave</text><rect x="327" y="70" width="148" height="200" fill="#eef5fa"/><rect x="335" y="110" width="132" height="140" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M377 250L377 195Q402 160 427 195L427 250Z" fill="#eef5fa" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><rect x="327" y="236" width="148" height="34" fill="#8cc3e6"/><path d="M327 236L475 236" fill="none" stroke="#246b8e" stroke-width="1.5"/><text x="327" y="292" font-family="Arial" font-size="13" fill="#173b50">3  Caves on each side</text><text x="327" y="308.2" font-family="Arial" font-size="13" fill="#173b50">meet (or erode</text><text x="327" y="324.5" font-family="Arial" font-size="13" fill="#173b50">through): an arch</text><rect x="483" y="70" width="148" height="200" fill="#eef5fa"/><rect x="491" y="110" width="50" height="140" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><rect x="575" y="120" width="40" height="130" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><rect x="549" y="240" width="10" height="7" fill="#b9c1c7" stroke="#173b50" stroke-width="1"/><rect x="561" y="244" width="10" height="7" fill="#b9c1c7" stroke="#173b50" stroke-width="1"/><rect x="483" y="236" width="148" height="34" fill="#8cc3e6"/><path d="M483 236L631 236" fill="none" stroke="#246b8e" stroke-width="1.5"/><text x="483" y="292" font-family="Arial" font-size="13" fill="#173b50">4  The arch roof is</text><text x="483" y="308.2" font-family="Arial" font-size="13" fill="#173b50">undercut and collapses:</text><text x="483" y="324.5" font-family="Arial" font-size="13" fill="#173b50">a stack</text><rect x="639" y="70" width="148" height="200" fill="#eef5fa"/><rect x="647" y="110" width="50" height="140" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><rect x="735" y="222" width="32" height="28" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><rect x="639" y="236" width="148" height="34" fill="#8cc3e6"/><path d="M639 236L787 236" fill="none" stroke="#246b8e" stroke-width="1.5"/><text x="639" y="292" font-family="Arial" font-size="13" fill="#173b50">5  The stack is</text><text x="639" y="308.2" font-family="Arial" font-size="13" fill="#173b50">undercut and collapses:</text><text x="639" y="324.5" font-family="Arial" font-size="13" fill="#173b50">a stump, covered at</text><text x="639" y="340.8" font-family="Arial" font-size="13" fill="#173b50">high tide</text><text x="15" y="390" font-family="Arial" font-size="12" fill="#233b4d">Side view of a headland; waves attack from the front. Example: Muriwai (Motutara Island stack), Auckland.</text></svg>
