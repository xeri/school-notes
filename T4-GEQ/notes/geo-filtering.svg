<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Filtering: housing passes down the income scale as it ages</text><rect x="80" y="110" width="90" height="70" fill="#b5d6a3" stroke="#173b50" stroke-width="1.4"/><path d="M74 110L125 71.5L176 110Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="116" y="145" width="18" height="35" fill="white" stroke="#173b50" stroke-width="1"/><text x="125" y="210" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">c.1900</text><text x="125" y="232" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">Built for a wealthy</text><text x="125" y="248.9" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">family: large villa,</text><text x="125" y="265.8" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">servants, new</text><path d="M185 145L247.3 145" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M255 145L245 149.5L245 140.5Z" fill="#a8383b" stroke-linejoin="round"/><rect x="270" y="110" width="90" height="70" fill="#ecd986" stroke="#173b50" stroke-width="1.4"/><path d="M264 110L315 71.5L366 110Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="306" y="145" width="18" height="35" fill="white" stroke="#173b50" stroke-width="1"/><text x="315" y="210" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">c.1950</text><text x="315" y="232" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">Owners move to the</text><text x="315" y="248.9" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">suburbs; house sold</text><text x="315" y="265.8" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">to a middle-income family</text><path d="M375 145L437.3 145" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M445 145L435 149.5L435 140.5Z" fill="#a8383b" stroke-linejoin="round"/><rect x="460" y="110" width="90" height="70" fill="#e3a3a0" stroke="#173b50" stroke-width="1.4"/><path d="M454 110L505 71.5L556 110Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="496" y="145" width="18" height="35" fill="white" stroke="#173b50" stroke-width="1"/><text x="505" y="210" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">c.1980</text><text x="505" y="232" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">Subdivided into flats,</text><text x="505" y="248.9" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">rented to low-income</text><text x="505" y="265.8" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">tenants; poor repair</text><path d="M565 145L627.3 145" fill="none" stroke="#24775c" stroke-width="2.5"/><path d="M635 145L625 149.5L625 140.5Z" fill="#24775c" stroke-linejoin="round"/><rect x="650" y="110" width="90" height="70" fill="#a9cde6" stroke="#173b50" stroke-width="1.4"/><path d="M644 110L695 71.5L746 110Z" fill="#d2b48f" stroke="#173b50" stroke-width="1.4" stroke-linejoin="round"/><rect x="686" y="145" width="18" height="35" fill="white" stroke="#173b50" stroke-width="1"/><text x="695" y="210" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">c.2010</text><text x="695" y="232" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">Gentrified: bought and</text><text x="695" y="248.9" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">renovated by high earners</text><text x="695" y="265.8" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="middle">— filters back up</text><text x="220" y="170" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="middle">filters down</text><text x="410" y="170" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="middle">filters down</text><text x="600" y="170" font-family="Arial" font-size="13" fill="#24775c" text-anchor="middle">filters up</text><path d="M30 300L770 300" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="30" y="325" font-family="Arial" font-size="14" fill="#173b50">Meanwhile the households filter outwards: each family moves to newer, larger housing further from the</text><text x="30" y="342.5" font-family="Arial" font-size="14" fill="#173b50">CBD as its income rises, and the vacated house is taken by a poorer household (invasion and succession).</text><text x="30" y="360" font-family="Arial" font-size="14" fill="#173b50">Result: the oldest, cheapest, most crowded housing is in the inner city; the newest and most spacious</text><text x="30" y="377.5" font-family="Arial" font-size="14" fill="#173b50">is on the edge — the pattern in the Burgess model. Gentrification reverses it in some inner suburbs.</text></svg>
