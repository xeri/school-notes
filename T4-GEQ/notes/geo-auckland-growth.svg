<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">How Auckland grew: a timeline</text><rect x="60" y="284" width="165.8" height="32" fill="#dcebf5" stroke="#173b50" stroke-width="1"/><text x="142.9" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Founding</text><rect x="225.8" y="284" width="106.8" height="32" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="279.2" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Boom</text><rect x="332.6" y="284" width="114.2" height="32" fill="#e1efd9" stroke="#173b50" stroke-width="1"/><text x="389.7" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Trams, rail</text><rect x="446.8" y="284" width="110.5" height="32" fill="#f8e3cc" stroke="#173b50" stroke-width="1"/><text x="502.1" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Car-based sprawl</text><rect x="557.4" y="284" width="128.9" height="32" fill="#e6ddf1" stroke="#173b50" stroke-width="1"/><text x="621.8" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Sprawl + infill</text><rect x="686.3" y="284" width="73.7" height="32" fill="#f4d6d4" stroke="#173b50" stroke-width="1"/><text x="723.2" y="305" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle" font-weight="bold">Intensify</text><text x="60" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1840</text><text x="133.7" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1860</text><text x="207.4" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1880</text><text x="281.1" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1900</text><text x="354.7" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1920</text><text x="428.4" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1940</text><text x="502.1" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1960</text><text x="575.8" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1980</text><text x="649.5" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">2000</text><text x="723.2" y="334" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">2020</text><path d="M60 284L60 136" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="60" cy="284" r="3.5" fill="#173b50"/><text x="95" y="110" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Capital sited on</text><text x="95" y="125" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">the Waitematā (Hobson)</text><path d="M177.9 284L177.9 206" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="177.9" cy="284" r="3.5" fill="#173b50"/><text x="177.9" y="180" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">about 30 000</text><text x="177.9" y="195" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">people</text><path d="M281.1 284L281.1 136" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="281.1" cy="284" r="3.5" fill="#173b50"/><text x="281.1" y="110" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Port, refrigerated</text><text x="281.1" y="125" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">shipping; rail to Waikato</text><path d="M391.6 284L391.6 206" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="391.6" cy="284" r="3.5" fill="#173b50"/><text x="391.6" y="180" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">about 220 000</text><text x="391.6" y="195" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">people</text><path d="M498.4 284L498.4 136" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="498.4" cy="284" r="3.5" fill="#173b50"/><text x="498.4" y="110" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Harbour Bridge 1959; trams</text><text x="498.4" y="125" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">gone, motorways built</text><path d="M612.6 284L612.6 206" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="612.6" cy="284" r="3.5" fill="#173b50"/><text x="612.6" y="180" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">70% of growth by</text><text x="612.6" y="195" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">intensification since 1970s</text><path d="M708.4 284L708.4 136" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="708.4" cy="284" r="3.5" fill="#173b50"/><text x="708.4" y="110" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Unitary Plan,</text><text x="708.4" y="125" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Rural Urban Boundary</text><path d="M96.8 316L96.8 361" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="96.8" cy="316" r="3.5" fill="#173b50"/><text x="96.8" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Fencible villages:</text><text x="96.8" y="390" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Howick, Panmure, Onehunga</text><path d="M207.4 316L207.4 426" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="207.4" cy="316" r="3.5" fill="#173b50"/><text x="207.4" y="440" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Ponsonby, Grafton;</text><text x="207.4" y="455" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Onehunga, Ōtāhuhu grow</text><path d="M373.2 316L373.2 361" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="373.2" cy="316" r="3.5" fill="#173b50"/><text x="373.2" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Suburbs along</text><text x="373.2" y="390" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">tram and rail lines</text><path d="M520.5 316L520.5 426" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="520.5" cy="316" r="3.5" fill="#173b50"/><text x="520.5" y="440" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">North Shore, Mangere, Otara,</text><text x="520.5" y="455" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Henderson, Pakuranga</text><path d="M649.5 316L649.5 361" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="649.5" cy="316" r="3.5" fill="#173b50"/><text x="649.5" y="375" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Albany, Flat Bush,</text><text x="649.5" y="390" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">Hobsonville, Millwater</text><path d="M734.2 316L734.2 426" fill="none" stroke="#8796a0" stroke-width="1.2"/><circle cx="734.2" cy="316" r="3.5" fill="#173b50"/><text x="734.2" y="440" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">City Rail Link</text><text x="734.2" y="455" font-family="Arial" font-size="12.5" fill="#173b50" text-anchor="middle">(opening 2026)</text><text x="30" y="505" font-family="Arial" font-size="13.5" fill="#173b50">Pattern: a nucleus on the isthmus round Queen Street → satellite villages → linear growth along tram and rail lines</text><text x="30" y="524" font-family="Arial" font-size="13.5" fill="#173b50">→ car-based sprawl north (after the bridge), west and south → intensification along transport corridors today.</text><text x="30" y="543" font-family="Arial" font-size="13.5" fill="#173b50">Population: about 1.66 million at the 2023 census, about a third of New Zealand.</text><text x="30" y="588" font-family="Arial" font-size="12.5" fill="#8796a0">Dates of individual suburbs are approximate decades of their main growth.</text></svg>
