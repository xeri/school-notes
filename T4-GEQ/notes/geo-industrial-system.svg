<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410"><rect width="800" height="410" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Manufacturing as a system (with VW Wolfsburg)</text><rect x="30" y="70" width="220" height="220" rx="8" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="140" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">INPUTS</text><text x="42" y="118" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Raw materials, components</text><text x="42" y="136" font-family="Arial" font-size="13" fill="#173b50">steel, aluminium, plastics,</text><text x="42" y="154" font-family="Arial" font-size="13" fill="#173b50">glass, parts from suppliers</text><text x="42" y="172" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Energy: on-site power plants</text><text x="42" y="190" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Labour: ~70 000 at the site</text><text x="42" y="208" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Capital: robots, presses</text><text x="42" y="226" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Land: 6.5 km² site</text><text x="42" y="244" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Transport: canal, rail, roads</text><text x="42" y="262" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Research and design</text><rect x="290" y="70" width="220" height="220" rx="8" fill="#f8f0c6" stroke="#173b50" stroke-width="1.5"/><text x="400" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">PROCESSES</text><text x="302" y="118" font-family="Arial" font-size="13" fill="#173b50">press shop (steel panels)</text><text x="302" y="136" font-family="Arial" font-size="13" fill="#173b50">body shop (robot welding)</text><text x="302" y="154" font-family="Arial" font-size="13" fill="#173b50">paint shop</text><text x="302" y="172" font-family="Arial" font-size="13" fill="#173b50">assembly line</text><text x="302" y="190" font-family="Arial" font-size="13" fill="#173b50">(engine, interior, wheels)</text><text x="302" y="208" font-family="Arial" font-size="13" fill="#173b50">testing, quality control</text><text x="302" y="226" font-family="Arial" font-size="13" fill="#173b50">delivery, e.g. Autostadt</text><rect x="550" y="70" width="220" height="220" rx="8" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><text x="660" y="94" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">OUTPUTS</text><text x="562" y="118" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Products</text><text x="562" y="136" font-family="Arial" font-size="13" fill="#173b50">cars: about 490 000 in 2023</text><text x="562" y="154" font-family="Arial" font-size="13" fill="#173b50">(Golf, Tiguan, Touran)</text><text x="562" y="172" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Waste</text><text x="562" y="190" font-family="Arial" font-size="13" fill="#173b50">CO₂ and other emissions, scrap</text><text x="562" y="208" font-family="Arial" font-size="13" fill="#173b50">metal, solvents, waste water,</text><text x="562" y="226" font-family="Arial" font-size="13" fill="#173b50">noise, heat</text><text x="562" y="244" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Money</text><text x="562" y="262" font-family="Arial" font-size="13" fill="#173b50">profit, wages, taxes</text><path d="M252 180L279.6 180" fill="none" stroke="#173b50" stroke-width="3"/><path d="M288 180L277 184.9L277 175.1Z" fill="#173b50" stroke-linejoin="round"/><path d="M512 180L539.6 180" fill="none" stroke="#173b50" stroke-width="3"/><path d="M548 180L537 184.9L537 175.1Z" fill="#173b50" stroke-linejoin="round"/><path d="M660 290L660 322L140 322L140 302" fill="none" stroke="#a8383b" stroke-width="3" stroke-linejoin="round"/><path d="M140 292L144.9 303L135.1 303Z" fill="#a8383b" stroke-linejoin="round"/><text x="400" y="314" font-family="Arial" font-size="14" fill="#a8383b" text-anchor="middle" font-weight="bold">FEEDBACK</text><text x="400" y="342" font-family="Arial" font-size="13" fill="#a8383b" text-anchor="middle">profits reinvested (e.g. converting the power plants from coal to gas); falling demand cuts output and jobs</text></svg>
