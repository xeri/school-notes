<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="white"/><defs><marker id="aink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173b50"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8383b"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b8e"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24775c"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c16b20"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The cycle of urban change, and inner-city decline and regeneration</text><rect x="15.0" y="50.0" width="400.0" height="400.0" fill="#eef5fa"/><rect x="425.0" y="50.0" width="360.0" height="400.0" fill="#eef5fa"/><text x="215.0" y="74.0" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">The cycle of urban change (HIC city)</text><text x="215.0" y="270.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle" font-style="italic">people move</text><path d="M282 178 Q322 190 330 228" fill="none" stroke="#173b50" stroke-width="2.5" marker-end="url(#aink)"/><path d="M330 300 Q322 340 282 352" fill="none" stroke="#173b50" stroke-width="2.5" marker-end="url(#aink)"/><path d="M148 352 Q108 340 100 302" fill="none" stroke="#173b50" stroke-width="2.5" marker-end="url(#aink)"/><path d="M100 228 Q108 190 148 178" fill="none" stroke="#173b50" stroke-width="2.5" marker-end="url(#aink)"/><rect x="139.0" y="115.0" width="152.0" height="60.0" fill="white" stroke="#173b50" stroke-width="1.2" rx="6"/><text x="215.0" y="134.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">1 Urbanisation</text><text x="215.0" y="151.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">factory jobs draw</text><text x="215.0" y="165.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">people in from farms</text><rect x="259.0" y="235.0" width="152.0" height="60.0" fill="white" stroke="#173b50" stroke-width="1.2" rx="6"/><text x="335.0" y="254.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">2 Suburbanisation</text><text x="335.0" y="271.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">trams, cars, wealth:</text><text x="335.0" y="285.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">move to the edge</text><rect x="139.0" y="355.0" width="152.0" height="60.0" fill="white" stroke="#173b50" stroke-width="1.2" rx="6"/><text x="215.0" y="374.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">3 Counter-urbanisation</text><text x="215.0" y="391.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">leave the city for</text><text x="215.0" y="405.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">towns and villages</text><rect x="19.0" y="235.0" width="152.0" height="60.0" fill="white" stroke="#173b50" stroke-width="1.2" rx="6"/><text x="95.0" y="254.0" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">4 Re-urbanisation</text><text x="95.0" y="271.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">regenerated centre</text><text x="95.0" y="285.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="middle">draws people back</text><text x="30.0" y="440.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">The stages overlap: different groups move</text><text x="30.0" y="455.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">at the same time. Example: Auckland.</text><text x="605.0" y="74.0" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Inner-city decline and regeneration</text><rect x="440.0" y="88.0" width="300.0" height="30.0" fill="#e3a3a0" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="107.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Deindustrialisation: docks, factories close</text><rect x="440.0" y="130.0" width="300.0" height="30.0" fill="#e3a3a0" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="149.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Job losses, unemployment, poverty</text><rect x="440.0" y="172.0" width="300.0" height="30.0" fill="#e3a3a0" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="191.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Wealthier residents leave; rates fall</text><rect x="440.0" y="214.0" width="300.0" height="30.0" fill="#e3a3a0" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="233.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Housing and services decay; derelict land</text><rect x="440.0" y="256.0" width="300.0" height="30.0" fill="#e3a3a0" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="275.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Crime, poor image: investment stays away</text><rect x="440.0" y="320.0" width="300.0" height="30.0" fill="#e1efd9" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="339.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Regeneration: public money draws private investment</text><rect x="440.0" y="362.0" width="300.0" height="30.0" fill="#e1efd9" stroke="#173b50" stroke-width="1" rx="4"/><text x="590.0" y="381.0" font-family="Arial" font-size="11.5" fill="#173b50" text-anchor="middle">Gentrification and re-urbanisation</text><path d="M590 118 L590 128" fill="none" stroke="#173b50" stroke-width="2" marker-end="url(#aink)"/><path d="M590 160 L590 170" fill="none" stroke="#173b50" stroke-width="2" marker-end="url(#aink)"/><path d="M590 202 L590 212" fill="none" stroke="#173b50" stroke-width="2" marker-end="url(#aink)"/><path d="M590 244 L590 254" fill="none" stroke="#173b50" stroke-width="2" marker-end="url(#aink)"/><path d="M590 286 L590 318" fill="none" stroke="#24775c" stroke-width="2" marker-end="url(#agreen)"/><path d="M590 350 L590 360" fill="none" stroke="#24775c" stroke-width="2" marker-end="url(#agreen)"/><text x="600.0" y="312.0" font-family="Arial" font-size="11.5" fill="#24775c" text-anchor="start" font-weight="bold">break the spiral</text><path d="M740 271 L765 271 L765 145 L743 145" fill="none" stroke="#a8383b" stroke-width="2" marker-end="url(#ared)"/><text x="777" y="223.0" font-family="Arial" font-size="11.5" fill="#a8383b" transform="rotate(-90 777 223.0)">downward spiral</text><text x="440.0" y="412.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="start">London Docklands: docks closed by 1981 → LDDC</text><text x="440.0" y="426.4" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="start">1981–98 → Canary Wharf, DLR → prices rose.</text><text x="20.0" y="480.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Decline pushes people out (suburbanisation, counter-urbanisation); regeneration pulls them back (re-urbanisation).</text><text x="20.0" y="498.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Gentrification improves housing but can displace poorer, long-standing residents.</text></svg>