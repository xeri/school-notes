<svg xmlns="http://www.w3.org/2000/svg" width="800" height="565" viewBox="0 0 800 565"><rect width="800" height="565" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Greenhouse gases and global temperature since 1850</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">Approximate, smoothed values. Two panels share the same time axis.</text><path d="M90 267.5L720 267.5" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="271.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">280</text><path d="M90 217.5L720 217.5" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="221.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">320</text><path d="M90 167.5L720 167.5" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="171.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">360</text><path d="M90 117.5L720 117.5" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="121.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">400</text><text x="90" y="72" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Atmospheric CO₂ (parts per million)</text><path d="M90 261.2C102 260.6 138 259.4 162 257.5C186 255.6 210 252.5 234 250C258 247.5 282 245.2 306 242.5C330 239.8 354 236 378 233.8C402 231.5 432 230.8 450 228.8C468 226.7 474 224.4 486 221.2C498 218.1 510 214.6 522 210C534 205.4 546 199.6 558 193.8C570 187.9 582 181.2 594 175C606 168.8 618 163.8 630 156.2C642 148.8 654 139.4 666 130C678 120.6 693.6 107.1 702 100C710.4 92.9 714 89.6 716.4 87.5" fill="none" stroke="#246b8e" stroke-width="3" stroke-linejoin="round"/><text x="712.4" y="77.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end" font-weight="bold">≈424 ppm (2024)</text><text x="94" y="251.2" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">≈285 ppm</text><path d="M90 505L720 505" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="509" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">-0.4</text><path d="M90 475.9L720 475.9" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="479.9" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">0</text><path d="M90 446.8L720 446.8" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="450.8" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">+0.4</text><path d="M90 417.7L720 417.7" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="421.7" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">+0.8</text><path d="M90 388.6L720 388.6" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="392.6" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">+1.2</text><path d="M90 359.5L720 359.5" fill="none" stroke="#eceff1" stroke-width="1"/><text x="82" y="363.5" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end">+1.6</text><path d="M90 366.8L720 366.8" fill="none" stroke="#a8383b" stroke-width="1.2" stroke-dasharray="6 4"/><text x="250" y="361.8" font-family="Arial" font-size="11" fill="#a8383b">1.5 °C (Paris Agreement target limit)</text><text x="90" y="331" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Global temperature compared with 1850–1900 (°C)</text><path d="M90 475.9C102 475.9 138 475.3 162 475.9C186 476.5 210 478.3 234 479.5C258 480.8 282 485 306 483.2C330 481.4 360 472.5 378 468.6C396 464.8 402 460.5 414 459.9C426 459.3 438 465 450 465C462 465 474 461.1 486 459.9C498 458.7 510 460.2 522 457.7C534 455.3 546 449.4 558 445.4C570 441.4 582 437.7 594 433.7C606 429.7 618 425.8 630 421.4C642 416.9 656.4 412.3 666 406.8C675.6 401.4 681.6 392.6 687.6 388.6C693.6 384.6 697.8 385.8 702 382.8C706.2 379.8 710.4 373.7 712.8 370.5C715.2 367.2 715.8 364.4 716.4 363.2" fill="none" stroke="#a8383b" stroke-width="3" stroke-linejoin="round"/><text x="702.4" y="385.2" font-family="Arial" font-size="12" fill="#173b50" text-anchor="end" font-weight="bold">2024: ≈ +1.55 °C</text><text x="90" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1850</text><text x="180" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1875</text><text x="270" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1900</text><text x="360" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1925</text><text x="450" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1950</text><text x="540" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">1975</text><text x="630" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">2000</text><text x="720" y="522" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">2025</text><path d="M90 505L720 505" fill="none" stroke="#173b50" stroke-width="1.2"/><path d="M90 286L90 306" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="3 3"/><text x="94" y="302" font-family="Arial" font-size="11" fill="#233b4d">coal: Industrial Revolution</text><path d="M450 286L450 306" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="3 3"/><text x="454" y="302" font-family="Arial" font-size="11" fill="#233b4d">oil, gas, cars, farming boom</text><text x="400" y="550" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">Both rise together, and fastest since about 1950 — the link between greenhouse-gas use and warming.</text></svg>
