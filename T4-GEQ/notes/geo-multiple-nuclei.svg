db" stroke="#173b50" stroke-width="1"/><text x="545" y="325" font-family="Arial" font-size="14" fill="#173b50">9  Industrial suburb</text><text x="515" y="355" font-family="Arial" font-size="14" fill="#173b50">The city grows round several</text><text x="515" y="372.5" font-family="Arial" font-size="14" fill="#173b50">separate nuclei (old villages,</text><text x="515" y="390" font-family="Arial" font-size="14" fill="#173b50">a port, a university), not one</text><text x="515" y="407.5" font-family="Arial" font-size="14" fill="#173b50">centre. Similar uses cluster;</text><text x="515" y="425" font-family="Arial" font-size="14" fill="#173b50">unlike uses repel each other.</text><text x="30" y="528" font-family="Arial" font-size="13" fill="#8796a0">Schematic model; the layout of the nuclei differs in every real city.</text></svg>
