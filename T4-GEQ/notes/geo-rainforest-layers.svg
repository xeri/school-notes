<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="800" height="540" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Structure of the tropical rainforest</text><rect x="30" y="70" width="470" height="410" fill="#f3f8ef"/><path d="M60 480L66 480" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="484" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">0 m</text><path d="M60 400L66 400" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="404" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">10 m</text><path d="M60 320L66 320" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="324" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">20 m</text><path d="M60 240L66 240" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="244" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">30 m</text><path d="M60 160L66 160" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="164" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">40 m</text><path d="M60 80L66 80" fill="none" stroke="#173b50" stroke-width="1"/><text x="56" y="84" font-family="Arial" font-size="11" fill="#173b50" text-anchor="end">50 m</text><path d="M66 480L66 64" fill="none" stroke="#173b50" stroke-width="1.2"/><path d="M158 480L176 448L176 480Z" fill="#8a5a3b" stroke-linejoin="round"/><path d="M202 480L184 448L184 480Z" fill="#8a5a3b" stroke-linejoin="round"/><path d="M308 480L326 448L326 480Z" fill="#8a5a3b" stroke-linejoin="round"/><path d="M352 480L334 448L334 480Z" fill="#8a5a3b" stroke-linejoin="round"/><rect x="116" y="370" width="8" height="110" fill="#8a5a3b"/><ellipse cx="120" cy="370" rx="30" ry="18" fill="#7fb069" stroke="#173b50" stroke-width="1"/><rect x="396" y="377" width="8" height="103" fill="#8a5a3b"/><ellipse cx="400" cy="377" rx="28" ry="17" fill="#7fb069" stroke="#173b50" stroke-width="1"/><rect x="256" y="376" width="8" height="104" fill="#8a5a3b"/><ellipse cx="260" cy="376" rx="26" ry="16" fill="#7fb069" stroke="#173b50" stroke-width="1"/><rect x="176" y="257" width="8" height="223" fill="#8a5a3b"/><ellipse cx="180" cy="257" rx="70" ry="25" fill="#3d8b4f" stroke="#173b50" stroke-width="1"/><rect x="326" y="265" width="8" height="215" fill="#8a5a3b"/><ellipse cx="330" cy="265" rx="75" ry="25" fill="#3d8b4f" stroke="#173b50" stroke-width="1"/><rect x="446" y="271" width="8" height="209" fill="#8a5a3b"/><ellipse cx="450" cy="271" rx="45" ry="23" fill="#3d8b4f" stroke="#173b50" stroke-width="1"/><rect x="246" y="138" width="8" height="342" fill="#8a5a3b"/><ellipse cx="250" cy="138" rx="40" ry="18" fill="#2a6b3c" stroke="#173b50" stroke-width="1"/><ellipse cx="95" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><ellipse cx="150" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><ellipse cx="215" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><ellipse cx="300" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><ellipse cx="370" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><ellipse cx="470" cy="464" rx="18" ry="14" fill="#a6c98f" stroke="#173b50" stroke-width="0.8"/><rect x="30" y="480" width="470" height="10" fill="#b58b62"/><path d="M330 248Q350 336 338 416Q330 456 345 480" fill="none" stroke="#5a7d2a" stroke-width="2" stroke-linejoin="round"/><path d="M516 90.5L490 120" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="490" cy="120" r="2.5" fill="#233b4d"/><text x="520" y="95" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Emergents (up to ~50 m)</text><text x="520" y="111" font-family="Arial" font-size="12" fill="#173b50">tallest trees poke above the canopy;</text><text x="520" y="126" font-family="Arial" font-size="12" fill="#173b50">full sun, wind; small leaves</text><path d="M516 172.4L490 232" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="490" cy="232" r="2.5" fill="#233b4d"/><text x="520" y="177" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Canopy (~30 m)</text><text x="520" y="193" font-family="Arial" font-size="12" fill="#173b50">continuous roof of crowns; most</text><text x="520" y="208" font-family="Arial" font-size="12" fill="#173b50">animals live here; catches most light</text><path d="M516 254.4L490 360" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="490" cy="360" r="2.5" fill="#233b4d"/><text x="520" y="259" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Under-canopy (~15 m)</text><text x="520" y="275" font-family="Arial" font-size="12" fill="#173b50">young trees, lianas climb to the</text><text x="520" y="290" font-family="Arial" font-size="12" fill="#173b50">light; large leaves</text><path d="M516 336.4L490 456" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="490" cy="456" r="2.5" fill="#233b4d"/><text x="520" y="341" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Shrub layer (~5 m)</text><text x="520" y="357" font-family="Arial" font-size="12" fill="#173b50">shade-tolerant shrubs and ferns;</text><text x="520" y="372" font-family="Arial" font-size="12" fill="#173b50">very little light</text><path d="M516 418.4L480 484" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="480" cy="484" r="2.5" fill="#233b4d"/><text x="520" y="423" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Forest floor</text><text x="520" y="439" font-family="Arial" font-size="12" fill="#173b50">dark (≈2% of light), humid; leaf</text><text x="520" y="454" font-family="Arial" font-size="12" fill="#173b50">litter decomposes in weeks</text><path d="M196 515.8L196 472" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="196" cy="472" r="2.5" fill="#233b4d"/><text x="200" y="520" font-family="Arial" font-size="12" fill="#173b50">Buttress roots support tall trees in shallow soil</text><path d="M356 495.8L340 384" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="340" cy="384" r="2.5" fill="#233b4d"/><text x="360" y="500" font-family="Arial" font-size="12" fill="#173b50">Liana (woody vine)</text></svg>
