<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The carbon cycle — natural flows (green/blue) and human flows (red)</text><rect x="270" y="67" width="260" height="56" rx="8" fill="#dcebf5" stroke="#173b50" stroke-width="1.5"/><text x="400" y="91" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">ATMOSPHERE</text><text x="400" y="109" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">carbon dioxide, methane</text><rect x="30" y="242" width="220" height="56" rx="8" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><text x="140" y="266" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">BIOSPHERE</text><text x="140" y="284" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">plants and animals</text><rect x="550" y="242" width="220" height="56" rx="8" fill="#d6e8f6" stroke="#173b50" stroke-width="1.5"/><text x="660" y="266" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">OCEANS</text><text x="660" y="284" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">dissolved CO₂, marine life</text><rect x="30" y="412" width="220" height="56" rx="8" fill="#efe1d1" stroke="#173b50" stroke-width="1.5"/><text x="140" y="436" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">SOIL</text><text x="140" y="454" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">dead organic matter</text><rect x="420" y="412" width="280" height="56" rx="8" fill="#cfd6db" stroke="#173b50" stroke-width="1.5"/><text x="560" y="436" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">LITHOSPHERE</text><text x="560" y="454" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">fossil fuels (coal, oil, gas), limestone</text><path d="M300 120L165.8 235" fill="none" stroke="#24775c" stroke-width="3"/><path d="M160 240L164.7 230.1L170.5 236.9Z" fill="#24775c" stroke-linejoin="round"/><text x="205" y="165" font-family="Arial" font-size="13" fill="#24775c" text-anchor="end" font-weight="bold">photosynthesis</text><path d="M200 240L314.4 130.3" fill="none" stroke="#24775c" stroke-width="3"/><path d="M320 125L315.9 135.2L309.6 128.7Z" fill="#24775c" stroke-linejoin="round"/><text x="250" y="205" font-family="Arial" font-size="13" fill="#24775c" font-weight="bold">respiration</text><path d="M500 120L634.2 235" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M640 240L629.5 236.9L635.3 230.1Z" fill="#246b8e" stroke-linejoin="round"/><path d="M610 240L475.9 129.9" fill="none" stroke="#246b8e" stroke-width="3"/><path d="M470 125L480.6 127.9L474.9 134.8Z" fill="#246b8e" stroke-linejoin="round"/><text x="600" y="165" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">ocean absorbs</text><text x="470" y="205" font-family="Arial" font-size="13" fill="#246b8e" font-weight="bold">and releases</text><path d="M120 300L120 402.3" fill="none" stroke="#24775c" stroke-width="3"/><path d="M120 410L115.5 400L124.5 400Z" fill="#24775c" stroke-linejoin="round"/><text x="50" y="360" font-family="Arial" font-size="13" fill="#24775c" font-weight="bold">death,</text><text x="50" y="376" font-family="Arial" font-size="13" fill="#24775c" font-weight="bold">waste</text><path d="M200 410L346.7 131.2" fill="none" stroke="#24775c" stroke-width="2.5"/><path d="M350 125L349.4 135L342.1 131.2Z" fill="#24775c" stroke-linejoin="round"/><text x="232" y="330" font-family="Arial" font-size="13" fill="#24775c" font-weight="bold">decomposition</text><path d="M250 440L408 440" fill="none" stroke="#8a5a3b" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M415 440L405.9 444.1L405.9 435.9Z" fill="#8a5a3b" stroke-linejoin="round"/><text x="332" y="468" font-family="Arial" font-size="12" fill="#8a5a3b" text-anchor="middle">burial over millions</text><text x="332" y="482" font-family="Arial" font-size="12" fill="#8a5a3b" text-anchor="middle">of years</text><path d="M480 410L422.2 135.3" fill="none" stroke="#a8383b" stroke-width="6"/><path d="M420 125L428.8 137.1L416.8 139.7Z" fill="#a8383b" stroke-linejoin="round"/><text x="474" y="330" font-family="Arial" font-size="13" fill="#a8383b" font-weight="bold">burning fossil</text><text x="474" y="346" font-family="Arial" font-size="13" fill="#a8383b" font-weight="bold">fuels, cement</text><path d="M60 242L60 95L262 95" fill="none" stroke="#a8383b" stroke-width="4" stroke-linejoin="round"/><path d="M272 95L260.1 100.3L260.1 89.7Z" fill="#a8383b" stroke-linejoin="round"/><text x="68" y="120" font-family="Arial" font-size="13" fill="#a8383b" font-weight="bold">deforestation,</text><text x="68" y="136" font-family="Arial" font-size="13" fill="#a8383b" font-weight="bold">burning forests</text><text x="400" y="510" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">Fossil carbon locked away for millions of years is released in decades: the atmospheric store grows and the oceans acidify.</text></svg>
