<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><rect width="800" height="480" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Von Thünen’s model of agricultural land use (1826)</text><circle cx="225" cy="265" r="195" fill="#efe1d1" stroke="#173b50" stroke-width="1.3"/><circle cx="225" cy="265" r="160" fill="#efc08f" stroke="#173b50" stroke-width="1.3"/><circle cx="225" cy="265" r="120" fill="#b5d6a3" stroke="#173b50" stroke-width="1.3"/><circle cx="225" cy="265" r="80" fill="#f8f0c6" stroke="#173b50" stroke-width="1.3"/><circle cx="225" cy="265" r="42" fill="#e3a3a0" stroke="#173b50" stroke-width="1.3"/><circle cx="225" cy="265" r="12" fill="#173b50"/><text x="402.5" y="271" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">5</text><text x="365" y="271" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">4</text><text x="325" y="271" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">3</text><text x="286" y="271" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">2</text><text x="252" y="271" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">1</text><text x="225" y="245" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Market</text><rect x="450" y="75" width="20" height="20" fill="#e3a3a0" stroke="#173b50" stroke-width="1"/><text x="480" y="90" font-family="Arial" font-size="13" fill="#173b50">1 Market gardening and dairying</text><text x="480" y="105.6" font-family="Arial" font-size="13" fill="#173b50">(perishable, intensive)</text><rect x="450" y="120.6" width="20" height="20" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="480" y="135.6" font-family="Arial" font-size="13" fill="#173b50">2 Forestry (wood heavy, bulky:</text><text x="480" y="151.2" font-family="Arial" font-size="13" fill="#173b50">fuel and building)</text><rect x="450" y="166.2" width="20" height="20" fill="#b5d6a3" stroke="#173b50" stroke-width="1"/><text x="480" y="181.2" font-family="Arial" font-size="13" fill="#173b50">3 Arable: grain and field crops</text><rect x="450" y="200.2" width="20" height="20" fill="#efc08f" stroke="#173b50" stroke-width="1"/><text x="480" y="215.2" font-family="Arial" font-size="13" fill="#173b50">4 Livestock ranching</text><text x="480" y="230.8" font-family="Arial" font-size="13" fill="#173b50">(animals walk to market)</text><rect x="450" y="245.8" width="20" height="20" fill="#efe1d1" stroke="#173b50" stroke-width="1"/><text x="480" y="260.8" font-family="Arial" font-size="13" fill="#173b50">5 Wilderness: too far to farm</text><text x="480" y="276.4" font-family="Arial" font-size="13" fill="#173b50">at a profit</text><text x="450" y="300" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Idea: land nearer the market is worth more,</text><text x="450" y="316" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">so it is farmed more intensively; transport</text><text x="450" y="332" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">cost rises with distance.</text><text x="450" y="358" font-family="Arial" font-size="12" fill="#173b50">Assumptions: one isolated market (city);</text><text x="450" y="373" font-family="Arial" font-size="12" fill="#173b50">flat, uniform plain; same soil and climate;</text><text x="450" y="388" font-family="Arial" font-size="12" fill="#173b50">farmers carry their own produce; transport</text><text x="450" y="403" font-family="Arial" font-size="12" fill="#173b50">cost proportional to distance; farmers</text><text x="450" y="418" font-family="Arial" font-size="12" fill="#173b50">maximise profit.</text><text x="30" y="472" font-family="Arial" font-size="12" fill="#233b4d">Rings are distorted in reality by rivers and roads (cheaper transport), relief, soils, refrigeration and government policy.</text></svg>
