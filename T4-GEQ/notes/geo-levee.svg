<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Formation of levées and the flood plain</text><rect x="20" y="160" width="370" height="40" fill="#8cc3e6"/><path d="M20 200L170 200L180 250L230 250L240 200L390 200L390 290L20 290Z" fill="#e8e0cc" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><rect x="180" y="200" width="50" height="50" fill="#8cc3e6"/><circle cx="108.5" cy="195" r="1.2" fill="#8a5a3b"/><circle cx="301.5" cy="195" r="1.2" fill="#8a5a3b"/><circle cx="112.5" cy="189" r="1.2" fill="#8a5a3b"/><circle cx="297.5" cy="189" r="1.2" fill="#8a5a3b"/><circle cx="116.5" cy="183" r="1.4" fill="#8a5a3b"/><circle cx="293.5" cy="183" r="1.4" fill="#8a5a3b"/><circle cx="129.5" cy="177" r="1.7" fill="#8a5a3b"/><circle cx="280.5" cy="177" r="1.7" fill="#8a5a3b"/><circle cx="133.5" cy="195" r="2.1" fill="#8a5a3b"/><circle cx="276.5" cy="195" r="2.1" fill="#8a5a3b"/><circle cx="137.5" cy="189" r="2.4" fill="#8a5a3b"/><circle cx="272.5" cy="189" r="2.4" fill="#8a5a3b"/><circle cx="150.5" cy="183" r="2.8" fill="#8a5a3b"/><circle cx="259.5" cy="183" r="2.8" fill="#8a5a3b"/><circle cx="154.5" cy="177" r="3.1" fill="#8a5a3b"/><circle cx="255.5" cy="177" r="3.1" fill="#8a5a3b"/><circle cx="158.5" cy="195" r="3.5" fill="#8a5a3b"/><circle cx="251.5" cy="195" r="3.5" fill="#8a5a3b"/><circle cx="171.5" cy="189" r="3.8" fill="#8a5a3b"/><circle cx="238.5" cy="189" r="3.8" fill="#8a5a3b"/><circle cx="168.5" cy="183" r="3.8" fill="#8a5a3b"/><circle cx="241.5" cy="183" r="3.8" fill="#8a5a3b"/><circle cx="158.5" cy="177" r="3.5" fill="#8a5a3b"/><circle cx="251.5" cy="177" r="3.5" fill="#8a5a3b"/><circle cx="157.5" cy="195" r="3.1" fill="#8a5a3b"/><circle cx="252.5" cy="195" r="3.1" fill="#8a5a3b"/><circle cx="147.5" cy="189" r="2.8" fill="#8a5a3b"/><circle cx="262.5" cy="189" r="2.8" fill="#8a5a3b"/><circle cx="137.5" cy="183" r="2.4" fill="#8a5a3b"/><circle cx="272.5" cy="183" r="2.4" fill="#8a5a3b"/><circle cx="136.5" cy="177" r="2.1" fill="#8a5a3b"/><circle cx="273.5" cy="177" r="2.1" fill="#8a5a3b"/><circle cx="126.5" cy="195" r="1.7" fill="#8a5a3b"/><circle cx="283.5" cy="195" r="1.7" fill="#8a5a3b"/><circle cx="116.5" cy="189" r="1.4" fill="#8a5a3b"/><circle cx="293.5" cy="189" r="1.4" fill="#8a5a3b"/><circle cx="115.5" cy="183" r="1.2" fill="#8a5a3b"/><circle cx="294.5" cy="183" r="1.2" fill="#8a5a3b"/><circle cx="105.5" cy="177" r="1.2" fill="#8a5a3b"/><circle cx="304.5" cy="177" r="1.2" fill="#8a5a3b"/><path d="M205 175L314.4 175" fill="none" stroke="#246b8e" stroke-width="2"/><path d="M320 175L312.7 178.3L312.7 171.7Z" fill="#246b8e" stroke-linejoin="round"/><path d="M205 175L95.6 175" fill="none" stroke="#246b8e" stroke-width="2"/><path d="M90 175L97.3 171.7L97.3 178.3Z" fill="#246b8e" stroke-linejoin="round"/><text x="20" y="315" font-family="Arial" font-size="13" fill="#173b50">1  In a flood the river spills over its banks. Out</text><text x="20" y="331.2" font-family="Arial" font-size="13" fill="#173b50">of the channel the water spreads, becomes shallower,</text><text x="20" y="347.5" font-family="Arial" font-size="13" fill="#173b50">meets friction and slows, so it drops its load: the</text><text x="20" y="363.8" font-family="Arial" font-size="13" fill="#173b50">coarsest, heaviest sediment first (right next to the</text><text x="20" y="380" font-family="Arial" font-size="13" fill="#173b50">channel), finer silt and clay further away.</text><path d="M410 200L540 195L560 172L570 172L575 230L615 230L620 172L630 172L650 195L780 200L780 290L410 290Z" fill="#e8e0cc" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><rect x="575" y="190" width="40" height="40" fill="#8cc3e6"/><path d="M415 212L570 212" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M620 212L775 212" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M415 224L570 224" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M620 224L775 224" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M415 236L570 236" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M620 236L775 236" fill="none" stroke="#b5a77f" stroke-width="1" stroke-dasharray="5 4"/><path d="M636 115.8L626 174" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="626" cy="174" r="2.5" fill="#233b4d"/><text x="640" y="120" font-family="Arial" font-size="12" fill="#173b50">Levée: natural raised bank</text><text x="640" y="135" font-family="Arial" font-size="12" fill="#173b50">of coarse sediment</text><path d="M480 154L480 198" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="480" cy="198" r="2.5" fill="#233b4d"/><text x="420" y="150" font-family="Arial" font-size="12" fill="#173b50">Flood plain: flat layers of</text><text x="420" y="165" font-family="Arial" font-size="12" fill="#173b50">fine alluvium</text><path d="M710 246L710 224" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="710" cy="224" r="2.5" fill="#233b4d"/><text x="640" y="260" font-family="Arial" font-size="12" fill="#173b50">Layers from many floods</text><text x="410" y="315" font-family="Arial" font-size="13" fill="#173b50">2  Repeated floods build the levées up and spread</text><text x="410" y="331.2" font-family="Arial" font-size="13" fill="#173b50">layers of alluvium across the valley floor. Meanders</text><text x="410" y="347.5" font-family="Arial" font-size="13" fill="#173b50">migrating across the valley widen the flood plain.</text><text x="410" y="363.8" font-family="Arial" font-size="13" fill="#173b50">The river bed can end up above the flood plain.</text></svg>
