<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><rect width="800" height="470" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Glacial trough (U-shaped valley) — cross-section</text><path d="M40 90L90 110L130 130L150 200L165 300L190 360L250 375L450 375L510 360L530 320L545 230L548 190L575 170L590 178L625 178L640 170L690 140L760 120L760 440L40 440Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M40 90L60 70L90 110Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M150 140L300 360L320 360L520 160" fill="none" stroke="#a8383b" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round"/><path d="M235 375L465 375Q350 395 235 375Z" fill="#a9cde6" stroke="#246b8e" stroke-width="1.2" stroke-linejoin="round"/><circle cx="350" cy="377" r="4" fill="#246b8e"/><path d="M552 192Q548 260 535 330" fill="none" stroke="#246b8e" stroke-width="3" stroke-linejoin="round"/><path d="M480 134L480 200" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="480" cy="200" r="2.5" fill="#233b4d"/><text x="330" y="130" font-family="Arial" font-size="13" fill="#173b50">Former V-shaped river valley (dashed)</text><path d="M60 64L60 72" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="60" cy="72" r="2.5" fill="#233b4d"/><text x="50" y="60" font-family="Arial" font-size="13" fill="#173b50">Arête / pyramidal peak</text><path d="M606 225.4L545 230" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="545" cy="230" r="2.5" fill="#233b4d"/><text x="610" y="230" font-family="Arial" font-size="13" fill="#173b50">Waterfall</text><path d="M606 145.4L607 176" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="607" cy="176" r="2.5" fill="#233b4d"/><text x="610" y="150" font-family="Arial" font-size="13" fill="#173b50">Hanging valley</text><text x="610" y="168" font-family="Arial" font-size="13" fill="#173b50"></text><path d="M556 285.4L524 330" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="524" cy="330" r="2.5" fill="#233b4d"/><text x="560" y="290" font-family="Arial" font-size="13" fill="#173b50">Steep, straight sides</text><path d="M300 405L300 383" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="300" cy="383" r="2.5" fill="#233b4d"/><text x="180" y="420" font-family="Arial" font-size="13" fill="#173b50">Ribbon (finger) lake in an over-deepened rock basin</text><path d="M466 400.4L352 378" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="352" cy="378" r="2.5" fill="#233b4d"/><text x="470" y="405" font-family="Arial" font-size="13" fill="#173b50">Misfit stream</text><text x="350" y="330" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Wide, flat floor</text><text x="350" y="200" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">U-shaped trough</text><text x="350" y="220" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">(ice filled the valley and eroded</text><text x="350" y="236" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">its floor and sides)</text><text x="30" y="465" font-family="Arial" font-size="13" fill="#233b4d">Truncated spurs: the ends of interlocking spurs are planed off, leaving steep cliffs along the valley sides.</text></svg>
