<svg xmlns="http://www.w3.org/2000/svg" width="800" height="495" viewBox="0 0 800 495"><rect width="800" height="495" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Winds around lows and highs in the Southern Hemisphere</text><circle cx="200" cy="240" r="150" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="310.5" y="131.5" font-family="Arial" font-size="11" fill="#233b4d">1000</text><circle cx="200" cy="240" r="105" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="278.6" y="163.4" font-family="Arial" font-size="11" fill="#233b4d">996</text><circle cx="200" cy="240" r="60" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="246.6" y="195.4" font-family="Arial" font-size="11" fill="#233b4d">992</text><text x="200" y="250" font-family="Arial" font-size="30" fill="#a8383b" text-anchor="middle" font-weight="bold">L</text><path d="M333.5 225L324.7 249.1" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M322.5 255L321.9 246.1L328.8 248.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M305 323.7L281.7 334.6" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M276 337.3L281.9 330.5L285 337.1Z" fill="#233b4d" stroke-linejoin="round"/><path d="M215 373.5L190.9 364.7" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M185 362.5L193.9 361.9L191.4 368.8Z" fill="#233b4d" stroke-linejoin="round"/><path d="M116.3 345L105.4 321.7" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M102.7 316L109.5 321.9L102.9 325Z" fill="#233b4d" stroke-linejoin="round"/><path d="M66.5 255L75.3 230.9" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M77.5 225L78.1 233.9L71.2 231.4Z" fill="#233b4d" stroke-linejoin="round"/><path d="M95 156.3L118.3 145.4" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M124 142.7L118.1 149.5L115 142.9Z" fill="#233b4d" stroke-linejoin="round"/><path d="M185 106.5L209.1 115.3" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M215 117.5L206.1 118.1L208.6 111.2Z" fill="#233b4d" stroke-linejoin="round"/><path d="M283.7 135L294.6 158.3" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M297.3 164L290.5 158.1L297.1 155Z" fill="#233b4d" stroke-linejoin="round"/><text x="200" y="60" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">Depression (low)</text><text x="200" y="418" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Air spirals clockwise and inwards,</text><text x="200" y="434" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">then rises: cloud and rain.</text><text x="200" y="450" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Isobars close together: strong wind</text><circle cx="600" cy="240" r="150" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="710.5" y="131.5" font-family="Arial" font-size="11" fill="#233b4d">1020</text><circle cx="600" cy="240" r="105" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="678.5" y="163.4" font-family="Arial" font-size="11" fill="#233b4d">1024</text><circle cx="600" cy="240" r="60" fill="none" stroke="#8796a0" stroke-width="1.5"/><text x="646.6" y="195.4" font-family="Arial" font-size="11" fill="#233b4d">1028</text><text x="600" y="250" font-family="Arial" font-size="30" fill="#246b8e" text-anchor="middle" font-weight="bold">H</text><path d="M722.5 255L731.3 230.9" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M733.5 225L734.1 233.9L727.2 231.4Z" fill="#233b4d" stroke-linejoin="round"/><path d="M676 337.3L699.3 326.4" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M705 323.7L699.1 330.5L696 323.9Z" fill="#233b4d" stroke-linejoin="round"/><path d="M585 362.5L609.1 371.3" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M615 373.5L606.1 374.1L608.6 367.2Z" fill="#233b4d" stroke-linejoin="round"/><path d="M502.7 316L513.6 339.3" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M516.3 345L509.5 339.1L516.1 336Z" fill="#233b4d" stroke-linejoin="round"/><path d="M477.5 225L468.7 249.1" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M466.5 255L465.9 246.1L472.8 248.6Z" fill="#233b4d" stroke-linejoin="round"/><path d="M524 142.7L500.7 153.6" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M495 156.3L500.9 149.5L504 156.1Z" fill="#233b4d" stroke-linejoin="round"/><path d="M615 117.5L590.9 108.7" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M585 106.5L593.9 105.9L591.4 112.8Z" fill="#233b4d" stroke-linejoin="round"/><path d="M697.3 164L686.4 140.7" fill="none" stroke="#233b4d" stroke-width="2.2"/><path d="M683.7 135L690.5 140.9L683.9 144Z" fill="#233b4d" stroke-linejoin="round"/><text x="600" y="60" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle" font-weight="bold">Anticyclone (high)</text><text x="600" y="418" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Air sinks, then spirals anticlockwise</text><text x="600" y="434" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">and outwards: clear, settled weather.</text><text x="600" y="450" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Isobars far apart: light wind</text><text x="400" y="486" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">Northern Hemisphere: the directions are reversed. Wind blows almost along the isobars, slightly towards low pressure.</text></svg>
