e="13" fill="#a8383b" font-weight="bold">Decline</text><path d="M164 80L164 400" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="4 4"/><path d="M248 80L248 400" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="4 4"/><path d="M388 80L388 400" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="4 4"/><path d="M444 80L444 400" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="4 4"/><path d="M500 80L500 400" fill="none" stroke="#8796a0" stroke-width="1" stroke-dasharray="4 4"/><text x="122" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Exploration</text><text x="206" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Involve-</text><text x="206" y="432" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">ment</text><text x="318" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Development</text><text x="416" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Consoli-</text><text x="416" y="432" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">dation</text><text x="472" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Stag-</text><text x="472" y="432" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">nation</text><text x="570" y="418" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">Decline or</text><text x="570" y="432" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">rejuvenation</text><text x="80" y="470" font-family="Arial" font-size="12" fill="#233b4d">1 few adventurous visitors; no facilities</text><text x="80" y="485" font-family="Arial" font-size="12" fill="#233b4d">2 locals provide simple services</text><text x="80" y="500" font-family="Arial" font-size="12" fill="#233b4d">3 rapid growth; outside firms, hotels, marketing</text><text x="410" y="470" font-family="Arial" font-size="12" fill="#233b4d">4 growth slows; tourism dominates economy</text><text x="410" y="485" font-family="Arial" font-size="12" fill="#233b4d">5 capacity reached; problems, image fades</text><text x="410" y="500" font-family="Arial" font-size="12" fill="#233b4d">6 decline, or new attractions and investment</text></svg>
