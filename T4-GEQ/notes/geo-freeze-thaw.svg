<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380"><rect width="800" height="380" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Freeze–thaw weathering (frost shattering)</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">Needs water in cracks and temperatures that swing above and below 0 °C</text><rect x="30" y="90" width="170" height="150" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M109 90L121 90L115 160Z" fill="white" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M111.1 114.5L118.9 114.5L115 160Z" fill="#a9cde6" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><path d="M95 60L101 76" fill="none" stroke="#246b8e" stroke-width="2"/><path d="M115 60L121 76" fill="none" stroke="#246b8e" stroke-width="2"/><path d="M135 60L141 76" fill="none" stroke="#246b8e" stroke-width="2"/><text x="28" y="285" font-family="Arial" font-size="13" fill="#173b50">1  Water enters a crack</text><text x="28" y="301.2" font-family="Arial" font-size="13" fill="#173b50">(rain or snowmelt)</text><rect x="225" y="90" width="170" height="150" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M300 90L320 90L310 170Z" fill="white" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M303.5 118L316.5 118L310 170Z" fill="#e6f4fb" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><path d="M306 125L282.3 125" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M276 125L284.2 121.3L284.2 128.7Z" fill="#a8383b" stroke-linejoin="round"/><path d="M314 125L337.7 125" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M344 125L335.8 128.7L335.8 121.3Z" fill="#a8383b" stroke-linejoin="round"/><text x="310" y="82" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="middle" font-weight="bold">ice</text><text x="223" y="285" font-family="Arial" font-size="13" fill="#173b50">2  At night it freezes and</text><text x="223" y="301.2" font-family="Arial" font-size="13" fill="#173b50">expands by about 9%,</text><text x="223" y="317.5" font-family="Arial" font-size="13" fill="#173b50">pushing on the crack walls</text><rect x="420" y="90" width="170" height="150" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M489 90L521 90L505 195Z" fill="white" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M494.6 126.8L515.4 126.8L505 195Z" fill="#a9cde6" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><text x="418" y="285" font-family="Arial" font-size="13" fill="#173b50">3  By day the ice thaws;</text><text x="418" y="301.2" font-family="Arial" font-size="13" fill="#173b50">the crack is wider and</text><text x="418" y="317.5" font-family="Arial" font-size="13" fill="#173b50">more water enters</text><rect x="615" y="90" width="170" height="150" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><rect x="615" y="90" width="170" height="150" fill="white"/><path d="M615 90L686 90L696 240L615 240Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M714 90L785 90L785 240L704 240Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M686 150L694 142L702 152L696 158Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M697 200L706 191L715 202L708 209Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M725 240L755 222L795 240Z" fill="#cfd6db" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="755" y="256" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">scree</text><text x="613" y="285" font-family="Arial" font-size="13" fill="#173b50">4  Repeated cycles split</text><text x="613" y="301.2" font-family="Arial" font-size="13" fill="#173b50">the rock; angular</text><text x="613" y="317.5" font-family="Arial" font-size="13" fill="#173b50">fragments fall and pile up</text><text x="613" y="333.8" font-family="Arial" font-size="13" fill="#173b50">as scree</text></svg>
