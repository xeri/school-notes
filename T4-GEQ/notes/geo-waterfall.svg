<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Formation of a waterfall and gorge</text><path d="M20 165L160 165L160 250L260 250L260 300L20 300Z" fill="#e7d6b8" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M20 120L160 120L160 165L20 165Z" fill="#8f8a83" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M162 250Q177.0 286 192 250Z" fill="#8cc3e6" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><path d="M20 117L160 117" fill="none" stroke="#246b8e" stroke-width="4"/><path d="M160 117Q180 140 178 250" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><path d="M190 247L260 247" fill="none" stroke="#246b8e" stroke-width="4"/><text x="90" y="147" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Hard rock</text><text x="90" y="215" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">Soft rock</text><path d="M177 271L177 262" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="177" cy="262" r="2.5" fill="#233b4d"/><text x="170" y="285" font-family="Arial" font-size="12" fill="#173b50">Plunge pool</text><text x="20" y="325" font-family="Arial" font-size="13" fill="#173b50">1  Water flows over a band of</text><text x="20" y="341.2" font-family="Arial" font-size="13" fill="#173b50">resistant (hard) rock lying on top</text><text x="20" y="357.5" font-family="Arial" font-size="13" fill="#173b50">of less resistant (soft) rock</text><path d="M280 165L398 165L398 250L520 250L520 300L280 300Z" fill="#e7d6b8" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M280 120L420 120L420 165L280 165Z" fill="#8f8a83" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M400 250Q427.5 314 455 250Z" fill="#8cc3e6" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><path d="M280 117L420 117" fill="none" stroke="#246b8e" stroke-width="4"/><path d="M420 117Q440 140 438 250" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><path d="M453 247L520 247" fill="none" stroke="#246b8e" stroke-width="4"/><path d="M436 90.8L415 125" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="415" cy="125" r="2.5" fill="#233b4d"/><text x="440" y="95" font-family="Arial" font-size="12" fill="#173b50">Overhang</text><path d="M366 225.8L400 205" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="400" cy="205" r="2.5" fill="#233b4d"/><text x="290" y="230" font-family="Arial" font-size="12" fill="#173b50">Undercutting</text><path d="M430 268Q408 258 404 236" fill="none" stroke="#a8383b" stroke-width="2" stroke-linejoin="round"/><path d="M404 236L408.5 242.6L402.1 243.8Z" fill="#a8383b" stroke-linejoin="round"/><text x="280" y="325" font-family="Arial" font-size="13" fill="#173b50">2  Hydraulic action and abrasion</text><text x="280" y="341.2" font-family="Arial" font-size="13" fill="#173b50">erode the soft rock faster; it is</text><text x="280" y="357.5" font-family="Arial" font-size="13" fill="#173b50">undercut and a plunge pool is</text><text x="280" y="373.8" font-family="Arial" font-size="13" fill="#173b50">scoured out. The hard rock overhangs</text><path d="M540 165L638 165L638 250L780 250L780 300L540 300Z" fill="#e7d6b8" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M540 120L638 120L638 165L540 165Z" fill="#8f8a83" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M640 250Q670.0 322 700 250Z" fill="#8cc3e6" stroke="#246b8e" stroke-width="1" stroke-linejoin="round"/><path d="M540 117L638 117" fill="none" stroke="#246b8e" stroke-width="4"/><path d="M638 117Q658 140 656 250" fill="none" stroke="#246b8e" stroke-width="4" stroke-linejoin="round"/><path d="M698 247L780 247" fill="none" stroke="#246b8e" stroke-width="4"/><rect x="658" y="262" width="12" height="9" fill="#8f8a83" stroke="#173b50" stroke-width="1"/><rect x="675" y="266" width="12" height="9" fill="#8f8a83" stroke="#173b50" stroke-width="1"/><rect x="668" y="254" width="12" height="9" fill="#8f8a83" stroke="#173b50" stroke-width="1"/><path d="M680 120L680 165" fill="none" stroke="#173b50" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M678 108L646.3 108" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M640 108L648.2 104.3L648.2 111.7Z" fill="#a8383b" stroke-linejoin="round"/><text x="685" y="104" font-family="Arial" font-size="12" fill="#a8383b" font-weight="bold">retreat</text><path d="M686 280.8L668 262" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="668" cy="262" r="2.5" fill="#233b4d"/><text x="690" y="285" font-family="Arial" font-size="12" fill="#173b50">Collapsed rock</text><text x="540" y="325" font-family="Arial" font-size="13" fill="#173b50">3  The unsupported overhang</text><text x="540" y="341.2" font-family="Arial" font-size="13" fill="#173b50">collapses into the plunge pool.</text><text x="540" y="357.5" font-family="Arial" font-size="13" fill="#173b50">Repeated, the waterfall retreats</text><text x="540" y="373.8" font-family="Arial" font-size="13" fill="#173b50">upstream, leaving a steep-sided</text><text x="540" y="390" font-family="Arial" font-size="13" fill="#173b50">gorge</text></svg>
