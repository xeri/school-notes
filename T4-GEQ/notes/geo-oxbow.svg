<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380"><rect width="800" height="380" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Formation of an ox-bow lake</text><rect x="15" y="70" width="185" height="200" fill="#dfe8d4"/><path d="M15 100L77 100C7 150 35 245 107 245C180 245 213 150 143 100L200 100" fill="none" stroke="#8cc3e6" stroke-width="14" stroke-linejoin="round"/><path d="M55 150L70 142.5" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M75 140L69.9 146.2L67 140.3Z" fill="#a8383b" stroke-linejoin="round"/><path d="M165 150L150 142.5" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M145 140L153 140.3L150.1 146.2Z" fill="#a8383b" stroke-linejoin="round"/><text x="15" y="292" font-family="Arial" font-size="13" fill="#173b50">1  Erosion on the outer</text><text x="15" y="308.2" font-family="Arial" font-size="13" fill="#173b50">bends moves them towards</text><text x="15" y="324.5" font-family="Arial" font-size="13" fill="#173b50">each other</text><rect x="210" y="70" width="185" height="200" fill="#dfe8d4"/><path d="M210 100L292 100C222 150 230 245 302 245C375 245 388 150 318 100L395 100" fill="none" stroke="#8cc3e6" stroke-width="14" stroke-linejoin="round"/><text x="210" y="292" font-family="Arial" font-size="13" fill="#173b50">2  The neck of the meander</text><text x="210" y="308.2" font-family="Arial" font-size="13" fill="#173b50">narrows</text><rect x="405" y="70" width="185" height="200" fill="#dfe8d4"/><path d="M405 100L487 100C417 150 425 245 497 245C570 245 583 150 513 100L590 100" fill="none" stroke="#8cc3e6" stroke-width="14" stroke-linejoin="round"/><path d="M405 100L590 100" fill="none" stroke="#8cc3e6" stroke-width="14"/><path d="M425 82L559.4 82" fill="none" stroke="#246b8e" stroke-width="2.2"/><path d="M565 82L557.7 85.3L557.7 78.7Z" fill="#246b8e" stroke-linejoin="round"/><text x="497" y="78" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="middle">flood breaks through</text><text x="405" y="292" font-family="Arial" font-size="13" fill="#173b50">3  In a flood the river cuts</text><text x="405" y="308.2" font-family="Arial" font-size="13" fill="#173b50">through the neck — the</text><text x="405" y="324.5" font-family="Arial" font-size="13" fill="#173b50">shortest, steepest route</text><rect x="600" y="70" width="185" height="200" fill="#dfe8d4"/><path d="M600 100L785 100" fill="none" stroke="#8cc3e6" stroke-width="14"/><path d="M672 122C600 170 620 245 692 245C765 245 785 170 712 122" fill="none" stroke="#8cc3e6" stroke-width="14" stroke-linejoin="round"/><rect x="662" y="108" width="18" height="12" fill="#e4cf98" stroke="#173b50" stroke-width="1"/><rect x="706" y="108" width="18" height="12" fill="#e4cf98" stroke="#173b50" stroke-width="1"/><text x="692" y="200" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">ox-bow</text><text x="692" y="214" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle" font-weight="bold">lake</text><path d="M726 81.2L715 112" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="715" cy="112" r="2.5" fill="#233b4d"/><text x="730" y="85" font-family="Arial" font-size="11" fill="#173b50">deposition</text><text x="600" y="292" font-family="Arial" font-size="13" fill="#173b50">4  Deposition seals off the</text><text x="600" y="308.2" font-family="Arial" font-size="13" fill="#173b50">old loop: an ox-bow lake,</text><text x="600" y="324.5" font-family="Arial" font-size="13" fill="#173b50">which later silts up to a</text><text x="600" y="340.8" font-family="Arial" font-size="13" fill="#173b50">meander scar</text></svg>
