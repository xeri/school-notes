<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Earthquake: focus, epicentre and seismic waves</text><rect x="40" y="130" width="470" height="270" fill="#c9a27a" stroke="#173b50" stroke-width="1"/><path d="M330 130L240 400" fill="none" stroke="#a8383b" stroke-width="3"/><circle cx="270" cy="310" r="45" fill="none" stroke="#246b8e" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="270" cy="310" r="90" fill="none" stroke="#246b8e" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="270" cy="310" r="135" fill="none" stroke="#246b8e" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="40" y="70" width="470" height="60" fill="white"/><rect x="30" y="401" width="500" height="30" fill="white"/><path d="M40 400L510 400" fill="none" stroke="#173b50" stroke-width="1"/><path d="M40 130L510 130" fill="none" stroke="#173b50" stroke-width="2"/><rect x="150" y="104" width="26" height="26" fill="#eceff1" stroke="#173b50" stroke-width="1"/><path d="M147 104L163 90L179 104Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="200" y="104" width="26" height="26" fill="#eceff1" stroke="#173b50" stroke-width="1"/><path d="M197 104L213 90L229 104Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="300" y="104" width="26" height="26" fill="#eceff1" stroke="#173b50" stroke-width="1"/><path d="M297 104L313 90L329 104Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="360" y="104" width="26" height="26" fill="#eceff1" stroke="#173b50" stroke-width="1"/><path d="M357 104L373 90L389 104Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="420" y="104" width="26" height="26" fill="#eceff1" stroke="#173b50" stroke-width="1"/><path d="M417 104L433 90L449 104Z" fill="#e3a3a0" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M270 298L272.9 306L281.4 306.3L274.8 311.5L277.1 319.7L270 315L262.9 319.7L265.2 311.5L258.6 306.3L267.1 306Z" fill="#b8901f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><circle cx="270" cy="130" r="6" fill="#a8383b" stroke="#173b50" stroke-width="1"/><path d="M270 136L270 297" fill="none" stroke="#173b50" stroke-width="1.2" stroke-dasharray="4 4"/><text x="80" y="380" font-family="Arial" font-size="13" fill="#173b50">Rock ruptures along the fault</text><path d="M536 122.8L276 130" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="276" cy="130" r="2.5" fill="#233b4d"/><text x="540" y="128" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Epicentre</text><text x="540" y="146" font-family="Arial" font-size="13" fill="#173b50">point on the surface directly</text><text x="540" y="162" font-family="Arial" font-size="13" fill="#173b50">above the focus</text><path d="M536 294.8L282 310" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="282" cy="310" r="2.5" fill="#233b4d"/><text x="540" y="300" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Focus (hypocentre)</text><text x="540" y="318" font-family="Arial" font-size="13" fill="#173b50">point underground where the</text><text x="540" y="334" font-family="Arial" font-size="13" fill="#173b50">rock breaks and energy is released</text><path d="M536 209.8L395 250" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="395" cy="250" r="2.5" fill="#233b4d"/><text x="540" y="215" font-family="Arial" font-size="15" fill="#173b50" font-weight="bold">Seismic waves</text><text x="540" y="233" font-family="Arial" font-size="13" fill="#173b50">spread out from the focus;</text><text x="540" y="249" font-family="Arial" font-size="13" fill="#173b50">shaking weakens with distance</text><text x="540" y="375" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Magnitude = energy released</text><text x="540" y="392" font-family="Arial" font-size="13" fill="#173b50">(Richter / moment magnitude)</text><text x="540" y="409" font-family="Arial" font-size="13" fill="#173b50" font-weight="bold">Intensity = shaking felt (Mercalli)</text></svg>
