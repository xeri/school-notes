<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720"><rect width="800" height="720" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The three types of plate boundary</text><text x="30" y="78" font-family="Arial" font-size="16" fill="#173b50" font-weight="bold">1  Constructive (divergent) boundary — cross-section</text><rect x="40" y="178" width="480" height="80" fill="#f3c69b"/><rect x="40" y="100" width="480" height="70" fill="#bfdcef"/><path d="M40 160L266 152L270 180L40 182Z" fill="#9aa9b4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M294 152L520 160L520 182L290 180Z" fill="#9aa9b4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M262 258Q282 220 270 180L280 138L290 180Q278 220 300 258Z" fill="#d2452f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M230 168L117.7 168" fill="none" stroke="#173b50" stroke-width="3"/><path d="M110 168L120 163.5L120 172.5Z" fill="#173b50" stroke-linejoin="round"/><path d="M330 168L442.3 168" fill="none" stroke="#173b50" stroke-width="3"/><path d="M450 168L440 172.5L440 163.5Z" fill="#173b50" stroke-linejoin="round"/><text x="60" y="148" font-family="Arial" font-size="14" fill="#173b50">Oceanic plate</text><text x="410" y="148" font-family="Arial" font-size="14" fill="#173b50">Oceanic plate</text><path d="M296 117.1L281 140" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="281" cy="140" r="2.5" fill="#233b4d"/><text x="300" y="122" font-family="Arial" font-size="14" fill="#173b50">Mid-ocean ridge</text><text x="50" y="246" font-family="Arial" font-size="14" fill="#173b50">Mantle</text><text x="306" y="232" font-family="Arial" font-size="14" fill="#173b50">Magma rises into the gap</text><text x="548" y="100" font-family="Arial" font-size="14" fill="#173b50">Plates move apart</text><text x="548" y="120" font-family="Arial" font-size="14" fill="#173b50">Magma rises and cools to</text><text x="548" y="140" font-family="Arial" font-size="14" fill="#173b50">form new oceanic crust</text><text x="548" y="160" font-family="Arial" font-size="14" fill="#173b50">Ridge, rift valley, shield</text><text x="548" y="180" font-family="Arial" font-size="14" fill="#173b50">volcanoes, gentle eruptions</text><text x="548" y="200" font-family="Arial" font-size="14" fill="#173b50">Shallow, mild earthquakes</text><text x="548" y="220" font-family="Arial" font-size="14" fill="#173b50">e.g. Mid-Atlantic Ridge, Iceland</text><text x="30" y="298" font-family="Arial" font-size="16" fill="#173b50" font-weight="bold">2  Destructive (convergent) boundary — cross-section</text><rect x="40" y="380" width="480" height="110" fill="#f3c69b"/><rect x="40" y="340" width="222" height="52" fill="#bfdcef"/><path d="M40 392L250 394L330 422L430 474L424 492L324 442L245 414L40 412Z" fill="#9aa9b4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M256 392L300 376L520 376L520 458L436 458L333 417L256 394Z" fill="#c9a27a" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="430" cy="470" rx="24" ry="11" fill="#d2452f"/><path d="M426 462L420 332L428 332L436 462Z" fill="#d2452f" stroke="#173b50" stroke-width="2" stroke-linejoin="round"/><path d="M388 376L420 326L428 326L460 376Z" fill="#cfd6db" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M420 376L421 330L427 330L428 376Z" fill="#d2452f" stroke="#173b50" stroke-width="2" stroke-linejoin="round"/><path d="M80 403L182.3 403" fill="none" stroke="#173b50" stroke-width="3"/><path d="M190 403L180 407.5L180 398.5Z" fill="#173b50" stroke-linejoin="round"/><path d="M505 430L457.7 430" fill="none" stroke="#173b50" stroke-width="3"/><path d="M450 430L460 425.5L460 434.5Z" fill="#173b50" stroke-linejoin="round"/><path d="M320 411L322.4 416.8L328.6 417.2L323.8 421.2L325.3 427.3L320 424L314.7 427.3L316.2 421.2L311.4 417.2L317.6 416.8Z" fill="#b8901f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><text x="50" y="438" font-family="Arial" font-size="14" fill="#173b50">Oceanic plate (denser) subducts</text><text x="446" y="396" font-family="Arial" font-size="14" fill="#173b50">Continental</text><text x="446" y="413" font-family="Arial" font-size="14" fill="#173b50">plate</text><path d="M218 327.1L255 393" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="255" cy="393" r="2.5" fill="#233b4d"/><text x="130" y="332" font-family="Arial" font-size="14" fill="#173b50">Ocean trench</text><path d="M373 315.1L414 342" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="414" cy="342" r="2.5" fill="#233b4d"/><text x="250" y="320" font-family="Arial" font-size="14" fill="#173b50">Composite volcano</text><text x="232" y="478" font-family="Arial" font-size="13" fill="#173b50">Friction: earthquake</text><path d="M300 466L316 428" fill="none" stroke="#233b4d" stroke-width="1.1"/><text x="452" y="487" font-family="Arial" font-size="13" fill="#173b50">Melting</text><text x="548" y="320" font-family="Arial" font-size="14" fill="#173b50">Plates move towards each other</text><text x="548" y="340" font-family="Arial" font-size="14" fill="#173b50">Denser oceanic plate sinks into</text><text x="548" y="360" font-family="Arial" font-size="14" fill="#173b50">the mantle (subduction)</text><text x="548" y="380" font-family="Arial" font-size="14" fill="#173b50">Friction: deep, violent quakes</text><text x="548" y="400" font-family="Arial" font-size="14" fill="#173b50">Plate melts; magma rises to</text><text x="548" y="420" font-family="Arial" font-size="14" fill="#173b50">composite volcanoes; trench and</text><text x="548" y="440" font-family="Arial" font-size="14" fill="#173b50">fold mountains</text><text x="548" y="460" font-family="Arial" font-size="14" fill="#173b50">e.g. Andes; Hikurangi (NZ)</text><text x="30" y="518" font-family="Arial" font-size="16" fill="#173b50" font-weight="bold">3  Conservative boundary — plan view (from above)</text><rect x="40" y="540" width="480" height="75" fill="#e1efd9" stroke="#173b50" stroke-width="1.2"/><rect x="40" y="620" width="480" height="75" fill="#f8f0c6" stroke="#173b50" stroke-width="1.2"/><path d="M40 618L60 622L80 615L100 622L120 615L140 622L160 615L180 622L200 615L220 622L240 615L260 622L280 615L300 622L320 615L340 622L360 615L380 622L400 615L420 622L440 615L460 622L480 615L500 622L520 615" fill="none" stroke="#a8383b" stroke-width="3" stroke-linejoin="round"/><path d="M90 575L222.3 575" fill="none" stroke="#173b50" stroke-width="3"/><path d="M230 575L220 579.5L220 570.5Z" fill="#173b50" stroke-linejoin="round"/><path d="M470 660L337.7 660" fill="none" stroke="#173b50" stroke-width="3"/><path d="M330 660L340 655.5L340 664.5Z" fill="#173b50" stroke-linejoin="round"/><path d="M300 540L300 618" fill="none" stroke="#8796a0" stroke-width="7"/><path d="M360 618L360 695" fill="none" stroke="#8796a0" stroke-width="7"/><text x="312" y="566" font-family="Arial" font-size="14" fill="#173b50">Road offset</text><text x="312" y="584" font-family="Arial" font-size="14" fill="#173b50">by movement</text><text x="60" y="608" font-family="Arial" font-size="14" fill="#a8383b" font-weight="bold">Fault line</text><text x="60" y="686" font-family="Arial" font-size="14" fill="#173b50">Plate B</text><text x="60" y="558" font-family="Arial" font-size="14" fill="#173b50">Plate A</text><text x="548" y="540" font-family="Arial" font-size="14" fill="#173b50">Plates slide past each other</text><text x="548" y="559" font-family="Arial" font-size="14" fill="#173b50">(opposite directions, or same</text><text x="548" y="578" font-family="Arial" font-size="14" fill="#173b50">direction at different speeds)</text><text x="548" y="597" font-family="Arial" font-size="14" fill="#173b50">Plates lock; stress builds,</text><text x="548" y="616" font-family="Arial" font-size="14" fill="#173b50">then is released suddenly</text><text x="548" y="635" font-family="Arial" font-size="14" fill="#173b50">Shallow, strong earthquakes</text><text x="548" y="654" font-family="Arial" font-size="14" fill="#173b50">No volcanoes: no crust made</text><text x="548" y="673" font-family="Arial" font-size="14" fill="#173b50">or destroyed</text><text x="548" y="692" font-family="Arial" font-size="14" fill="#173b50">e.g. San Andreas; Alpine Fault</text></svg>
