<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Rostow’s model of economic development (1960)</text><path d="M60 460L770 460" fill="none" stroke="#173b50" stroke-width="2"/><path d="M60 460L60 70" fill="none" stroke="#173b50" stroke-width="2"/><text x="36" y="270" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold" transform="rotate(-90 36 270)">Savings, investment and economic growth</text><text x="415" y="505" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle" font-weight="bold">Time →</text><rect x="64" y="440" width="139" height="20" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="68" y="362" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">1 Traditional society</text><text x="68" y="378" font-family="Arial" font-size="12" fill="#173b50">subsistence farming;</text><text x="68" y="392" font-family="Arial" font-size="12" fill="#173b50">little technology,</text><text x="68" y="406" font-family="Arial" font-size="12" fill="#173b50">trade or savings</text><text x="134" y="478" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">e.g. Mali, Niger</text><rect x="205" y="372" width="139" height="88" fill="#f8e3cc" stroke="#173b50" stroke-width="1"/><text x="209" y="294" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">2 Preconditions for take-off</text><text x="209" y="310" font-family="Arial" font-size="12" fill="#173b50">investment in</text><text x="209" y="324" font-family="Arial" font-size="12" fill="#173b50">transport and</text><text x="209" y="338" font-family="Arial" font-size="12" fill="#173b50">infrastructure;</text><text x="209" y="352" font-family="Arial" font-size="12" fill="#173b50">commercial farming</text><text x="209" y="366" font-family="Arial" font-size="12" fill="#173b50">and mining for export</text><text x="275" y="478" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">e.g. Mali</text><rect x="346" y="304" width="139" height="156" fill="#efc08f" stroke="#173b50" stroke-width="1"/><text x="350" y="226" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">3 Take-off</text><text x="350" y="242" font-family="Arial" font-size="12" fill="#173b50">shift from farming to</text><text x="350" y="256" font-family="Arial" font-size="12" fill="#173b50">manufacturing; rapid</text><text x="350" y="270" font-family="Arial" font-size="12" fill="#173b50">growth of a few</text><text x="350" y="284" font-family="Arial" font-size="12" fill="#173b50">industries</text><text x="416" y="478" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">e.g. Sri Lanka</text><rect x="487" y="236" width="139" height="224" fill="#b5d6a3" stroke="#173b50" stroke-width="1"/><text x="491" y="158" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">4 Drive to maturity</text><text x="491" y="174" font-family="Arial" font-size="12" fill="#173b50">investment and growth</text><text x="491" y="188" font-family="Arial" font-size="12" fill="#173b50">spread to many</text><text x="491" y="202" font-family="Arial" font-size="12" fill="#173b50">industries;</text><text x="491" y="216" font-family="Arial" font-size="12" fill="#173b50">technology used</text><text x="491" y="230" font-family="Arial" font-size="12" fill="#173b50">throughout</text><text x="557" y="478" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">e.g. China</text><rect x="628" y="168" width="139" height="292" fill="#a9cde6" stroke="#173b50" stroke-width="1"/><text x="632" y="90" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">5 High mass consumption</text><text x="632" y="106" font-family="Arial" font-size="12" fill="#173b50">wide range of</text><text x="632" y="120" font-family="Arial" font-size="12" fill="#173b50">consumer goods;</text><text x="632" y="134" font-family="Arial" font-size="12" fill="#173b50">services dominate</text><text x="698" y="478" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="middle">e.g. NZ, Australia</text></svg>
