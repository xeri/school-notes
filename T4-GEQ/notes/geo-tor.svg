<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370"><rect width="800" height="370" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Formation of a granite tor</text><rect x="30" y="90" width="360" height="180" fill="#d9c3c0" stroke="#173b50" stroke-width="1"/><rect x="30" y="90" width="360" height="40" fill="#d2b48f" stroke="#173b50" stroke-width="1"/><path d="M50 130L50 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M70 130L70 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M90 130L90 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M110 130L110 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M130 130L130 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M210 130L210 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M290 130L290 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M310 130L310 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M330 130L330 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M350 130L350 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M370 130L370 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 170L390 170" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 210L390 210" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 245L390 245" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><rect x="30" y="130" width="100" height="140" fill="#c7a991"/><rect x="290" y="130" width="100" height="140" fill="#c7a991"/><path d="M50 130L50 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M70 130L70 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M90 130L90 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M110 130L110 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M130 130L130 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M210 130L210 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M290 130L290 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M310 130L310 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M330 130L330 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M350 130L350 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M370 130L370 270" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 170L390 170" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 210L390 210" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><path d="M30 245L390 245" fill="none" stroke="#8a5a3b" stroke-width="1.5"/><text x="210" y="115" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Soil and regolith</text><text x="80" y="290" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Closely jointed:</text><text x="80" y="305" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">rotted to clay</text><text x="210" y="290" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Widely jointed:</text><text x="210" y="305" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">solid core-stones</text><text x="340" y="290" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">Closely jointed:</text><text x="340" y="305" font-family="Arial" font-size="12" fill="#173b50" text-anchor="middle">rotted to clay</text><text x="30" y="330" font-family="Arial" font-size="13" fill="#173b50">1  Underground, hydrolysis rots feldspar to clay</text><text x="30" y="346.2" font-family="Arial" font-size="13" fill="#173b50">along the joints — fastest where joints are close</text><text x="30" y="362.5" font-family="Arial" font-size="13" fill="#173b50">together</text><rect x="420" y="90" width="360" height="180" fill="white"/><path d="M420 270L480 225L540 205L660 205L720 225L780 270Z" fill="#d2b48f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><rect x="545" y="165" width="110" height="40" rx="8" fill="#d9c3c0" stroke="#173b50" stroke-width="1.2"/><rect x="555" y="130" width="90" height="35" rx="8" fill="#d9c3c0" stroke="#173b50" stroke-width="1.2"/><rect x="570" y="100" width="60" height="30" rx="8" fill="#d9c3c0" stroke="#173b50" stroke-width="1.2"/><rect x="490" y="212" width="18" height="12" rx="3" fill="#d9c3c0" stroke="#173b50" stroke-width="1"/><rect x="690" y="214" width="18" height="12" rx="3" fill="#d9c3c0" stroke="#173b50" stroke-width="1"/><rect x="515" y="205" width="18" height="12" rx="3" fill="#d9c3c0" stroke="#173b50" stroke-width="1"/><rect x="670" y="200" width="18" height="12" rx="3" fill="#d9c3c0" stroke="#173b50" stroke-width="1"/><path d="M666 115.5L630 125" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="630" cy="125" r="2.5" fill="#233b4d"/><text x="670" y="120" font-family="Arial" font-size="13" fill="#173b50">Tor: solid blocks</text><path d="M499 235L499 212" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="499" cy="212" r="2.5" fill="#233b4d"/><text x="440" y="250" font-family="Arial" font-size="13" fill="#173b50">Clitter (fallen blocks)</text><text x="420" y="330" font-family="Arial" font-size="13" fill="#173b50">2  Erosion strips away the clay and soil; the solid,</text><text x="420" y="346.2" font-family="Arial" font-size="13" fill="#173b50">widely jointed core is left standing as a tor (e.g.</text><text x="420" y="362.5" font-family="Arial" font-size="13" fill="#173b50">Dartmoor, UK)</text></svg>
