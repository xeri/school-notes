<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><rect width="800" height="420" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Formation of a corrie (cirque)</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">Hollows facing away from the Sun (south-east in New Zealand) keep their snow longest</text><path d="M20 100L60 110L90 180L120 224L170 240L210 220L230 212L270 280L270 330L20 330Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M94 187L120 224L170 240L210 220L140 202Z" fill="white" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><text x="155" y="196" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">snow</text><text x="20" y="362" font-family="Arial" font-size="13" fill="#173b50">1  Snow collects in a shaded</text><text x="20" y="378.2" font-family="Arial" font-size="13" fill="#173b50">hollow; nivation (freeze–thaw</text><text x="20" y="394.5" font-family="Arial" font-size="13" fill="#173b50">under snow) enlarges it</text><path d="M282 100L322 110L352 180L382 236L432 270L472 220L492 212L532 280L532 330L282 330Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M352 180L382 236L432 270L472 220L492 212Q422 180 352 180Z" fill="#dff1fa" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M377 205Q432 262 467 215" fill="none" stroke="#246b8e" stroke-width="2.5" stroke-linejoin="round"/><path d="M467 215L467.7 225L460 222.2Z" fill="#246b8e" stroke-linejoin="round"/><text x="422" y="190" font-family="Arial" font-size="13" fill="#246b8e" text-anchor="middle" font-weight="bold">ice</text><path d="M344 230.4L363 200" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="363" cy="200" r="2.5" fill="#233b4d"/><text x="288" y="235" font-family="Arial" font-size="13" fill="#173b50">Plucking</text><path d="M358 117.5L334 133" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="334" cy="133" r="2.5" fill="#233b4d"/><text x="362" y="122" font-family="Arial" font-size="13" fill="#173b50">Freeze–thaw</text><path d="M382 300.4L432 270" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="432" cy="270" r="2.5" fill="#233b4d"/><text x="382" y="305" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Abrasion</text><path d="M500 170.4L492 212" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="492" cy="212" r="2.5" fill="#233b4d"/><text x="504" y="175" font-family="Arial" font-size="13" fill="#173b50">Lip</text><path d="M438 115.5L432 200" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="432" cy="200" r="2.5" fill="#233b4d"/><text x="442" y="120" font-family="Arial" font-size="13" fill="#173b50">Rotational slip</text><text x="282" y="362" font-family="Arial" font-size="13" fill="#173b50">2  Snow compacts to ice;</text><text x="282" y="378.2" font-family="Arial" font-size="13" fill="#173b50">rotational slip, plucking of the</text><text x="282" y="394.5" font-family="Arial" font-size="13" fill="#173b50">back wall and abrasion of the</text><text x="282" y="410.8" font-family="Arial" font-size="13" fill="#173b50">floor deepen the hollow</text><path d="M544 100L584 110L614 180L644 238L694 275L734 220L754 212L794 280L794 330L544 330Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.5" stroke-linejoin="round"/><path d="M653.5 245L694 275L715.8 245Z" fill="#a9cde6" stroke="#246b8e" stroke-width="1.2" stroke-linejoin="round"/><path d="M694 290L694 265" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="694" cy="265" r="2.5" fill="#233b4d"/><text x="694" y="305" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Tarn (corrie lake)</text><path d="M604 129L604 150" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="604" cy="150" r="2.5" fill="#233b4d"/><text x="549" y="125" font-family="Arial" font-size="13" fill="#173b50">Steep back wall</text><path d="M733 185.4L734 220" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="734" cy="220" r="2.5" fill="#233b4d"/><text x="789" y="190" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">Rock lip</text><text x="544" y="362" font-family="Arial" font-size="13" fill="#173b50">3  The ice melts, leaving an</text><text x="544" y="378.2" font-family="Arial" font-size="13" fill="#173b50">armchair-shaped hollow with a</text><text x="544" y="394.5" font-family="Arial" font-size="13" fill="#173b50">steep back wall, a deepened floor,</text><text x="544" y="410.8" font-family="Arial" font-size="13" fill="#173b50">a lip and often a tarn</text></svg>
