<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Burgess concentric zone model (1925, based on Chicago)</text><circle cx="245" cy="280" r="225" fill="#e1efd9" stroke="#173b50" stroke-width="1.5"/><circle cx="245" cy="280" r="180" fill="#f8f0c6" stroke="#173b50" stroke-width="1.5"/><circle cx="245" cy="280" r="135" fill="#f8e3cc" stroke="#173b50" stroke-width="1.5"/><circle cx="245" cy="280" r="88" fill="#e6ddf1" stroke="#173b50" stroke-width="1.5"/><circle cx="245" cy="280" r="42" fill="#e3a3a0" stroke="#173b50" stroke-width="1.5"/><text x="245" y="287" font-family="Arial" font-size="20" fill="#173b50" text-anchor="middle" font-weight="bold">1</text><text x="310" y="287" font-family="Arial" font-size="20" fill="#173b50" text-anchor="middle" font-weight="bold">2</text><text x="356" y="287" font-family="Arial" font-size="20" fill="#173b50" text-anchor="middle" font-weight="bold">3</text><text x="402" y="287" font-family="Arial" font-size="20" fill="#173b50" text-anchor="middle" font-weight="bold">4</text><text x="447" y="287" font-family="Arial" font-size="20" fill="#173b50" text-anchor="middle" font-weight="bold">5</text><rect x="500" y="75" width="22" height="22" fill="#e3a3a0" stroke="#173b50" stroke-width="1"/><text x="532" y="91.5" font-family="Arial" font-size="14" fill="#173b50">1  Central business district (CBD)</text><text x="532" y="108.3" font-family="Arial" font-size="14" fill="#173b50">shops, offices, highest land values</text><rect x="500" y="123.8" width="22" height="22" fill="#e6ddf1" stroke="#173b50" stroke-width="1"/><text x="532" y="140.3" font-family="Arial" font-size="14" fill="#173b50">2  Zone of transition</text><text x="532" y="157.1" font-family="Arial" font-size="14" fill="#173b50">old factories, warehouses, inner-city</text><text x="532" y="173.9" font-family="Arial" font-size="14" fill="#173b50">decay, migrants arrive here first</text><rect x="500" y="189.4" width="22" height="22" fill="#f8e3cc" stroke="#173b50" stroke-width="1"/><text x="532" y="205.9" font-family="Arial" font-size="14" fill="#173b50">3  Low-income housing</text><text x="532" y="222.7" font-family="Arial" font-size="14" fill="#173b50">workers’ terraced housing near jobs</text><rect x="500" y="238.2" width="22" height="22" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="532" y="254.7" font-family="Arial" font-size="14" fill="#173b50">4  Medium-income housing</text><text x="532" y="271.5" font-family="Arial" font-size="14" fill="#173b50">newer semi-detached, gardens</text><rect x="500" y="287" width="22" height="22" fill="#e1efd9" stroke="#173b50" stroke-width="1"/><text x="532" y="303.5" font-family="Arial" font-size="14" fill="#173b50">5  High-income commuter zone</text><text x="532" y="320.3" font-family="Arial" font-size="14" fill="#173b50">large detached houses, commute in</text><path d="M500 440L753 440" fill="none" stroke="#173b50" stroke-width="2"/><path d="M760 440L750.9 444.1L750.9 435.9Z" fill="#173b50" stroke-linejoin="round"/><text x="500" y="465" font-family="Arial" font-size="14" fill="#173b50">Outwards: buildings get newer, density falls,</text><text x="500" y="482.5" font-family="Arial" font-size="14" fill="#173b50">wealth and house size rise</text><text x="30" y="508" font-family="Arial" font-size="13" fill="#8796a0">Schematic model.</text></svg>
