2.3" font-family="Arial" font-size="14" fill="#173b50">along the transport route</text><rect x="500" y="157.8" width="22" height="22" fill="#f8e3cc" stroke="#173b50" stroke-width="1"/><text x="532" y="174.3" font-family="Arial" font-size="14" fill="#173b50">3  Low-income housing</text><text x="532" y="191.1" font-family="Arial" font-size="14" fill="#173b50">beside the industry (noise, pollution)</text><rect x="500" y="206.6" width="22" height="22" fill="#f8f0c6" stroke="#173b50" stroke-width="1"/><text x="532" y="223.1" font-family="Arial" font-size="14" fill="#173b50">4  Medium-income housing</text><rect x="500" y="240.6" width="22" height="22" fill="#e1efd9" stroke="#173b50" stroke-width="1"/><text x="532" y="257.1" font-family="Arial" font-size="14" fill="#173b50">5  High-income housing</text><text x="532" y="273.9" font-family="Arial" font-size="14" fill="#173b50">away from industry, on attractive land</text><text x="500" y="400" font-family="Arial" font-size="14" fill="#173b50">Land uses grow outwards in wedges</text><text x="500" y="417.5" font-family="Arial" font-size="14" fill="#173b50">along transport routes, so a sector</text><text x="500" y="435" font-family="Arial" font-size="14" fill="#173b50">keeps its character as the city grows.</text><text x="30" y="508" font-family="Arial" font-size="13" fill="#8796a0">Schematic model.</text></svg>
