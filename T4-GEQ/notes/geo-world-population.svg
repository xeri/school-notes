<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">World population growth: the J-curve</text><path d="M90 430L770 430" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="435" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">0</text><path d="M90 356L770 356" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="361" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">2</text><path d="M90 282L770 282" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="287" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">4</text><path d="M90 208L770 208" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="213" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">6</text><path d="M90 134L770 134" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="139" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">8</text><path d="M90 60L770 60" fill="none" stroke="#cfd6db" stroke-width="1"/><text x="82" y="65" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">10</text><path d="M90 430L90 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="90" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1000</text><path d="M218.3 430L218.3 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="218.3" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1200</text><path d="M346.6 430L346.6 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="346.6" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1400</text><path d="M474.9 430L474.9 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="474.9" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1600</text><path d="M603.2 430L603.2 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="603.2" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">1800</text><path d="M731.5 430L731.5 436" fill="none" stroke="#173b50" stroke-width="1.5"/><text x="731.5" y="452" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">2000</text><path d="M90 430L770 430" fill="none" stroke="#173b50" stroke-width="2"/><path d="M90 430L90 60" fill="none" stroke="#173b50" stroke-width="2"/><text x="430" y="474" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle">Year (CE)</text><text x="42" y="245" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" transform="rotate(-90 42 245)">World population (billions)</text><path d="M90 418.9C111.4 418.3 181.9 416.1 218.3 415.2C254.7 414.3 286.7 413.5 308.1 413.7C329.5 413.9 329.5 416.4 346.6 416.3C363.7 416.2 389.4 414.1 410.8 413C432.1 411.9 453.5 410.5 474.9 409.6C496.3 408.8 523 409.3 539.1 407.8C555.1 406.3 560.4 403.2 571.1 400.8C581.8 398.3 592.5 395.9 603.2 393C613.9 390.1 624.6 387.4 635.3 383.4C646 379.4 659.1 373.5 667.4 368.9C675.6 364.4 679.3 361.2 684.7 356C690 350.8 695.9 343.7 699.4 337.5C703 331.3 703.3 328.2 705.8 319C708.4 309.8 711.9 294.3 714.8 282C717.7 269.7 720.5 257.3 723.2 245C725.8 232.7 728.3 220.3 730.9 208C733.4 195.7 736.1 183.3 738.6 171C741 158.7 744.1 141.4 745.6 134C747.1 126.6 747.2 127.8 747.5 126.6" fill="none" stroke="#246b8e" stroke-width="3.5" stroke-linejoin="round"/><path d="M747.5 126.6C748.8 121.7 751.5 108.1 755.2 97C759 85.9 767.5 66.2 770 60" fill="none" stroke="#246b8e" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/><circle cx="603.2" cy="393" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="593.2" y="398" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">1 bn c.1800</text><circle cx="684.7" cy="356" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="674.7" y="361" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">2 bn 1927</text><circle cx="705.8" cy="319" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="695.8" y="324" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">3 bn 1960</text><circle cx="714.8" cy="282" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="704.8" y="287" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">4 bn 1974</text><circle cx="723.2" cy="245" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="713.2" y="250" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">5 bn 1987</text><circle cx="730.9" cy="208" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="720.9" y="213" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">6 bn 1999</text><circle cx="738.6" cy="171" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="728.6" y="176" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">7 bn 2011</text><circle cx="745.6" cy="134" r="4.5" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="735.6" y="139" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">8 bn Nov 2022</text><text x="735" y="58" font-family="Arial" font-size="13" fill="#8796a0" text-anchor="end">Dashed: UN projection, about 9 bn by the late 2030s</text><text x="274.5" y="385.7" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">Black Death (1340s)</text><path d="M314.5 391.7L320.9 410.5" fill="none" stroke="#8796a0" stroke-width="1.2"/><text x="110" y="90" font-family="Arial" font-size="14" fill="#173b50">Slow growth for most of history: high birth rates</text><text x="110" y="107.5" font-family="Arial" font-size="14" fill="#173b50">cancelled out by high death rates (famine, disease, war).</text><text x="110" y="125" font-family="Arial" font-size="14" fill="#173b50">Since about 1750 the agricultural and industrial revolutions,</text><text x="110" y="142.5" font-family="Arial" font-size="14" fill="#173b50">then clean water, vaccines and medicine, cut death rates</text><text x="110" y="160" font-family="Arial" font-size="14" fill="#173b50">while birth rates stayed high — so growth exploded.</text><text x="30" y="505" font-family="Arial" font-size="13" fill="#8796a0">Approximate figures. Each extra billion arrived faster: 123 years, then 33, 14, 13, 12, 12, 11.</text></svg>
