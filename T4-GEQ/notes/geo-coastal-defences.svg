<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="white"/><defs><marker id="aink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173b50"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8383b"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b8e"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24775c"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c16b20"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Coastal defences: hard and soft engineering</text><rect x="15.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="23.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">1  Sea wall (hard)</text><rect x="15.0" y="160.0" width="140.0" height="65.0" fill="#8cc3e6"/><path d="M15 160 L155 160" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><polygon points="180.0,115.0 255.0,115.0 255.0,225.0 180.0,225.0" fill="#e1efd9" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M180 225 L155 225 L155 150 Q155 117 127 110 L180 110 Z" fill="#8796a0" stroke="#173b50" stroke-width="1.2"/><path d="M35 180 L147 180" fill="none" stroke="#246b8e" stroke-width="3" marker-end="url(#ablue)"/><path d="M133 127 Q95 125 45 143" fill="none" stroke="#a8383b" stroke-width="2.5" marker-end="url(#ared)"/><text x="35.0" y="117.0" font-family="Arial" font-size="11.5" fill="#a8383b" text-anchor="start">energy reflected</text><text x="15.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Curved concrete face reflects wave</text><text x="15.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">energy back to sea. Strong, long-lasting;</text><text x="15.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">very expensive; scours the beach in front.</text><rect x="280.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="288.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">2  Groynes (hard): plan view</text><rect x="280.0" y="83.0" width="240.0" height="24.0" fill="#e1efd9"/><rect x="280.0" y="107.0" width="240.0" height="118.0" fill="#8cc3e6"/><polygon points="280.0,107.0 350.0,107.0 350.0,160.0 280.0,121.0" fill="#efc08f" stroke-linejoin="round"/><polygon points="350.0,107.0 420.0,107.0 420.0,160.0 350.0,121.0" fill="#efc08f" stroke-linejoin="round"/><polygon points="420.0,107.0 490.0,107.0 490.0,160.0 420.0,121.0" fill="#efc08f" stroke-linejoin="round"/><polygon points="490.0,107.0 520.0,107.0 520.0,115.0 490.0,121.0" fill="#efc08f" stroke-linejoin="round"/><path d="M350 107 L350 173" fill="none" stroke="#8a5a3b" stroke-width="5" stroke-linejoin="round"/><path d="M420 107 L420 173" fill="none" stroke="#8a5a3b" stroke-width="5" stroke-linejoin="round"/><path d="M490 107 L490 173" fill="none" stroke="#8a5a3b" stroke-width="5" stroke-linejoin="round"/><path d="M295 203 L505 203" fill="none" stroke="#173b50" stroke-width="2.5" marker-end="url(#aink)"/><text x="340.0" y="197.0" font-family="Arial" font-size="12" fill="#173b50" text-anchor="start">longshore drift</text><text x="280.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Trap sand moving by longshore drift;</text><text x="280.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">the wider beach absorbs wave energy.</text><text x="280.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Starve the coast downdrift of sand.</text><rect x="545.0" y="55.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="553.0" y="73.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">3  Rock armour / rip-rap (hard)</text><rect x="545.0" y="170.0" width="175.0" height="55.0" fill="#8cc3e6"/><path d="M545 170 L720 170" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><polygon points="720.0,95.0 785.0,95.0 785.0,225.0 710.0,225.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><circle cx="665" cy="207" r="15" fill="#8796a0" stroke="#173b50" stroke-width="1"/><circle cx="693" cy="205" r="16" fill="#8796a0" stroke="#173b50" stroke-width="1"/><circle cx="679" cy="179" r="14" fill="#8796a0" stroke="#173b50" stroke-width="1"/><circle cx="705" cy="177" r="13" fill="#8796a0" stroke="#173b50" stroke-width="1"/><circle cx="647" cy="215" r="11" fill="#8796a0" stroke="#173b50" stroke-width="1"/><path d="M560 190 L631 190" fill="none" stroke="#246b8e" stroke-width="3" marker-end="url(#ablue)"/><text x="545.0" y="247.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Large boulders at the cliff foot absorb</text><text x="545.0" y="262.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">and break up wave energy. Cheaper;</text><text x="545.0" y="277.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">rocks often imported; moved by storms.</text><rect x="15.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="23.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">4  Gabions (hard)</text><rect x="15.0" y="440.0" width="150.0" height="50.0" fill="#8cc3e6"/><path d="M15 440 L165 440" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><polygon points="200.0,360.0 255.0,360.0 255.0,490.0 195.0,490.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><rect x="135.0" y="458.0" width="30.0" height="32.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M143 458 L143 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M135 466 L165 466" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M151 458 L151 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M135 474 L165 474" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M159 458 L159 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M135 482 L165 482" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><rect x="165.0" y="458.0" width="30.0" height="32.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M173 458 L173 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M165 466 L195 466" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M181 458 L181 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M165 474 L195 474" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M189 458 L189 490" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M165 482 L195 482" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><rect x="150.0" y="426.0" width="30.0" height="32.0" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2"/><path d="M158 426 L158 458" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M150 434 L180 434" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M166 426 L166 458" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M150 442 L180 442" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M174 426 L174 458" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M150 450 L180 450" fill="none" stroke="#173b50" stroke-width="0.7" stroke-linejoin="round"/><path d="M30 470 L127 470" fill="none" stroke="#246b8e" stroke-width="3" marker-end="url(#ablue)"/><text x="15.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Wire cages filled with rocks absorb</text><text x="15.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">wave energy; water drains through.</text><text x="15.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Cheap and quick, but short-lived.</text><rect x="280.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="288.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">5  Beach nourishment (soft)</text><rect x="280.0" y="448.0" width="240.0" height="42.0" fill="#8cc3e6"/><polygon points="290.0,490.0 520.0,490.0 520.0,382.0 290.0,470.0" fill="#f8e3cc" stroke="#8a5a3b" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 3"/><polygon points="320.0,490.0 520.0,490.0 520.0,400.0 320.0,470.0" fill="#efc08f" stroke="#173b50" stroke-width="1" stroke-linejoin="round"/><path d="M450 350 L450 396" fill="none" stroke="#c16b20" stroke-width="2.5" marker-end="url(#aorange)"/><text x="460.0" y="370.0" font-family="Arial" font-size="12" fill="#c16b20" text-anchor="start" font-weight="bold">sand added</text><text x="280.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Sand or shingle added (pale, dashed)</text><text x="280.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">widens and raises the beach so it absorbs</text><text x="280.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">wave energy. Looks natural; must be repeated.</text><rect x="545.0" y="320.0" width="240.0" height="170.0" fill="#eef5fa"/><text x="553.0" y="338.0" font-family="Arial" font-size="13.5" fill="#173b50" text-anchor="start" font-weight="bold">6  Dune planting and fencing (soft)</text><rect x="545.0" y="460.0" width="70.0" height="30.0" fill="#8cc3e6"/><path d="M545 470 L615 470 Q655 470 675 410 Q695 390 720 420 Q745 450 785 430 L785 490 L545 490 Z" fill="#efc08f" stroke="#173b50" stroke-width="1.2"/><path d="M662 436 l-4 -12 M662 436 l0 -14 M662 436 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M671 420 l-4 -12 M671 420 l0 -14 M671 420 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M682 408 l-4 -12 M682 408 l0 -14 M682 408 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M695 401 l-4 -12 M695 401 l0 -14 M695 401 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M708 407 l-4 -12 M708 407 l0 -14 M708 407 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M730 429 l-4 -12 M730 429 l0 -14 M730 429 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M750 437 l-4 -12 M750 437 l0 -14 M750 437 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M770 433 l-4 -12 M770 433 l0 -14 M770 433 l4 -12" fill="none" stroke="#24775c" stroke-width="1.5" stroke-linejoin="round"/><path d="M631 470 L631 448" fill="none" stroke="#8a5a3b" stroke-width="2.5" stroke-linejoin="round"/><path d="M639 470 L639 448" fill="none" stroke="#8a5a3b" stroke-width="2.5" stroke-linejoin="round"/><path d="M647 470 L647 448" fill="none" stroke="#8a5a3b" stroke-width="2.5" stroke-linejoin="round"/><path d="M629 456 L649 456" fill="none" stroke="#8a5a3b" stroke-width="1.5" stroke-linejoin="round"/><text x="675.0" y="370.0" font-family="Arial" font-size="12" fill="#24775c" text-anchor="start">spinifex, pīngao</text><text x="553.0" y="442.0" font-family="Arial" font-size="12" fill="#8a5a3b" text-anchor="start">fence</text><text x="545.0" y="512.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">Roots trap and bind sand; fences and</text><text x="545.0" y="527.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">boardwalks keep people off. Cheap; builds</text><text x="545.0" y="542.0" font-family="Arial" font-size="12" fill="#233b4d" text-anchor="start">habitat; slow (Mangawhai Heads, Muriwai).</text><text x="20.0" y="585.0" font-family="Arial" font-size="11.5" fill="#233b4d" text-anchor="start">Hard = artificial structures that resist the sea. Soft = working with natural processes. Mark schemes: 1 mark for the name, 1 for how it works.</text></svg>