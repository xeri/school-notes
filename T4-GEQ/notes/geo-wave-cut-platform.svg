<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390"><rect width="800" height="390" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">Cliff retreat and the wave-cut platform</text><rect x="80" y="215" width="180" height="75" fill="#dcecf7"/><path d="M20 90L145 90L145 193L129 209L145 223L149 225L260 257L260 290L20 290Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M80 215L260 215" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M80 245L260 245" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="2 4"/><text x="258" y="211" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">HWM</text><text x="258" y="241" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">LWM</text><path d="M156 155.8L135 209" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="135" cy="209" r="2.5" fill="#233b4d"/><text x="160" y="160" font-family="Arial" font-size="12" fill="#173b50">notch</text><text x="20" y="312" font-family="Arial" font-size="13" fill="#173b50">1  Destructive waves erode the cliff</text><text x="20" y="328.2" font-family="Arial" font-size="13" fill="#173b50">foot between high and low tide:</text><text x="20" y="344.5" font-family="Arial" font-size="13" fill="#173b50">hydraulic action and abrasion cut a</text><text x="20" y="360.8" font-family="Arial" font-size="13" fill="#173b50">wave-cut notch</text><rect x="340" y="215" width="180" height="75" fill="#dcecf7"/><path d="M280 90L385 90L385 193L351 209L385 223L389 225L520 257L520 290L280 290Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M340 215L520 215" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M340 245L520 245" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="2 4"/><text x="518" y="211" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">HWM</text><text x="518" y="241" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">LWM</text><text x="280" y="312" font-family="Arial" font-size="13" fill="#173b50">2  The notch deepens; the cliff</text><text x="280" y="328.2" font-family="Arial" font-size="13" fill="#173b50">above is left overhanging and</text><text x="280" y="344.5" font-family="Arial" font-size="13" fill="#173b50">unsupported</text><rect x="600" y="215" width="180" height="75" fill="#dcecf7"/><path d="M540 90L610 90L610 215L620 221L780 255L780 290L540 290Z" fill="#b9c1c7" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><path d="M600 215L780 215" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M600 245L780 245" fill="none" stroke="#246b8e" stroke-width="1.5" stroke-dasharray="2 4"/><text x="778" y="211" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">HWM</text><text x="778" y="241" font-family="Arial" font-size="11" fill="#246b8e" text-anchor="end">LWM</text><path d="M665 90L665 215" fill="none" stroke="#173b50" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M662 80L624.3 80" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M618 80L626.2 76.3L626.2 83.7Z" fill="#a8383b" stroke-linejoin="round"/><text x="668" y="76" font-family="Arial" font-size="12" fill="#a8383b" font-weight="bold">retreat</text><path d="M690 261L690 240" fill="none" stroke="#233b4d" stroke-width="1.2"/><circle cx="690" cy="240" r="2.5" fill="#233b4d"/><text x="650" y="275" font-family="Arial" font-size="12" fill="#173b50">wave-cut platform</text><rect x="625" y="211" width="12" height="8" fill="#b9c1c7" stroke="#173b50" stroke-width="1"/><text x="540" y="312" font-family="Arial" font-size="13" fill="#173b50">3  The overhang collapses; the cliff</text><text x="540" y="328.2" font-family="Arial" font-size="13" fill="#173b50">retreats inland, leaving a gently</text><text x="540" y="344.5" font-family="Arial" font-size="13" fill="#173b50">sloping wave-cut platform exposed at</text><text x="540" y="360.8" font-family="Arial" font-size="13" fill="#173b50">low tide</text></svg>
