.5" stroke-dasharray="6 4" stroke-linejoin="round"/><circle cx="512.3" cy="245" r="5" fill="#246b8e" stroke="#173b50" stroke-width="1"/><text x="504.3" y="235" font-family="Arial" font-size="13" fill="#173b50" text-anchor="end">2007: world 50% urban</text><text x="216.5" y="269.5" font-family="Arial" font-size="13" fill="#a8383b">UK passes 50% c.1851</text><rect x="620" y="80" width="20" height="20" fill="#a8383b" stroke="#173b50" stroke-width="1"/><text x="650" y="95" font-family="Arial" font-size="14" fill="#173b50">UK (England</text><text x="650" y="111.8" font-family="Arial" font-size="14" fill="#173b50">and Wales)</text><rect x="620" y="126.8" width="20" height="20" fill="#246b8e" stroke="#173b50" stroke-width="1"/><text x="650" y="141.8" font-family="Arial" font-size="14" fill="#173b50">World</text><rect x="620" y="156.8" width="20" height="20" fill="#c16b20" stroke="#173b50" stroke-width="1"/><text x="650" y="171.8" font-family="Arial" font-size="14" fill="#173b50">Africa</text><text x="620" y="230" font-family="Arial" font-size="14" fill="#173b50">Dashed lines =</text><text x="620" y="247.5" font-family="Arial" font-size="14" fill="#173b50">UN projections</text><text x="620" y="265" font-family="Arial" font-size="14" fill="#173b50">to 2050.</text><text x="620" y="282.5" font-family="Arial" font-size="14" fill="#173b50"></text><text x="620" y="300" font-family="Arial" font-size="14" fill="#173b50">HICs urbanised</text><text x="620" y="317.5" font-family="Arial" font-size="14" fill="#173b50">first (industrial</text><text x="620" y="335" font-family="Arial" font-size="14" fill="#173b50">revolution); LICs</text><text x="620" y="352.5" font-family="Arial" font-size="14" fill="#173b50">and MICs are</text><text x="620" y="370" font-family="Arial" font-size="14" fill="#173b50">urbanising now,</text><text x="620" y="387.5" font-family="Arial" font-size="14" fill="#173b50">and faster.</text><text x="30" y="478" font-family="Arial" font-size="13" fill="#8796a0">Approximate values from UN World Urbanization Prospects and UK census history; definitions of "urban" differ</text><text x="30" y="494.2" font-family="Arial" font-size="13" fill="#8796a0">between countries, so compare shapes rather than exact figures.</text></svg>
