5" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M575 540L569 585" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M584 540L578 585" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M593 540L587 585" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M300 540L463.7 463" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M470 460L463.5 467.6L460 460.2Z" fill="#a8383b" stroke-linejoin="round"/><text x="310" y="425" font-family="Arial" font-size="12" fill="#173b50">Warm air rises over</text><text x="310" y="439" font-family="Arial" font-size="12" fill="#173b50">the cold air</text><text x="30" y="612" font-family="Arial" font-size="12" fill="#173b50">Behind cold front: colder, wind shifts SW, showers then clearing.  At cold front: heavy, short rain, thunder.</text><text x="30" y="628" font-family="Arial" font-size="12" fill="#173b50">Warm sector: milder, drizzle or a lull.  Warm front: long steady rain.  Ahead: cirrus thickening, pressure falling.</text></svg>
