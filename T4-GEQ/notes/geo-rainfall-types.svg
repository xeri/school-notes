<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="white"/><text x="30" y="32" font-family="Arial" font-size="20" fill="#173b50" font-weight="bold">The three types of rainfall</text><text x="30" y="54" font-family="Arial" font-size="14" fill="#233b4d">All need air to rise, cool to its dew point and condense on condensation nuclei</text><rect x="15" y="70" width="250" height="230" fill="#f1f7fb"/><text x="140" y="92" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Convectional (free convection)</text><rect x="15" y="280" width="250" height="20" fill="#dfe8d4" stroke="#173b50" stroke-width="1"/><circle cx="45" cy="125" r="16" fill="#f6c945" stroke="#b8901f" stroke-width="1.5"/><path d="M65 140L90 150" fill="none" stroke="#b8901f" stroke-width="2"/><path d="M65 155L90 180" fill="none" stroke="#b8901f" stroke-width="2"/><path d="M65 170L90 210" fill="none" stroke="#b8901f" stroke-width="2"/><path d="M135 110L235 110L215 125L155 125Z" fill="white" stroke="#8796a0" stroke-width="1.2" stroke-linejoin="round"/><rect x="160" y="125" width="50" height="70" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="154.2" cy="201.6" r="19.8" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="185" cy="188.4" r="26.4" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="215.8" cy="201.6" r="19.8" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="185" cy="206" r="19.8" fill="white" stroke="#8796a0" stroke-width="1.2"/><rect x="154.2" y="199.4" width="61.6" height="22" fill="white"/><path d="M155 225L149 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M167 225L161 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M179 225L173 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M191 225L185 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M203 225L197 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M215 225L209 275" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M110 275L119.4 181.3" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M120 175L122.8 183.5L115.5 182.8Z" fill="#a8383b" stroke-linejoin="round"/><path d="M135 275L144.4 181.3" fill="none" stroke="#a8383b" stroke-width="2.2"/><path d="M145 175L147.8 183.5L140.5 182.8Z" fill="#a8383b" stroke-linejoin="round"/><text x="21" y="196" font-family="Arial" font-size="12" fill="#173b50">1 Sun heats</text><text x="21" y="210" font-family="Arial" font-size="12" fill="#173b50">the ground</text><text x="21" y="240" font-family="Arial" font-size="12" fill="#173b50">2 Warm air</text><text x="21" y="254" font-family="Arial" font-size="12" fill="#173b50">rises</text><text x="15" y="322" font-family="Arial" font-size="13" fill="#173b50">Intense heating warms the air, which</text><text x="15" y="338.2" font-family="Arial" font-size="13" fill="#173b50">expands and rises in thermals → cools</text><text x="15" y="354.5" font-family="Arial" font-size="13" fill="#173b50">to dew point → towering cumulonimbus</text><text x="15" y="370.8" font-family="Arial" font-size="13" fill="#173b50">→ heavy afternoon downpours with</text><text x="15" y="387" font-family="Arial" font-size="13" fill="#173b50">thunder and lightning. Equatorial</text><text x="15" y="403.2" font-family="Arial" font-size="13" fill="#173b50">regions daily; NZ inland in summer.</text><rect x="277" y="70" width="250" height="230" fill="#f1f7fb"/><text x="402" y="92" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Relief / orographic (forced)</text><rect x="277" y="280" width="50" height="20" fill="#8cc3e6" stroke="#173b50" stroke-width="1"/><path d="M327 300L327 280L417 140L527 280L527 300Z" fill="#dfe8d4" stroke="#173b50" stroke-width="1.2" stroke-linejoin="round"/><circle cx="356.8" cy="145.4" r="16.2" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="382" cy="134.6" r="21.6" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="407.2" cy="145.4" r="16.2" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="382" cy="149" r="16.2" fill="white" stroke="#8796a0" stroke-width="1.2"/><rect x="356.8" y="143.6" width="50.4" height="18" fill="white"/><path d="M362 165L356 215" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M374 165L368 215" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M386 165L380 215" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M398 165L392 215" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M285 262L340.8 233.2" fill="none" stroke="#246b8e" stroke-width="2.5"/><path d="M347 230L340.8 237.8L337 230.6Z" fill="#246b8e" stroke-linejoin="round"/><path d="M437 130L497.2 194.9" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M502 200L492.8 196.1L498.8 190.5Z" fill="#a8383b" stroke-linejoin="round"/><text x="281" y="120" font-family="Arial" font-size="12" fill="#173b50">Moist westerly</text><text x="281" y="134" font-family="Arial" font-size="12" fill="#173b50">off the sea</text><text x="337" y="258" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">Windward:</text><text x="337" y="272" font-family="Arial" font-size="12" fill="#173b50">wet</text><text x="452" y="235" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">Leeward: rain</text><text x="452" y="249" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">shadow, dry</text><text x="447" y="114" font-family="Arial" font-size="12" fill="#173b50">Sinks, warms</text><text x="447" y="128" font-family="Arial" font-size="12" fill="#173b50">(föhn)</text><text x="277" y="322" font-family="Arial" font-size="13" fill="#173b50">Moist wind is forced up a mountain</text><text x="277" y="338.2" font-family="Arial" font-size="13" fill="#173b50">barrier → cools → condenses → cloud</text><text x="277" y="354.5" font-family="Arial" font-size="13" fill="#173b50">and rain on the windward side. Air</text><text x="277" y="370.8" font-family="Arial" font-size="13" fill="#173b50">descends the far side, warms and</text><text x="277" y="387" font-family="Arial" font-size="13" fill="#173b50">dries → rain shadow. West Coast wet,</text><text x="277" y="403.2" font-family="Arial" font-size="13" fill="#173b50">Canterbury dry.</text><rect x="539" y="70" width="250" height="230" fill="#f1f7fb"/><text x="664" y="92" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle" font-weight="bold">Frontal (cyclonic)</text><rect x="539" y="280" width="250" height="20" fill="#dfe8d4" stroke="#173b50" stroke-width="1"/><path d="M579 280L789 150L789 280Z" fill="#cfe3f4" stroke="#246b8e" stroke-width="1.5" stroke-linejoin="round"/><path d="M539 110L789 110L789 150L579 280L539 280Z" fill="#fbe3cf" stroke-linejoin="round"/><path d="M579 280L789 150" fill="none" stroke="#246b8e" stroke-width="2.5"/><circle cx="675.2" cy="155.1" r="15.3" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="699" cy="144.9" r="20.4" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="722.8" cy="155.1" r="15.3" fill="white" stroke="#8796a0" stroke-width="1.2"/><circle cx="699" cy="158.5" r="15.3" fill="white" stroke="#8796a0" stroke-width="1.2"/><rect x="675.2" y="153.4" width="47.6" height="17" fill="white"/><path d="M679 172L673 205" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M691 172L685 205" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M703 172L697 205" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M715 172L709 205" fill="none" stroke="#246b8e" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M599 250L683.3 189.1" fill="none" stroke="#a8383b" stroke-width="2.5"/><path d="M689 185L684 193.7L679.2 187Z" fill="#a8383b" stroke-linejoin="round"/><text x="547" y="140" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">Warm, light,</text><text x="547" y="154" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">moist air</text><text x="699" y="250" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">Cold, dense</text><text x="699" y="264" font-family="Arial" font-size="12" fill="#173b50" font-weight="bold">air</text><text x="744" y="215" font-family="Arial" font-size="12" fill="#246b8e" font-weight="bold">Front</text><text x="539" y="322" font-family="Arial" font-size="13" fill="#173b50">Where a warm air mass meets a cold</text><text x="539" y="338.2" font-family="Arial" font-size="13" fill="#173b50">one, the lighter warm air is forced</text><text x="539" y="354.5" font-family="Arial" font-size="13" fill="#173b50">to rise over the cold air → cools →</text><text x="539" y="370.8" font-family="Arial" font-size="13" fill="#173b50">condenses along the front → rain.</text><text x="539" y="387" font-family="Arial" font-size="13" fill="#173b50">Mid-latitudes, including NZ in</text><text x="539" y="403.2" font-family="Arial" font-size="13" fill="#173b50">winter.</text></svg>
