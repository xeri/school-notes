<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420"><rect width="860" height="420" fill="white"/><text x="20" y="34" font-family="Arial" font-size="20" font-weight="bold" fill="#173b50">Recruitment and selection process</text><rect x="20" y="70" width="180" height="110" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="110" y="102" font-size="17" font-weight="bold">1 Vacancy</text><text x="110" y="132" font-size="15">identify the job</text><text x="110" y="152" font-size="15">(leaver, growth)</text></g><rect x="230" y="70" width="180" height="110" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="320" y="102" font-size="17" font-weight="bold">2 Job analysis</text><text x="320" y="132" font-size="15">job description +</text><text x="320" y="152" font-size="15">person specification</text></g><rect x="440" y="70" width="180" height="110" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="530" y="102" font-size="17" font-weight="bold">3 Advertise</text><text x="530" y="132" font-size="15">internal or external:</text><text x="530" y="152" font-size="15">website, agency, press</text></g><rect x="650" y="70" width="180" height="110" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="740" y="102" font-size="17" font-weight="bold">4 Applications</text><text x="740" y="132" font-size="15">CVs, application</text><text x="740" y="152" font-size="15">forms, letters</text></g><rect x="650" y="240" width="180" height="110" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="740" y="272" font-size="17" font-weight="bold">5 Shortlist</text><text x="740" y="302" font-size="15">compare applicants</text><text x="740" y="322" font-size="15">with person spec</text></g><rect x="440" y="240" width="180" height="110" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="530" y="272" font-size="17" font-weight="bold">6 Select</text><text x="530" y="302" font-size="15">interview, tests,</text><text x="530" y="322" font-size="15">trial, references</text></g><rect x="230" y="240" width="180" height="110" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="320" y="272" font-size="17" font-weight="bold">7 Appoint</text><text x="320" y="302" font-size="15">offer the job,</text><text x="320" y="322" font-size="15">employment contract</text></g><rect x="20" y="240" width="180" height="110" rx="8" fill="#e3f1ea" stroke="#24775c" stroke-width="2"/><g font-family="Arial" fill="#173b50" text-anchor="middle"><text x="110" y="272" font-size="17" font-weight="bold">8 Induction</text><text x="110" y="302" font-size="15">premises, rules,</text><text x="110" y="322" font-size="15">safety, colleagues</text></g><path d="M200 125H228M228 125l-9-5M228 125l-9 5M410 125H438M438 125l-9-5M438 125l-9 5M620 125H648M648 125l-9-5M648 125l-9 5M740 182V236M740 236l-5-9M740 236l5-9M650 295H622M622 295l9-5M622 295l9 5M440 295H412M412 295l9-5M412 295l9 5M230 295H202M202 295l9-5M202 295l9 5" stroke="#233b4d" stroke-width="2.5" fill="none"/><g font-family="Arial" font-size="15"><text x="20" y="372" fill="#246b8e" font-weight="bold">Recruitment</text><text x="120" y="372" fill="#173b50">attracts suitable applicants (steps 1 to 4).</text><text x="20" y="396" fill="#c16b20" font-weight="bold">Selection</text><text x="120" y="396" fill="#173b50">chooses the best applicant (steps 5 to 7); induction then trains the new starter.</text></g></svg>
