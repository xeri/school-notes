<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440"><rect width="860" height="440" fill="white"/><rect x="20" y="70" width="175" height="190" rx="10" fill="#e3f1ea" stroke="#24775c" stroke-width="2"/><text x="107" y="104" font-family="Arial" font-size="20" font-weight="bold" fill="#24775c" text-anchor="middle">Primary</text><g font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle"><text x="107" y="134">extract raw</text><text x="107" y="154">materials</text></g><g font-family="Arial" font-size="15" fill="#555" text-anchor="middle" font-style="italic"><text x="107" y="208">forestry: logs</text><text x="107" y="228">worth $40</text></g><rect x="235" y="70" width="175" height="190" rx="10" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><text x="322" y="104" font-family="Arial" font-size="20" font-weight="bold" fill="#246b8e" text-anchor="middle">Secondary</text><g font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle"><text x="322" y="134">manufacture</text><text x="322" y="154">and construct</text></g><g font-family="Arial" font-size="15" fill="#555" text-anchor="middle" font-style="italic"><text x="322" y="208">furniture factory:</text><text x="322" y="228">table, cost $180</text></g><rect x="450" y="70" width="175" height="190" rx="10" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="537" y="104" font-family="Arial" font-size="20" font-weight="bold" fill="#c16b20" text-anchor="middle">Tertiary</text><g font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle"><text x="537" y="134">provide</text><text x="537" y="154">services</text></g><g font-family="Arial" font-size="15" fill="#555" text-anchor="middle" font-style="italic"><text x="537" y="208">transport, retailer,</text><text x="537" y="228">table sold at $350</text></g><rect x="665" y="70" width="175" height="190" rx="10" fill="#efe8f5" stroke="#7a4e9c" stroke-width="2"/><text x="752" y="104" font-family="Arial" font-size="20" font-weight="bold" fill="#7a4e9c" text-anchor="middle">Consumer</text><g font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle"><text x="752" y="134">buys the</text><text x="752" y="154">finished product</text></g><g font-family="Arial" font-size="15" fill="#555" text-anchor="middle" font-style="italic"><text x="752" y="208">household pays</text><text x="752" y="228">$350</text></g><path d="M197 165H233M233 165l-10-6M233 165l-10 6" stroke="#233b4d" stroke-width="3" fill="none"/><path d="M412 165H448M448 165l-10-6M448 165l-10 6" stroke="#233b4d" stroke-width="3" fill="none"/><path d="M627 165H663M663 165l-10-6M663 165l-10 6" stroke="#233b4d" stroke-width="3" fill="none"/><text x="20" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#173b50">Chain of production: each sector adds value</text><g font-family="Arial" font-size="16" fill="#173b50"><text x="20" y="300">Value added at each stage: secondary adds $180 − $40 = $140; tertiary adds $350 − $180 = $170.</text><text x="20" y="326">The firms that pass materials along this chain are its <tspan font-weight="bold">supply chain</tspan>. A break at one link</text><text x="20" y="350">(a late delivery, a strike, a failed supplier) stops everything after it.</text></g><g font-family="Arial" font-size="16" fill="#173b50"><text x="20" y="390"><tspan font-weight="bold">Another chain:</tspan> coffee grower (primary) → roaster (secondary) → café (tertiary) → customer.</text></g><text x="20" y="428" font-family="Arial" font-size="14" fill="#555">Illustrative figures. The tertiary sector also serves the other two: banking, insurance, transport and advertising.</text></svg>
