<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500"><rect width="860" height="500" fill="white"/><g fill="none" stroke="#8796a0" stroke-dasharray="6 5"><rect x="25" y="42" width="225" height="408" rx="10"/><rect x="580" y="42" width="270" height="420" rx="10"/></g><path d="M340 235L232 125M340 235L232 240M340 235L232 355M520 235L598 80M520 235L598 148M520 235L598 216M520 235L598 284M520 235L598 352M520 235L598 420" stroke="#8796a0" stroke-width="2" fill="none"/><rect x="340" y="200" width="180" height="70" rx="10" fill="#173b50"/><text x="430" y="242" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">The business</text><rect x="40" y="90" width="192" height="70" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><text x="136" y="119" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Owners / shareholders</text><text x="136" y="142" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">profit, dividends, share value</text><rect x="40" y="205" width="192" height="70" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><text x="136" y="234" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Managers</text><text x="136" y="257" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">salary, bonus, status, growth</text><rect x="40" y="320" width="192" height="70" rx="8" fill="#e6eff5" stroke="#246b8e" stroke-width="2"/><text x="136" y="349" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Employees</text><text x="136" y="372" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">fair pay, job security, conditions</text><rect x="598" y="52" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Customers</text><text x="716" y="96" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">quality, low prices, service</text><rect x="598" y="120" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="143" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Suppliers</text><text x="716" y="164" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">regular orders, prompt payment</text><rect x="598" y="188" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="211" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Banks and lenders</text><text x="716" y="232" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">interest paid, loan repaid</text><rect x="598" y="256" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="279" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Government</text><text x="716" y="300" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">tax, jobs, obeying the law</text><rect x="598" y="324" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="347" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Local community</text><text x="716" y="368" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">jobs, little pollution or noise</text><rect x="598" y="392" width="236" height="56" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><text x="716" y="415" font-family="Arial" font-size="16" font-weight="bold" fill="#173b50" text-anchor="middle">Pressure groups</text><text x="716" y="436" font-family="Arial" font-size="13" fill="#173b50" text-anchor="middle">ethical, green behaviour</text><g font-family="Arial" font-size="18" font-weight="bold"><text x="30" y="30" fill="#246b8e">Internal stakeholders</text><text x="585" y="30" fill="#c16b20">External stakeholders</text></g><g font-family="Arial" font-size="15" fill="#a33a2b" text-anchor="middle"><text x="430" y="330">Conflict example: higher wages</text><text x="430" y="350">please employees but cut</text><text x="430" y="370">shareholders' dividends</text></g><text x="25" y="488" font-family="Arial" font-size="14" fill="#555">Internal stakeholders work in or own the business; external stakeholders are outside it but affected by it.</text></svg>
