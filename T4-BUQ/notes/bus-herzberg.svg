<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"><rect width="860" height="470" fill="white"/><path d="M60 70H800M60 70l12-7M60 70l12 7M800 70l-12-7M800 70l-12 7" stroke="#233b4d" stroke-width="2" fill="none"/><path d="M430 58V82" stroke="#233b4d" stroke-width="3"/><g font-family="Arial" font-size="16" fill="#173b50"><text x="60" y="46">Dissatisfied</text><text x="430" y="46" text-anchor="middle">Neutral (no dissatisfaction)</text><text x="800" y="46" text-anchor="end">Motivated</text></g><rect x="60" y="110" width="350" height="300" rx="8" fill="#fbeee2" stroke="#c16b20" stroke-width="2"/><rect x="450" y="110" width="350" height="300" rx="8" fill="#e3f1ea" stroke="#24775c" stroke-width="2"/><path d="M235 100V84M235 84l-6 9M235 84l6 9M625 100V84M625 84l-6 9M625 84l6 9" stroke="#8796a0" stroke-width="2" fill="none"/><g font-family="Arial" fill="#173b50"><text x="80" y="144" font-size="21" font-weight="bold" fill="#c16b20">Hygiene factors</text><text x="80" y="170" font-size="15">Missing: dissatisfaction. Met: no</text><text x="80" y="188" font-size="15">dissatisfaction, but no extra motivation.</text><text x="470" y="144" font-size="21" font-weight="bold" fill="#24775c">Motivators</text><text x="470" y="170" font-size="15">Present: job satisfaction, so higher</text><text x="470" y="188" font-size="15">motivation and productivity.</text></g><g font-family="Arial" font-size="17" fill="#173b50"><text x="90" y="226">• pay</text><text x="90" y="254">• working conditions</text><text x="90" y="282">• job security</text><text x="90" y="310">• company policy and rules</text><text x="90" y="338">• relationship with managers</text><text x="90" y="366">• relationships with colleagues</text><text x="90" y="394">• status</text><text x="480" y="226">• achievement</text><text x="480" y="254">• recognition</text><text x="480" y="282">• responsibility</text><text x="480" y="310">• interesting, challenging work</text><text x="480" y="338">• promotion</text><text x="480" y="366">• personal growth</text></g><text x="60" y="448" font-family="Arial" font-size="15" fill="#555">Herzberg's two-factor theory: fix hygiene factors to remove grievances, then enrich the job to motivate.</text></svg>
