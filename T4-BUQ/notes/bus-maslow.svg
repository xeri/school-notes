<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"><rect width="860" height="470" fill="white"/><g stroke="white" stroke-width="3"><path d="M300 40L352 116H248Z" fill="#7a4e9c"/><path d="M248 116H352L404 192H196Z" fill="#246b8e"/><path d="M196 192H404L456 268H144Z" fill="#24775c"/><path d="M144 268H456L508 344H92Z" fill="#c16b20"/><path d="M92 344H508L560 420H40Z" fill="#a33a2b"/></g><g fill="white" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle"><text x="300" y="100">5</text><text x="300" y="161">4 Esteem</text><text x="300" y="237">3 Social</text><text x="300" y="313">2 Safety</text><text x="300" y="389">1 Physiological</text></g><g stroke="#8796a0" stroke-dasharray="4 4"><path d="M340 78H590M392 154H590M444 230H590M496 306H590M548 382H590"/></g><g font-family="Arial" font-size="17" fill="#173b50"><text x="598" y="74" font-weight="bold">Self-actualisation</text><text x="598" y="94">challenging work, development</text><text x="598" y="150" font-weight="bold">Esteem</text><text x="598" y="170">recognition, status, praise</text><text x="598" y="226" font-weight="bold">Social (belonging)</text><text x="598" y="246">teamworking, social events</text><text x="598" y="302" font-weight="bold">Safety (security)</text><text x="598" y="322">job security, contract, safe work</text><text x="598" y="378" font-weight="bold">Physiological</text><text x="598" y="398">pay for food and shelter, breaks</text></g><path d="M30 410V60M30 60l-7 12M30 60l7 12" stroke="#173b50" stroke-width="2" fill="none"/><text x="19" y="250" font-family="Arial" font-size="15" fill="#173b50" transform="rotate(-90 19 250)" text-anchor="middle">move up once the level below is met</text><text x="40" y="455" font-family="Arial" font-size="14" fill="#555">Maslow's hierarchy of needs. Right: how a business can meet each level.</text></svg>
