<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460"><rect width="860" height="460" fill="white"/><path d="M100 40V390H800" stroke="#233b4d" stroke-width="2" fill="none"/><path d="M140 90C250 300 330 330 440 330C550 330 630 300 740 110" stroke="#246b8e" stroke-width="3" fill="none"/><path d="M440 330V390" stroke="#8796a0" stroke-dasharray="5 5"/><circle cx="440" cy="330" r="6" fill="#173b50"/><path d="M250 145L318 288M318 288l-1-12M318 288l-9-8" stroke="#24775c" stroke-width="2" fill="none"/><path d="M600 145L580 292M580 292l-5-11M580 292l7-9" stroke="#a33a2b" stroke-width="2" fill="none"/><g font-family="Arial" font-size="17" fill="#173b50"><text x="100" y="26">Average (unit) cost</text><text x="560" y="430">Output / size of the business</text></g><g font-family="Arial" font-size="17" font-weight="bold"><text x="200" y="100" fill="#24775c">Economies of scale</text><text x="500" y="100" fill="#a33a2b">Diseconomies of scale</text></g><g font-family="Arial" font-size="15"><text x="200" y="121" fill="#24775c">average cost falls</text><text x="500" y="121" fill="#a33a2b">average cost rises</text></g><text x="440" y="410" font-family="Arial" font-size="15" fill="#173b50" text-anchor="middle">lowest average cost (optimum size)</text><text x="100" y="452" font-family="Arial" font-size="14" fill="#555">Schematic. Total cost still rises with output; it is the cost per unit that falls, then rises.</text></svg>
