<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330"><rect width="860" height="330" fill="white"/><text x="20" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#173b50">Taylor's scientific management: money is the main motivator</text><g fill="#e6eff5" stroke="#246b8e" stroke-width="2"><rect x="20" y="70" width="140" height="150" rx="8"/><rect x="190" y="70" width="140" height="150" rx="8"/><rect x="360" y="70" width="140" height="150" rx="8"/><rect x="530" y="70" width="140" height="150" rx="8"/><rect x="700" y="70" width="140" height="150" rx="8" fill="#e3f1ea" stroke="#24775c"/></g><g stroke="#233b4d" stroke-width="2" fill="none"><path d="M162 145H186M186 145l-8-5M186 145l-8 5M332 145H356M356 145l-8-5M356 145l-8 5M502 145H526M526 145l-8-5M526 145l-8 5M672 145H696M696 145l-8-5M696 145l-8 5"/></g><g font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle"><text x="90" y="100" font-weight="bold">1 Observe</text><text x="90" y="126">time each task</text><text x="90" y="146">(time-and-</text><text x="90" y="166">motion study)</text><text x="260" y="100" font-weight="bold">2 Simplify</text><text x="260" y="126">find the one</text><text x="260" y="146">quickest method;</text><text x="260" y="166">split into tasks</text><text x="430" y="100" font-weight="bold">3 Train</text><text x="430" y="126">every worker</text><text x="430" y="146">to use that</text><text x="430" y="166">method</text><text x="600" y="100" font-weight="bold">4 Pay</text><text x="600" y="126">piece rate:</text><text x="600" y="146">more output,</text><text x="600" y="166">more pay</text><text x="770" y="100" font-weight="bold">5 Result</text><text x="770" y="126">output rises,</text><text x="770" y="146">unit cost falls,</text><text x="770" y="166">pay covered</text><text x="770" y="186">by extra output</text></g><g font-family="Arial" font-size="16" fill="#a33a2b"><text x="20" y="262">Criticism: assumes everyone works only for money; repetitive tasks are boring and demotivating;</text><text x="20" y="284">piece rate can sacrifice quality; output is hard to count in service and office jobs.</text></g><text x="20" y="318" font-family="Arial" font-size="14" fill="#555">Taylor's model is the basis of piece rate and of flow-production line work.</text></svg>
