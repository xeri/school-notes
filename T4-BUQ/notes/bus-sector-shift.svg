<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440"><rect width="860" height="440" fill="white"/><path d="M100 50V360H640" stroke="#233b4d" stroke-width="2" fill="none"/><rect x="140" y="180" width="110" height="180" fill="#24775c" stroke="white" stroke-width="2"/><text x="195" y="276" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">60%</text><rect x="140" y="135" width="110" height="45" fill="#246b8e" stroke="white" stroke-width="2"/><text x="195" y="164" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">15%</text><rect x="140" y="60" width="110" height="75" fill="#c16b20" stroke="white" stroke-width="2"/><text x="195" y="104" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">25%</text><text x="195" y="384" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle">Low-income</text><rect x="310" y="270" width="110" height="90" fill="#24775c" stroke="white" stroke-width="2"/><text x="365" y="321" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">30%</text><rect x="310" y="195" width="110" height="75" fill="#246b8e" stroke="white" stroke-width="2"/><text x="365" y="238" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">25%</text><rect x="310" y="60" width="110" height="135" fill="#c16b20" stroke="white" stroke-width="2"/><text x="365" y="134" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">45%</text><text x="365" y="384" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle">Middle-income</text><rect x="480" y="351" width="110" height="9" fill="#24775c" stroke="white" stroke-width="2"/><rect x="480" y="291" width="110" height="60" fill="#246b8e" stroke="white" stroke-width="2"/><text x="535" y="327" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">20%</text><rect x="480" y="60" width="110" height="231" fill="#c16b20" stroke="white" stroke-width="2"/><text x="535" y="182" font-family="Arial" font-size="17" font-weight="bold" fill="white" text-anchor="middle">77%</text><text x="535" y="384" font-family="Arial" font-size="16" fill="#173b50" text-anchor="middle">High-income</text><text x="92" y="365" font-family="Arial" font-size="14" fill="#173b50" text-anchor="end">0%</text><text x="92" y="215" font-family="Arial" font-size="14" fill="#173b50" text-anchor="end">50%</text><text x="92" y="65" font-family="Arial" font-size="14" fill="#173b50" text-anchor="end">100%</text><text x="100" y="34" font-family="Arial" font-size="17" fill="#173b50">Share of employment</text><rect x="670" y="104" width="22" height="22" fill="#24775c"/><text x="702" y="120" font-family="Arial" font-size="17" fill="#173b50">Primary</text><rect x="670" y="144" width="22" height="22" fill="#246b8e"/><text x="702" y="160" font-family="Arial" font-size="17" fill="#173b50">Secondary</text><rect x="670" y="184" width="22" height="22" fill="#c16b20"/><text x="702" y="200" font-family="Arial" font-size="17" fill="#173b50">Tertiary</text><g font-family="Arial" font-size="15" fill="#173b50"><text x="670" y="270">As incomes rise,</text><text x="670" y="290">employment moves from</text><text x="670" y="310">primary to secondary,</text><text x="670" y="330">then to tertiary</text><text x="670" y="350">(de-industrialisation).</text></g><text x="100" y="420" font-family="Arial" font-size="14" fill="#555">Illustrative shares to show the pattern, not data for any one country.</text></svg>
