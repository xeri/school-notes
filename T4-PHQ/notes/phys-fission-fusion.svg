</text><text x="620.0" y="380.0" font-family="Arial" font-size="22" fill="#203e50" text-anchor="start">H</text><text x="642.0" y="380.0" font-family="Arial" font-size="22" fill="#203e50" text-anchor="start">→</text><text x="688.0" y="367.9" font-family="Arial" font-size="14" fill="#203e50" text-anchor="end">4</text><text x="688.0" y="384.9" font-family="Arial" font-size="14" fill="#203e50" text-anchor="end">2</text><text x="690.0" y="380.0" font-family="Arial" font-size="22" fill="#203e50" text-anchor="start">He</text><text x="722.0" y="380.0" font-family="Arial" font-size="22" fill="#203e50" text-anchor="start">+</text><text x="758.0" y="367.9" font-family="Arial" font-size="14" fill="#203e50" text-anchor="end">1</text><text x="758.0" y="384.9" font-family="Arial" font-size="14" fill="#203e50" text-anchor="end">0</text><text x="760.0" y="380.0" font-family="Arial" font-size="22" fill="#203e50" text-anchor="start">n</text><text x="778.0" y="380.0" font-family="Arial" font-size="22" fill="#b03a2e" text-anchor="start">+ energy</text><text x="750.0" y="422.0" font-family="Arial" font-size="14" fill="#203e50" text-anchor="middle">A: 2 + 3 = 4 + 1 = 5</text><text x="750.0" y="442.0" font-family="Arial" font-size="14" fill="#203e50" text-anchor="middle">Z: 1 + 1 = 2 + 0 = 2</text><text x="750.0" y="300.0" font-family="Arial" font-size="14" fill="#203e50" text-anchor="middle">In stars: hydrogen nuclei fuse into helium.</text><text x="750.0" y="318.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">Products have slightly less mass: the 'lost' mass is the energy.</text></svg>
