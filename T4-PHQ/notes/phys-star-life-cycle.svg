<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="white"/><text x="500.0" y="30.0" font-family="Arial" font-size="21" fill="#203e50" text-anchor="middle" font-weight="bold">Life cycle of a star</text><rect x="15.0" y="150.0" width="150.0" height="70.0" rx="8" stroke="#203e50" stroke-width="2" fill="#d6e6f0"/><text x="90.0" y="173.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Nebula</text><text x="90.0" y="192.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">cloud of gas and dust</text><text x="90.0" y="211.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">(mostly hydrogen)</text><rect x="200.0" y="150.0" width="145.0" height="70.0" rx="8" stroke="#203e50" stroke-width="2" fill="#f6e3d0"/><text x="272.5" y="173.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Protostar</text><text x="272.5" y="192.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">cloud collapses under</text><text x="272.5" y="211.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">gravity, heats up</text><rect x="380.0" y="150.0" width="165.0" height="70.0" rx="8" stroke="#203e50" stroke-width="2" fill="#fbe9a6"/><text x="462.5" y="173.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Stable star</text><text x="462.5" y="192.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">H fuses to He; gravity in</text><text x="462.5" y="211.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">= outward thermal force</text><rect x="610.0" y="60.0" width="160.0" height="60.0" rx="8" stroke="#203e50" stroke-width="2" fill="#f4c7b8"/><text x="690.0" y="87.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Red giant</text><text x="690.0" y="106.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">H in core used up</text><rect x="810.0" y="50.0" width="175.0" height="80.0" rx="8" stroke="#203e50" stroke-width="2" fill="#e8eef2"/><text x="897.5" y="78.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Planetary nebula</text><text x="897.5" y="97.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">outer layers drift off,</text><text x="897.5" y="116.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">white dwarf at centre</text><rect x="610.0" y="250.0" width="160.0" height="60.0" rx="8" stroke="#203e50" stroke-width="2" fill="#f0b0a0"/><text x="690.0" y="277.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Red supergiant</text><text x="690.0" y="296.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">much more massive star</text><rect x="810.0" y="250.0" width="175.0" height="60.0" rx="8" stroke="#203e50" stroke-width="2" fill="#f6d0c0"/><text x="897.5" y="277.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Supernova</text><text x="897.5" y="296.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">explodes; heavy elements</text><rect x="840.0" y="345.0" width="145.0" height="60.0" rx="8" stroke="#203e50" stroke-width="2" fill="#cfd5da"/><text x="912.5" y="372.0" font-family="Arial" font-size="16" fill="#203e50" text-anchor="middle" font-weight="bold">Neutron star</text><text x="912.5" y="391.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="middle">or black hole</text><line x1="165.0" y1="185.0" x2="192.0" y2="185.0" stroke="#203e50" stroke-width="2"/><path d="M198.0 185.0 L188.9 189.2 L188.9 180.8 Z" fill="#203e50"/><line x1="345.0" y1="185.0" x2="372.0" y2="185.0" stroke="#203e50" stroke-width="2"/><path d="M378.0 185.0 L368.9 189.2 L368.9 180.8 Z" fill="#203e50"/><path d="M545.0 175.0 L580.0 175.0 L580.0 90.0 L606.0 90.0" stroke="#203e50" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M608.0 90.0 L598.9 94.2 L598.9 85.8 Z" fill="#203e50"/><path d="M545.0 195.0 L580.0 195.0 L580.0 280.0 L606.0 280.0" stroke="#203e50" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M608.0 280.0 L598.9 284.2 L598.9 275.8 Z" fill="#203e50"/><text x="590.0" y="140.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="start">less massive</text><text x="590.0" y="156.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="start">(e.g. the Sun)</text><text x="590.0" y="226.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="start">much more</text><text x="590.0" y="242.0" font-family="Arial" font-size="13" fill="#203e50" text-anchor="start">massive</text><line x1="770.0" y1="90.0" x2="802.0" y2="90.0" stroke="#203e50" stroke-width="2"/><path d="M808.0 90.0 L798.9 94.2 L798.9 85.8 Z" fill="#203e50"/><line x1="770.0" y1="280.0" x2="802.0" y2="280.0" stroke="#203e50" stroke-width="2"/><path d="M808.0 280.0 L798.9 284.2 L798.9 275.8 Z" fill="#203e50"/><line x1="912.0" y1="310.0" x2="912.0" y2="337.0" stroke="#203e50" stroke-width="2"/><path d="M912.0 343.0 L907.8 333.9 L916.2 333.9 Z" fill="#203e50"/><path d="M825.0 310.0 L825.0 440.0 L90.0 440.0 L90.0 224.0" stroke="#24775c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M90.0 222.0 L94.6 232.0 L85.4 232.0 Z" fill="#24775c"/><text x="450.0" y="432.0" font-family="Arial" font-size="14" fill="#24775c" text-anchor="middle">the supernova's nebula (hydrogen + new heavier elements) can form new stars and planets</text></svg>
