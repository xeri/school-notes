<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420"><rect width="920" height="420" fill="white"/><path d="M110.0 200.0 L110.0 70.0 L330.0 70.0 L330.0 110.0" stroke="#203e50" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="316.0" y="110.0" width="28.0" height="80.0" rx="0" stroke="#203e50" stroke-width="3" fill="white"/><text x="306.0" y="156.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="end" font-weight="bold">R1</text><line x1="330.0" y1="190.0" x2="330.0" y2="250.0" stroke="#203e50" stroke-width="3"/><rect x="316.0" y="250.0" width="28.0" height="80.0" rx="0" stroke="#203e50" stroke-width="3" fill="white"/><text x="306.0" y="296.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="end" font-weight="bold">R2</text><path d="M330.0 330.0 L330.0 370.0 L110.0 370.0 L110.0 236.0" stroke="#203e50" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="80.0" y1="205.0" x2="140.0" y2="205.0" stroke="#203e50" stroke-width="3"/><line x1="95.0" y1="231.0" x2="125.0" y2="231.0" stroke="#203e50" stroke-width="7"/><line x1="110.0" y1="200.0" x2="110.0" y2="205.0" stroke="#203e50" stroke-width="3"/><text x="150.0" y="210.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="start">+</text><text x="60.0" y="226.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="end" font-weight="bold">Vin</text><text x="60.0" y="246.0" font-family="Arial" font-size="15" fill="#203e50" text-anchor="end">6.0 V</text><circle cx="330.0" cy="220.0" r="6" fill="#203e50"/><circle cx="330.0" cy="370.0" r="6" fill="#203e50"/><line x1="330.0" y1="220.0" x2="470.0" y2="220.0" stroke="#203e50" stroke-width="3"/><line x1="330.0" y1="370.0" x2="470.0" y2="370.0" stroke="#203e50" stroke-width="3"/><circle cx="470.0" cy="220.0" r="7.0" stroke="#203e50" stroke-width="2.5" fill="white"/><circle cx="470.0" cy="370.0" r="7.0" stroke="#203e50" stroke-width="2.5" fill="white"/><line x1="490.0" y1="234.6" x2="490.0" y2="355.4" stroke="#c16b20" stroke-width="2.5"/><path d="M490.0 362.0 L485.4 352.0 L494.6 352.0 Z" fill="#c16b20"/><path d="M490.0 228.0 L494.6 238.0 L485.4 238.0 Z" fill="#c16b20"/><text x="502.0" y="302.0" font-family="Arial" font-size="18" fill="#c16b20" text-anchor="start" font-weight="bold">Vout</text><text x="502.0" y="322.0" font-family="Arial" font-size="14" fill="#c16b20" text-anchor="start">(p.d. across R2)</text><text x="600.0" y="90.0" font-family="Arial" font-size="15" fill="#203e50" text-anchor="start">Series: same current, so the p.d. splits</text><text x="600.0" y="110.0" font-family="Arial" font-size="15" fill="#203e50" text-anchor="start">in the ratio of the resistances:</text><text x="640.0" y="145.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="start" font-weight="bold">V1 / V2 = R1 / R2</text><text x="640.0" y="180.0" font-family="Arial" font-size="18" fill="#203e50" text-anchor="start" font-weight="bold">Vout = Vin × R2 / (R1 + R2)</text><text x="600.0" y="220.0" font-family="Arial" font-size="14" fill="#203e50" text-anchor="start">Example: R1 = 2.0 kΩ, R2 = 4.0 kΩ, Vin = 6.0 V</text><text x="600.0" y="240.0" font-family="Arial" font-size="14" fill="#203e50" text-anchor="start">Vout = 6.0 × 4.0 / 6.0 = 4.0 V</text><text x="600.0" y="280.0" font-family="Arial" font-size="14" fill="#b03a2e" text-anchor="start">Make R2 a thermistor: hotter → R2 falls</text><text x="600.0" y="300.0" font-family="Arial" font-size="14" fill="#b03a2e" text-anchor="start">→ Vout falls. Make R2 an LDR: darker</text><text x="600.0" y="320.0" font-family="Arial" font-size="14" fill="#b03a2e" text-anchor="start">→ R2 rises → Vout rises (night light).</text></svg>
