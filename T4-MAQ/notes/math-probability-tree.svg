eight="bold">Blue</text><line x1="334" y1="320" x2="526" y2="265" stroke="#233b4d" stroke-width="2"/><text x="426" y="284.5" font-family="Arial" font-size="17" fill="#246b8e" text-anchor="end" font-weight="bold">5/7</text><text x="560" y="271" font-family="Arial" font-size="17" fill="#b23a3a" text-anchor="middle" font-weight="bold">Red</text><text x="640" y="271" font-family="Arial" font-size="15" fill="#173b50" text-anchor="start">P(B, R) = 15/56</text><line x1="334" y1="320" x2="526" y2="375" stroke="#233b4d" stroke-width="2"/><text x="426" y="367.5" font-family="Arial" font-size="17" fill="#246b8e" text-anchor="end" font-weight="bold">2/7</text><text x="560" y="381" font-family="Arial" font-size="17" fill="#246b8e" text-anchor="middle" font-weight="bold">Blue</text><text x="640" y="381" font-family="Arial" font-size="15" fill="#173b50" text-anchor="start">P(B, B) = 6/56</text><text x="60" y="418" font-family="Arial" font-size="13" fill="#173b50" text-anchor="start">5 red and 3 blue counters, two taken without replacement.  Multiply along a path; add between paths; total = 56/56 = 1.</text></svg>
