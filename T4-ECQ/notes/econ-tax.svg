"17" fill="#173b50" text-anchor="end">0</text><text x="88.0" y="46.0" font-family="Arial" font-size="17" fill="#173b50">Price ($ per unit)</text><text x="705.0" y="448.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity per week</text><text x="636.0" y="383.5" font-family="Arial" font-size="17" fill="#246b8e" font-weight="bold">D</text><text x="666.0" y="105.7" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S1</text><text x="540.0" y="95.1" font-family="Arial" font-size="17" fill="#c16b20" font-weight="bold">S2 = S1 + tax</text><circle cx="356.7" cy="233.2" r="5" fill="#173b50"/><text x="370.7" y="239.2" font-family="Arial" font-size="17" fill="#173b50">E1</text><circle cx="290.0" cy="196.5" r="5" fill="#173b50"/><text x="304.0" y="190.5" font-family="Arial" font-size="17" fill="#173b50">E2</text><text x="82.0" y="202.5" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P2</text><text x="82.0" y="239.2" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P1</text><text x="82.0" y="268.5" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P3</text><text x="290.0" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q2</text><text x="356.7" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q1</text><text x="308.0" y="292.2" font-family="Arial" font-size="15" fill="#6b4c9a">tax per unit</text><text x="147.0" y="219.8" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle">consumers' share</text><text x="234.0" y="252.8" font-family="Arial" font-size="14" fill="#173b50" text-anchor="middle">producers' share</text><text x="20.0" y="492.0" font-family="Arial" font-size="14" fill="#555555">A specific tax shifts supply up by the tax. Price rises P1 to P2 (less than the tax); quantity falls Q1 to Q2. Producers keep P3.</text><text x="20.0" y="514.0" font-family="Arial" font-size="14" fill="#555555">Tax