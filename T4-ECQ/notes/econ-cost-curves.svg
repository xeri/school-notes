"770.0" y="8.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">(b) Average costs</text><text x="20.0" y="492.0" font-family="Arial" font-size="14" fill="#555555">TC = FC + VC. FC is flat; TC sits exactly FC above VC. AFC = FC / output falls continuously as fixed costs are spread.</text><text x="20.0" y="514.0" font-family="Arial" font-size="14" fill="#555555">AVC = VC / output; ATC = TC / output = AFC + AVC, U-shaped. The ATC-AVC gap is AFC, so it narrows as output rises.</text></g></svg>
