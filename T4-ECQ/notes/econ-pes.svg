 x="82.0" y="382.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">0</text><text x="88.0" y="76.0" font-family="Arial" font-size="17" fill="#173b50">Price ($ per unit)</text><text x="445.0" y="408.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity supplied per week</text><text x="260.0" y="40.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">(a) Elastic supply: PES &gt; 1</text><text x="381.2" y="178.0" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S</text><circle cx="203.3" cy="256.0" r="5" fill="#173b50"/><circle cx="316.7" cy="204.0" r="5" fill="#173b50"/><text x="82.0" y="262.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P1</text><text x="82.0" y="210.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P2</text><text x="203.3" y="384.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q1</text><text x="316.7" y="384.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q2</text><text x="100.2" y="120.8" font-family="Arial" font-size="15" fill="#c16b20">price +50%, quantity +100%</text><text x="582.0" y="382.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">0</text><text x="588.0" y="76.0" font-family="Arial" font-size="17" fill="#173b50">Price ($ per unit)</text><text x="945.0" y="408.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity supplied per week</text><text x="760.0" y="40.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">(b) Inelastic supply: PES &lt; 1</text><text x="890.4" y="127.0" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S</text><circle cx="777.0" cy="256.0" r="5" fill="#173b50"/><circle cx="819.5" cy="204.0" r="5" fill="#173b50"/><text x="582.0" y="262.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P1</text><text x="582.0" y="210.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P2</text><text x="777.0" y="384.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q1</text><text x="819.5" y="384.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q2</text><text x="600.2" y="120.8" font-family="Arial" font-size="15" fill="#c16b20">price +50%, quantity +23%</text><text x="82.0" y="802.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">0</text><text x="88.0" y="496.0" font-family="Arial" font-size="17" fill="#173b50">Price ($ per unit)</text><text x="445.0" y="828.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity supplied per week</text><text x="260.0" y="460.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">(c) Perfectly inelastic: PES = 0</text><text x="268.0" y="546.2" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S</text><text x="260.0" y="804.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q</text><text x="273.6" y="676.0" font-family="Arial" font-size="15" fill="#c16b20">fixed stock: Q</text><text x="273.6" y="702.0" font-family="Arial" font-size="15" fill="#c16b20">cannot change</text><text x="582.0" y="802.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">0</text><text x="588.0" y="496.0" font-family="Arial" font-size="17" fill="#173b50">Price ($ per unit)</text><text x="945.0" y="828.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity supplied per week</text><text x="760.0" y="460.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle" font-weight="bold">(d) Perfectly elastic: PES = infinity</text><text x="919.0" y="642.0" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S</text><text x="582.0" y="656.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P</text><text x="610.4" y="585.0" font-family="Arial" font-size="15" fill="#c16b20">any amount supplied at P;</text><text x="610.4" y="608.4" font-family="Arial" font-size="15" fill="#c16b20">none at all below it</text><text x="20.0" y="875.0" font-family="Arial" font-size="14" fill="#555555">PES = % change in quantity supplied / % change in price. A straight supply line from the price axis is elastic; from the quantity axis, inelastic.</text></g></svg>
