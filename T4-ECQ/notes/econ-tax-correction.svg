e"/><path d="M342.0 205.0L333.6 208.3" stroke="#b23a3a" stroke-width="2" fill="none"/><path d="M342.0 205.0L334.9 199.4" stroke="#b23a3a" stroke-width="2" fill="none"/><text x="118.0" y="168.0" font-family="Arial" font-size="15" fill="#b23a3a">welfare loss</text><text x="118.0" y="185.0" font-family="Arial" font-size="15" fill="#b23a3a">removed</text><text x="638.0" y="379.5" font-family="Arial" font-size="17" fill="#246b8e" font-weight="bold">D = MPB = MSB</text><text x="696.0" y="122.0" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S1 = MPC</text><text x="530.0" y="100.4" font-family="Arial" font-size="17" fill="#c16b20" font-weight="bold">S2 = MPC + tax = MSC</text><circle cx="373.3" cy="242.3" r="5" fill="#173b50"/><text x="389.3" y="268.3" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">E1</text><circle cx="290.0" cy="196.5" r="5" fill="#173b50"/><text x="294.0" y="182.5" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">E2</text><text x="82.0" y="202.5" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P*</text><text x="82.0" y="248.3" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P1</text><text x="290.0" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q*</text><text x="373.3" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q1</text><text x="20.0" y="492.0" font-family="Arial" font-size="14" fill="#555555">A tax equal to the external cost per unit shifts supply up from MPC to MSC. Price rises P1 to P*; output falls Q1 to Q*.</text><text x="20.0" y="514.0" font-family="Arial" font-size="14" fill="#555555">Output is now at the social optimum (MSB = MSC) and the welfare loss is removed - if the tax matches the external cost.</text></g></svg>