<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550"><rect width="820" height="550" fill="white"/><g transform="translate(0,20)"><path d="M323.3 181.8L406.7 227.7L323.3 264.3Z" stroke="none" fill="#f2d0d0"/><path d="M90.0 55.0L90.0 400.0" stroke="#233b4d" stroke-width="2" fill="none"/><path d="M90.0 400.0L705.0 400.0" stroke="#233b4d" stroke-width="2" fill="none"/><text x="82.0" y="422.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">0</text><text x="88.0" y="46.0" font-family="Arial" font-size="17" fill="#173b50">Costs and benefits ($ per unit)</text><text x="705.0" y="448.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">Quantity per year</text><path d="M90.0 367.0L690.0 103.0" stroke="#24775c" stroke-width="3" fill="none"/><path d="M202.5 400.0L640.0 207.5" stroke="#c16b20" stroke-width="3" fill="none"/><path d="M120.0 152.5L540.0 383.5" stroke="#246b8e" stroke-width="3" fill="none"/><path d="M150.0 86.5L678.0 376.9" stroke="#6b4c9a" stroke-width="3" fill="none"/><path d="M90.0 264.3L323.3 264.3" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M323.3 264.3L323.3 400.0" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M90.0 310.2L406.7 310.2" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M406.7 310.2L406.7 400.0" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M90.0 227.7L406.7 227.7" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M406.7 227.7L406.7 310.2" stroke="#8796a0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><path d="M600.0 146.6L600.0 223.1" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M600.0 223.1L595.5 215.3" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M600.0 223.1L604.5 215.3" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><text x="612.0" y="168.0" font-family="Arial" font-size="15" fill="#6b4c9a">subsidy =</text><text x="612.0" y="185.0" font-family="Arial" font-size="15" fill="#6b4c9a">external benefit</text><path d="M160.0 170.5L160.0 94.0" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M160.0 94.0L164.5 101.8" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M160.0 94.0L155.5 101.8" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M160.0 170.5L155.5 162.7" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><path d="M160.0 170.5L164.5 162.7" stroke="#6b4c9a" stroke-width="2.5" fill="none"/><text x="172.0" y="88.0" font-family="Arial" font-size="15" fill="#6b4c9a">external benefit</text><path d="M253.3 170.0L341.3 225.0" stroke="#b23a3a" stroke-width="2" fill="none"/><path d="M341.3 225.0L332.3 224.7" stroke="#b23a3a" stroke-width="2" fill="none"/><path d="M341.3 225.0L337.1 217.1" stroke="#b23a3a" stroke-width="2" fill="none"/><text x="173.3" y="150.0" font-family="Arial" font-size="15" fill="#b23a3a">welfare loss</text><text x="173.3" y="167.0" font-family="Arial" font-size="15" fill="#b23a3a">removed</text><text x="610.0" y="91.0" font-family="Arial" font-size="17" fill="#24775c" font-weight="bold">S1 = MPC = MSC</text><text x="648.0" y="213.5" font-family="Arial" font-size="17" fill="#c16b20" font-weight="bold">S2 = MPC - subsidy</text><text x="548.0" y="383.5" font-family="Arial" font-size="17" fill="#246b8e" font-weight="bold">D = MPB</text><text x="686.0" y="376.9" font-family="Arial" font-size="17" fill="#6b4c9a" font-weight="bold">MSB</text><circle cx="323.3" cy="264.3" r="5" fill="#173b50"/><text x="313.3" y="284.3" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">E1</text><circle cx="406.7" cy="310.2" r="5" fill="#173b50"/><text x="420.7" y="328.2" font-family="Arial" font-size="17" fill="#173b50">E2</text><text x="82.0" y="233.7" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P3</text><text x="82.0" y="270.3" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P1</text><text x="82.0" y="316.2" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">P2</text><text x="323.3" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q1</text><text x="406.7" y="424.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">Q*</text><text x="20.0" y="492.0" font-family="Arial" font-size="14" fill="#555555">A subsidy equal to the external benefit per unit shifts supply down from S1 to S2. Price falls P1 to P2; output rises Q1 to Q*.</text><text x="20.0" y="514.0" font-family="Arial" font-size="14" fill="#555555">Output is now at the social optimum (MSB = MSC). Producers receive P3. Cost to the government = subsidy x Q*.</text></g></svg>