ill="#173b50"/><text x="340.0" y="208.0" font-family="Arial" font-size="17" fill="#173b50">E</text><text x="82.0" y="228.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="end">W1</text><text x="345.0" y="414.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">N1</text><text x="551.0" y="156.0" font-family="Arial" font-size="17" fill="#c16b20" font-weight="bold">minimum wage</text><text x="82.0" y="172.0" font-family="Arial" font-size="17" fill="#c16b20" text-anchor="end">W2</text><text x="240.0" y="414.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">N3</text><text x="450.0" y="414.0" font-family="Arial" font-size="17" fill="#173b50" text-anchor="middle">N2</text><text x="345.0" y="125.2" font-family="Arial" font-size="17" fill="#6b4c9a" text-anchor="middle">unemployment (excess supply of labour)</text><text x="20.0" y="480.0" font-family="Arial" font-size="14" fill="#555555">Without a minimum wage: wage W1, employment N1. At W2 firms hire N3 (from DL) while N2 want work (from SL).</text><text x="20.0" y="500.0" font-family="Arial" font-size="14" fill="#555555">Employment falls N1 to N3; unemployment is N2 - N3. The loss is smaller when demand for labour is inelastic.</text></g></svg>
